ould answer.","think":"Was Yudhishthira a good man who made a terrible mistake?","sides":["Yes. He kept his word and accepted the punishment honorably.","Gambling away his family was a serious wrong, not just a mistake."]},{"group":3,"year":-200,"approx":true,"kind":"god","title":"Arjuna chooses Krishna","story":"As war loomed, Arjuna and Duryodhana both went to ask Krishna for help. Krishna offered a choice: his huge army, or himself alone, and he would not fight. Duryodhana happily took the army. Arjuna chose Krishna, who became his charioteer.","whoa":"Krishna is believed by Hindus to be an avatar, or earthly form, of the god Vishnu.","question":"What did Arjuna choose?","answer":"Krishna himself","wrong":["Krishna’s army","Gold","Elephants"],"source":"The Mahabharata","more":"Duryodhana thought soldiers were obviously more valuable than one unarmed man. Arjuna chose guidance over force. Krishna’s advice, not his army, turned out to decide the war.","think":"Is wisdom more powerful than strength?","sides":["Yes. Good advice can win where armies fail.","Not always. Without strength, wisdom cannot defend anyone."]},{"group":3,"year":-200,"approx":true,"kind":"lesson","title":"Sanjaya tells the story","story":"The Bhagavad Gita, the “Song of God,” is told by Sanjaya to the blind old king Dhritarashtra, father of the Kauravas. Sanjaya was given special vision so he could see the battlefield from far away. He describes everything that Krishna and Arjuna say.","whoa":"The Gita has 700 verses in 18 chapters.","question":"Who tells the Gita to the blind king?","answer":"Sanjaya","wrong":["Arjuna","Krishna","Ganesha"],"source":"The Bhagavad Gita","more":"Dhritarashtra’s blindness also stands for his refusal to see his son Duryodhana’s wrongs. He could have stopped the war but did not. Sanjaya reports honestly, even when the news is bad for the king.","think":"Why is it hard to see the faults of people we love?","sides":["Love makes us want to believe the best about them.","Admitting their faults can feel like admitting our own."]},{"group":3,"year":-200,"approx":true,"kind":"hero","title":"Arjuna’s doubt","story":"On the battlefield of Kurukshetra, Arjuna asked Krishna to drive his chariot between the two armies. On the other side he saw his teachers, his cousins and his beloved great-uncle Bhishma. Arjuna’s bow slipped from his hands. He did not want to fight his own family.","whoa":"The whole Gita is a conversation that takes place in that chariot, just before the battle begins.","question":"What was the battlefield called?","answer":"Kurukshetra","wrong":["Troy","Hastinapura","Ayodhya"],"source":"The Bhagavad Gita","more":"Arjuna argues that killing his relatives would be wrong and destroy families. His doubts are serious and moving. Some readers think his feelings are the wisest part of the story, while Krishna answers that a warrior must not abandon his duty.","think":"Was Arjuna right to want to walk away from the battle?","sides":["Yes. Refusing to kill family is a deeply moral feeling.","Krishna argues no. Walking away would let injustice win."]},{"group":3,"year":-200,"approx":true,"kind":"lesson","title":"Do your duty","story":"Krishna told Arjuna that he must do his dharma, his rightful duty, as a protector of good. The key, Krishna said, is to act without worrying about winning or losing, or what reward you will get. Doing the right thing for its own sake brings peace.","whoa":"Mohandas Gandhi read the Gita almost every day and called it his guide in hard times.","question":"Krishna said to act without worrying about…","answer":"Rewards","wrong":["Breakfast","The weather","Your clothes"],"source":"The Bhagavad Gita","more":"Krishna’s idea is called nishkama karma: action without attachment to results. It means doing your best and letting go of worry about outcomes. Many people, not just Hindus, have found this idea helpful in work, sport and hard times.","think":"Can you work hard without caring about winning?","sides":["Yes. Focusing on effort, not results, can make you calmer and better.","It is hard. Goals and rewards are what motivate most people."]},{"group":3,"year":-200,"approx":true,"kind":"lesson","title":"The soul never dies","story":"Krishna explained that everyone has an atman, a true self or soul. It is never born and never dies. Just as a person throws away worn-out clothes and puts on new ones, Krishna said, the soul leaves an old body and takes a new one.","whoa":"This idea of the soul being born again and again is called reincarnation.","question":"Krishna compared the body to…","answer":"Clothes","wrong":["A house","A river","A tree"],"source":"The Bhagavad Gita","more":"Hinduism teaches that souls are reborn many times, and that karma, the results of actions, shapes each new life. The goal is moksha, freedom from the cycle of rebirth. Buddhism and Jainism share ideas of rebirth and karma.","think":"How might believing in rebirth change the way someone lives?"},{"group":3,"year":-200,"approx":true,"kind":"god","title":"The universal form","story":"Arjuna asked to see Krishna as he truly is. Krishna gave him divine sight. Arjuna saw the whole universe inside Krishna: countless suns, every god, every living being, all of time. Shaking with awe, Arjuna asked him to return to his gentle, familiar form.","whoa":"J. Robert Oppenheimer, who led the building of the first atomic bomb, said a line from this chapter came to his mind at the first test in 1945.","question":"What did Krishna give Arjuna so he could see?","answer":"Divine sight","wrong":["A telescope","A mirror","A map"],"source":"The Bhagavad Gita","more":"The vision shows Krishna as time itself, creating and destroying everything. Arjuna sees the warriors of both armies already rushing into Krishna’s mouths, showing their fates are sealed. He is so overwhelmed that he begs for Krishna’s familiar, gentle form back.","think":"Why might seeing the “whole picture” be both inspiring and frightening?","sides":["Inspiring. It shows that everything is connected and has meaning.","Frightening. It makes one person seem tiny and powerless."]},{"group":3,"year":-200,"approx":true,"kind":"lesson","title":"Three paths","story":"Krishna described different ways to reach the divine. Karma yoga is the path of selfless action. Jnana yoga is the path of knowledge and wisdom. Bhakti yoga is the path of loving devotion. Krishna said all of them can lead to him.","whoa":"The word yoga comes from a Sanskrit word meaning “to join” or “to yoke.”","question":"Bhakti yoga is the path of…","answer":"Devotion","wrong":["Running","Silence","Fasting"],"source":"The Bhagavad Gita","more":"Krishna gives special praise to bhakti, loving devotion, as a path open to everyone, whatever their learning or status. This idea helped inspire devotional poets and movements across India for centuries. Many people choose a mix of paths.","think":"Which path would suit you best: action, knowledge or devotion?","sides":["Action. Doing good things for others is the clearest way to be good.","Knowledge. Understanding the world helps you know what is truly good."]},{"group":3,"year":-200,"approx":true,"kind":"hero","title":"Eighteen days of war","story":"Arjuna picked up his bow, and the great battle began. It raged for 18 days. The Pandavas won, but almost everyone on both sides was killed. Yudhishthira became king, deeply sad at the cost of victory.","whoa":"The number 18 is everywhere: 18 days of war, 18 armies, 18 chapters of the Gita, and 18 books of the Mahabharata.","question":"How many days did the battle last?","answer":"18","wrong":["7","100","1"],"source":"The Mahabharata","more":"Both sides broke the rules of fair fighting during the war, including the Pandavas, sometimes on Krishna’s advice. After winning, Yudhishthira was so grieved by the deaths that he wanted to give up the throne. The epic ends with the brothers and Draupadi walking toward the Himalayas.","think":"Can a war be just if both sides fight unfairly?","sides":["Yes. The Pandavas’ cause was still right, even if their methods were not.","Unfair fighting stains everyone, and the cost was too high for any victory."]},{"group":4,"year":712,"approx":false,"kind":"creation","title":"Izanagi and Izanami stir the sea","story":"In the beginning, the god Izanagi and the goddess Izanami stood on the Floating Bridge of Heaven. They dipped a jeweled spear into the ocean below and stirred. Drops falling from the spear’s tip piled up into the first island. Then they gave birth to the islands of Japan and many kami, or spirits.","whoa":"The Kojiki, written in 712, is Japan’s oldest surviving book.","question":"What did Izanagi and Izanami stir the sea with?","answer":"A jeweled spear","wrong":["A giant spoon","A tree branch","A sword"],"source":"The Kojiki","more":"In the Kojiki, Izanami spoke first at their wedding ritual, and their first child was born malformed. The other gods told them to redo it with Izanagi speaking first. Today readers notice what this says about how men and women were expected to act in old Japan.","think":"What can a myth tell us about the values of the people who told it?","sides":["A lot. Myths show what a society thought was right and proper.","We should be careful. Myths change over time and do not show everyone’s views."]},{"group":4,"year":712,"approx":false,"kind":"quest","title":"Izanagi in the land of the dead","story":"Izanami died giving birth to the fire god. Heartbroken, Izanagi went down to Yomi, the land of the dead, to bring her back. She asked him not to look at her. He lit a tooth of his comb as a torch and saw that she was rotting. She chased him out, and he sealed the entrance with a huge boulder.","whoa":"Greece’s Orpheus lost his wife by looking back too. Find his story in the Greek book.","question":"What did Izanagi use as a torch?","answer":"A tooth of his comb","wrong":["A candle","A firefly","A lantern"],"source":"The Kojiki","more":"Izanami was furious that Izanagi saw her and sent demons after him. He escaped by throwing things that turned into grapes and bamboo shoots, which the demons stopped to eat. At the boulder, Izanami vowed to kill 1,000 people a day; Izanagi replied he would cause 1,500 to be born.","think":"Why do so many cultures have stories about trying to bring back the dead?","sides":["Because losing someone is one of the hardest things humans face.","Because the stories teach that death must be accepted."]},{"group":4,"year":712,"approx":false,"kind":"god","title":"The sun, the moon and the storm","story":"After escaping Yomi, Izanagi washed himself in a river. When he washed his left eye, Amaterasu, goddess of the sun, was born. From his right eye came Tsukuyomi, god of the moon. From his nose came Susanoo, the wild god of storms and the sea.","whoa":"Japan’s flag shows a red sun, and Japan is often called the Land of the Rising Sun.","question":"Which goddess came from Izanagi’s left eye?","answer":"Amaterasu, the sun","wrong":["Izanami","Tsukuyomi, the moon","Susanoo, the storm"],"source":"The Kojiki","more":"In another story, Tsukuyomi killed a food goddess, and Amaterasu was so angry she refused to see him again. That is why, the story says, the sun and moon are never in the sky together, or rarely. Shinto shrines across Japan honor many kami, or spirits.","think":"Why might people imagine the sun, moon and storms as members of one family?","sides":["Because they are connected in nature and affect each other.","Because family stories are something everyone understands."]},{"group":4,"year":712,"approx":false,"kind":"god","title":"Amaterasu hides in a cave","story":"Susanoo behaved so badly that Amaterasu hid in a cave and shut it with a rock. The whole world went dark. The gods hung a mirror outside, and the goddess Ame-no-Uzume did a wild, funny dance. Everyone roared with laughter. Curious, Amaterasu peeked out, saw her bright reflection, and was pulled back into the world.","whoa":"That mirror is said to be one of Japan’s three imperial treasures.","question":"What made the gods roar with laughter?","answer":"Uzume’s funny dance","wrong":["A clown","A joke from Susanoo","A talking fox"],"source":"The Kojiki","more":"The Grand Shrine of Ise, Japan’s most sacred Shinto shrine, is dedicated to Amaterasu. It is rebuilt every 20 years in the same traditional style, a practice going back over 1,300 years. The story uses laughter and joy, not force, to bring back the sun.","think":"Why was laughter, not force, what brought the sun back?","sides":["Joy draws people out of sadness better than pressure does.","Curiosity. She wanted to know what everyone was laughing about."]},{"group":4,"year":712,"approx":false,"kind":"monster","title":"Susanoo and the eight-headed serpent","story":"Banished from heaven, Susanoo met an old couple weeping. A serpent called Yamata no Orochi, with eight heads and eight tails, had eaten seven of their daughters and was coming for the last. Susanoo set out eight huge vats of strong rice wine. Each head drank and fell asleep, and Susanoo cut the serpent to pieces.","whoa":"Inside one tail he found a magnificent sword, which he gave to Amaterasu to make peace.","question":"How did Susanoo trick the serpent?","answer":"Eight vats of rice wine","wrong":["A magic song","A net of silk","A mirror"],"source":"The Kojiki","more":"Susanoo married the daughter he saved, Kushinadahime, and built a palace in Izumo. The sword Kusanagi became one of Japan’s three imperial treasures. Susanoo changes in the story from troublemaker to hero.","think":"Can a troublemaker become a hero?","sides":["Yes. Susanoo shows people can change and use their wildness for good.","He only became a hero after being punished. Change sometimes needs consequences."]},{"group":4,"year":712,"approx":false,"kind":"lesson","title":"The white hare of Inaba","story":"A hare wanted to cross the sea, so he tricked a line of wani, sea creatures, into lining up so he could “count” them, hopping across their backs. Just before reaching shore he bragged about the trick, and the last one tore off his fur. The kind god Ōkuninushi told him to wash in fresh water and roll in cattail pollen, and his fur grew back.","whoa":"There is a shrine to the white hare in Tottori, Japan, where people pray for good matches.","question":"What healed the hare?","answer":"Fresh water and cattail pollen","wrong":["Salt water","Hot sand","Honey"],"source":"The Kojiki","more":"Ōkuninushi’s many brothers first gave the hare cruel advice: bathe in salt water and lie in the wind, which made the pain worse. Ōkuninushi’s kindness was rewarded when the hare predicted he would marry the princess they were all courting.","think":"Did the hare deserve what happened to him?","sides":["Partly. He tricked the wani and bragged about it.","No. Losing his fur was far too harsh, and the brothers’ cruelty was worse."]},{"group":4,"year":712,"approx":false,"kind":"god","title":"Ninigi comes down from heaven","story":"Amaterasu sent her grandson Ninigi to rule the earth. She gave him three treasures: a sacred mirror, a curved jewel and the sword from the serpent’s tail. He came down from heaven onto a mountain peak on the island of Kyushu.","whoa":"In Japanese tradition, Japan’s first emperor, Jimmu, was Ninigi’s great-grandson.","question":"Which treasures did Ninigi bring?","answer":"A mirror, a jewel and a sword","wrong":["A crown, a ring and a cup","A bow, arrows and a horse","Rice, tea and silk"],"source":"The Kojiki","more":"The three treasures are mirror, jewel and sword. They are still part of a Japanese emperor’s enthronement ceremony, though they are never shown to the public. After World War II, Emperor Hirohito publicly said he was not a living god.","think":"Why would rulers want to be connected to gods?","sides":["It makes their power seem natural and unquestionable.","It gives people a sense of continuity and identity."]},{"group":4,"year":712,"approx":false,"kind":"lesson","title":"The blossom princess","story":"Ninigi fell in love with Konohanasakuya-hime, the princess of cherry blossoms. Her father also offered her sister Iwanaga-hime, princess of rocks, who would have given lasting life. Ninigi sent the rock princess away. So, the story says, human lives are as short and beautiful as blossoms.","whoa":"Konohanasakuya-hime is honored as the goddess of Mount Fuji.","question":"Why are human lives short, in this story?","answer":"Ninigi chose the blossom over the rock","wrong":["A demon cursed them","They ate the wrong fruit","The sun got angry"],"source":"The Kojiki","more":"Cherry blossoms bloom for only about a week, and their beauty is tied to how quickly they pass. Japanese people gather for hanami, blossom-viewing parties. The story connects human life to that same short beauty.","think":"Would you choose a long, plain life or a short, beautiful one?","sides":["Long. More time means more chances to grow and enjoy life.","Beautiful. What matters is how fully you live, not how long."]},{"group":4,"year":712,"approx":false,"kind":"quest","title":"Sea-luck and Mountain-luck","story":"Two brothers had special gifts: Umisachi was lucky at fishing, Yamasachi at hunting. They swapped tools for a day, and Yamasachi lost his brother’s favorite fishhook. Searching for it, he went down to the palace of the sea god, married the sea god’s daughter, and returned with jewels that controlled the tides.","whoa":"The sea god found the hook stuck in a fish’s throat.","question":"What did Yamasachi lose?","answer":"His brother’s fishhook","wrong":["His bow","His boat","His shoes"],"source":"The Kojiki","more":"With the tide jewels, Yamasachi could raise and lower the sea. He used them to defeat his brother, who had refused to forgive him for the lost hook. The story says Yamasachi’s grandson became Japan’s first emperor.","think":"Was Umisachi unfair to demand his exact hook back?","sides":["Yes. Yamasachi offered many new hooks, and he should have forgiven him.","No. It was his favorite tool, and he had the right to want it back."]},{"group":4,"year":712,"approx":false,"kind":"hero","title":"Yamato Takeru and the grass-cutter","story":"Prince Yamato Takeru was a fearless warrior sent to fight his father’s enemies. Once, enemies set fire to a grassy plain to trap him. He swung his sword to cut the grass around him and used fire-making stones to set a counter-fire, and escaped.","whoa":"The sword was renamed Kusanagi, meaning “grass-cutter.” It is the same sword Susanoo found in the serpent.","question":"What does Kusanagi mean?","answer":"Grass-cutter","wrong":["Dragon-slayer","Thunder-sword","Sun-blade"],"source":"The Kojiki","more":"Yamato Takeru was so fierce that his father sent him on dangerous mission after mission, perhaps to keep him away. He disguised himself as a girl to defeat two warriors. He died far from home, and legend says his soul flew away as a white bird.","think":"Is it possible to be too strong or too fierce?","sides":["Yes. His fierceness made even his father fear him.","No. His strength protected his people from enemies."]},{"group":5,"year":1850,"approx":true,"kind":"creation","title":"Taʻaroa in his shell","story":"In Tahitian tradition, the creator Taʻaroa lived alone in darkness inside a shell, like an egg, floating in empty space. At last he cracked it open. He used the shell to make the sky and the rocks, and his own body to make the world. His feathers became the trees and plants.","whoa":"In other Polynesian islands he is called Tangaroa or Kanaloa, god of the ocean.","question":"What did Taʻaroa live inside?","answer":"A shell","wrong":["A cave","A volcano","A cloud"],"source":"Tahitian tradition","more":"Polynesian islands share many gods but tell their stories differently. In Hawaiʻi, Kanaloa is god of the ocean; in Māori tradition, Tangaroa rules the sea and its creatures. Islands across thousands of kilometers of ocean kept these connected traditions alive.","think":"How do stories change as people move to new places?","sides":["They adapt to new lands, plants and seas.","Their core stays the same, keeping people connected to where they came from."]},{"group":5,"year":1850,"approx":true,"kind":"creation","title":"Rangi and Papa","story":"In Māori tradition, Ranginui the Sky Father and Papatūānuku the Earth Mother held each other so tightly that their children lived in darkness between them. The children argued about what to do. Tāne, god of the forests, lay on his back and pushed them apart with his strong legs, and light flooded in.","whoa":"Rangi still weeps for Papa. His tears are the rain and dew, and her sighs are the mist that rises to him.","question":"Who pushed the sky and earth apart?","answer":"Tāne","wrong":["Māui","Pele","Kupe"],"source":"Māori tradition","more":"Not all the children agreed to separate their parents. Tāwhirimātea, god of winds and storms, was furious and still attacks his brothers with storms. The story explains rain, mist, winds and why the sea and the forest are always in conflict.","think":"Did Tāne do the right thing by separating his parents?","sides":["Yes. It brought light so life could grow.","It caused his parents endless grief and started a family feud."]},{"group":5,"year":1850,"approx":true,"kind":"creation","title":"Tāne makes the first person","story":"Tāne wanted to create people. At a place called Kurawaka, he shaped a woman from red earth and breathed life into her nostrils. She sneezed and came alive. Her name was Hine-ahu-one, the “earth-formed maiden.”","whoa":"Māori greet each other with the hongi, pressing noses and foreheads and sharing breath.","question":"What did Tāne shape the first woman from?","answer":"Red earth","wrong":["Wood","Stone","Sea foam"],"source":"Māori tradition","more":"Tāne is also god of forests and birds, and every tree is seen as one of his children. The giant kauri tree called Tāne Mahuta, in Waipoua Forest in New Zealand, is about 2,000 years old. In Māori tradition, people are related to the land and the creatures in it.","think":"How might seeing people as part of nature change how we treat the environment?","sides":["We would protect forests and seas like family.","It is a good idea, but people also need to use nature to live."]},{"group":5,"year":1850,"approx":true,"kind":"hero","title":"Māui fishes up the islands","story":"Māui was a clever trickster demigod. He made a magic fishhook from his grandmother’s jawbone and hid in his brothers’ canoe. Far out at sea, he dropped the hook and pulled up an enormous fish that became land. In New Zealand that fish is the North Island, and in Hawaiʻi Māui pulls up the Hawaiian Islands.","whoa":"The Māori name for New Zealand’s North Island is Te Ika-a-Māui, “the fish of Māui.”","question":"What is New Zealand’s North Island called in Māori?","answer":"Te Ika-a-Māui","wrong":["Aotearoa","Hawaiki","Tāne Mahuta"],"source":"Told across Polynesia","more":"In Māori tradition, the South Island is Māui’s canoe and Stewart Island its anchor stone. While Māui went to make offerings, his brothers cut up the fish, which is why the land has mountains and valleys. Māui is a trickster who uses cleverness more than strength.","think":"Why are tricksters so popular in stories around the world?","sides":["They show that small, clever people can beat big, powerful ones.","They are funny and break rules people secretly wish they could break."]},{"group":5,"year":1850,"approx":true,"kind":"hero","title":"Māui slows the sun","story":"Long ago the sun raced across the sky so fast that days were too short to dry tapa cloth or cook food. Māui and his brothers wove strong ropes and hid near where the sun rose. When it peeked up, they lassoed it. The sun begged to be let go and promised to travel slowly.","whoa":"In Hawaiʻi, this happened on the mountain Haleakalā, “house of the sun.”","question":"What did Māui use to catch the sun?","answer":"Ropes","wrong":["A net of feathers","A giant hook","A spear"],"source":"Told across Polynesia","more":"In Māori versions, Māui beat the sun with a magic jawbone weapon until it agreed to slow down. The story explains why days are long enough to work and rest. Hawaiian versions say Māui did it for his mother Hina, whose tapa cloth would not dry.","think":"If you could change one thing about nature, what would it be?","sides":["Something helpful, like making storms less destructive.","Nothing. Changing nature, as Māui did, could have unexpected effects."]},{"group":5,"year":1850,"approx":true,"kind":"hero","title":"Māui steals fire","story":"Māui put out every fire in the village, then went to Mahuika, goddess of fire, to get more. She gave him one of her burning fingernails, and he put it out on purpose and came back for another, again and again. At last she flung fire everywhere. Māui escaped, and the fire hid inside certain trees.","whoa":"That is why, the story says, you can make fire by rubbing sticks of those trees together.","question":"Where did the fire hide?","answer":"Inside trees","wrong":["In the ocean","In the clouds","In a cave"],"source":"Māori tradition","more":"Mahuika is Māui’s ancestor, so he was tricking his own family. To escape her flames, Māui turned into a hawk and called on the rain, which almost put out fire forever. The few sparks left hid in trees.","think":"Was Māui a hero or a troublemaker for stealing fire?","sides":["A hero. People needed fire, and he got it for them.","A troublemaker. He tricked his ancestor and nearly destroyed fire completely."]},{"group":5,"year":1850,"approx":true,"kind":"lesson","title":"Māui and the goddess of death","story":"Māui wanted to win everlasting life for people. He planned to crawl through the body of Hine-nui-te-pō, goddess of death, while she slept. He told the birds to stay silent. But the little fantail bird thought it looked so funny that it laughed out loud, and the goddess woke.","whoa":"Because of this, the story says, all living things must one day die.","question":"Which bird laughed and woke the goddess?","answer":"The fantail","wrong":["The kiwi","The owl","The parrot"],"source":"Māori tradition","more":"Māui had been warned that his baptism ritual was done wrongly, which meant he would die. His death is one of the few times the trickster fails. The fantail, called pīwakawaka, is sometimes linked with death in Māori tradition because of this story.","think":"Why do so many myths explain why people must die?","sides":["To help people accept death as a natural part of life.","To warn against pride. Even the cleverest cannot cheat death."]},{"group":5,"year":1850,"approx":true,"kind":"god","title":"Hina in the moon","story":"Hina worked hard making tapa, cloth beaten from tree bark. She grew tired of her endless chores and the noisy world. One night she climbed up a rainbow (or paddled her canoe, in some islands) all the way to the moon, where she found peace.","whoa":"On a full moon, some people say you can see Hina beating her tapa cloth.","question":"What does Hina make on the moon?","answer":"Tapa cloth","wrong":["Bread","Pottery","Canoes"],"source":"Hawaiian tradition","more":"Hina appears in stories across Polynesia, sometimes as Māui’s mother or sister, sometimes as his wife. In Tahiti, she sails to the moon in her canoe. Her story is about a woman choosing her own peace.","think":"Was Hina right to leave her old life behind?","sides":["Yes. Everyone deserves rest and peace.","Leaving responsibilities behind can hurt the people who depend on you."]},{"group":5,"year":1850,"approx":true,"kind":"god","title":"Pele, goddess of volcanoes","story":"Pele, goddess of fire, sailed by canoe from far away looking for a home. On each island she dug a fire pit, but her sister Nāmaka, goddess of the sea, flooded it. Pele kept moving southeast from island to island. Now she lives in Kīlauea, on Hawaiʻi’s Big Island, one of the most active volcanoes on Earth.","whoa":"The myth matches the science: the Hawaiian Islands really do get younger and more volcanic toward the southeast.","question":"Where does Pele live now?","answer":"Kīlauea","wrong":["Mount Fuji","Vesuvius","Haleakalā"],"source":"Hawaiian tradition","more":"Pele is still honored in Hawaiʻi. Some people leave offerings at Kīlauea, and a legend says taking lava rocks home brings bad luck. Every year, people mail rocks back to the national park. Pele’s sister Hiʻiaka has her own long story of adventure.","think":"Can a myth and science both be true in their own ways?","sides":["Yes. The myth explains meaning, and science explains how volcanoes work.","They answer different questions, so we should not mix them up."]},{"group":5,"year":1850,"approx":true,"kind":"quest","title":"Kupe finds Aotearoa","story":"The great voyager Kupe chased a giant octopus across the ocean from Hawaiki. After a long journey, his wife Kuramārōtini spotted a long white cloud on the horizon. Beneath it lay a new land. Kupe defeated the octopus and explored the coast.","whoa":"Aotearoa, the Māori name for New Zealand, means “land of the long white cloud.”","question":"What does Aotearoa mean?","answer":"Land of the long white cloud","wrong":["Island of fire","Home of the octopus","Big fish"],"source":"Māori tradition","more":"Different Māori tribes tell Kupe’s story differently, and some place it before the great canoe migrations. Kupe returned to Hawaiki and gave sailing directions to New Zealand. Archaeologists date the first settlement of New Zealand to around 1250–1300.","think":"Why do different tribes tell the same story differently?","sides":["Each tribe tells the version linked to its own ancestors and land.","Oral stories change naturally as they are passed down."]},{"group":5,"year":1850,"approx":true,"kind":"quest","title":"Hawaiki and the wayfinders","story":"Many Polynesian peoples tell of Hawaiki, the homeland their ancestors sailed from in great voyaging canoes. Navigators called wayfinders crossed thousands of kilometers of open ocean without maps or instruments. They read the stars, the shape of the waves, the clouds and the flight of birds.","whoa":"In 1976, the canoe Hōkūleʻa sailed from Hawaiʻi to Tahiti using only these old methods, guided by navigator Mau Piailug.","question":"How did wayfinders find their way?","answer":"Stars, waves and birds","wrong":["A compass","GPS","Paper maps"],"source":"Told across Polynesia","more":"Polynesian voyagers settled islands from Hawaiʻi to New Zealand to Rapa Nui, mostly between about 1000 BC and AD 1300. For a long time, some Europeans believed Polynesians reached islands by accident. The Hōkūleʻa voyage proved deliberate navigation was possible, and it helped revive wayfinding.","think":"Why did it matter to prove that Polynesian voyages were deliberate?","sides":["It honored the real skill and knowledge of Polynesian navigators.","It corrected an unfair assumption that only Europeans could navigate oceans."]},{"group":6,"year":1220,"approx":true,"kind":"creation","title":"Ymir and the making of the world","source":"Snorri Sturluson’s Prose Edda","story":"Before the world, there was Ginnungagap, a vast empty gap between a land of ice and a land of fire. Where ice met heat, it melted into the frost giant Ymir and a giant cow. The god Odin and his brothers killed Ymir and built the world from his body: his flesh became the earth, his blood the sea, his bones the mountains and his skull the sky.","whoa":"Four dwarves named North, South, East and West hold up the corners of the sky.","question":"What became the sky?","answer":"Ymir’s skull","wrong":["A giant shield","Odin’s cloak","A frozen lake"],"more":"The cow, Auðumbla, licked salty ice blocks and slowly uncovered Búri, the first god and Odin’s grandfather. Snorri was an Icelandic Christian writing about 200 years after Iceland became Christian, so he may have shaped the old stories as he retold them.","think":"Why do many creation stories describe the world being built from a giant’s body?","sides":["Because it makes the world feel alive, like a body with bones and blood.","Because it shows creation as costly: something had to end for the world to begin."]},{"group":6,"year":1220,"approx":true,"kind":"creation","title":"Yggdrasil, the world tree","source":"Snorri Sturluson’s Prose Edda","story":"A giant ash tree called Yggdrasil holds the nine worlds together, from Asgard, home of the gods, to Midgard, home of humans, to icy realms below. Three women called the Norns live at its roots and weave the fate of every living thing.","whoa":"A squirrel named Ratatoskr runs up and down the tree carrying insults between an eagle at the top and a dragon at the bottom.","question":"Who weaves fate at the roots of Yggdrasil?","answer":"The Norns","wrong":["The Valkyries","The dwarves","The frost giants"],"more":"A dragon named Níðhöggr gnaws at the tree’s roots, and deer nibble its leaves, yet it survives. The Norns water it every day from a sacred well. Many cultures have a world tree linking the heavens, earth and underworld.","think":"If the Norns weave everyone’s fate, do the gods and humans have any real choice?","sides":["No. Even Odin cannot escape what the Norns have woven.","Yes. You cannot change your fate, but you can choose to face it bravely, which is what the Norse admired."]},{"group":6,"year":1220,"approx":true,"kind":"god","title":"Odin gives an eye for wisdom","source":"Snorri Sturluson’s Prose Edda","story":"Odin, chief of the gods, wanted to know everything. At the roots of Yggdrasil was Mímir’s well, whose water held deep wisdom. The price for one drink was an eye. Odin plucked out his own eye and dropped it into the well.","whoa":"Odin also had two ravens, Huginn and Muninn, meaning Thought and Memory, who flew around the world each day and reported back to him.","question":"What did Odin give up to drink from Mímir’s well?","answer":"One of his eyes","wrong":["His spear","His horse","His voice"],"more":"Odin is often shown as a wandering old man in a wide hat and a cloak, hiding his missing eye. He was god of wisdom, poetry, war and death. Norse warriors who died bravely were said to join him in his hall, Valhalla.","think":"What would you give up to gain great wisdom?","sides":["A lot. Knowing more helps you make better choices for yourself and others.","Very little. Some sacrifices are too high, and wisdom can also be learned slowly."]},{"group":6,"year":1270,"approx":true,"kind":"god","title":"Odin discovers the runes","source":"The Poetic Edda","story":"In the poem Hávamál, Odin hangs himself on the world tree for nine nights, wounded by his own spear, with no food or drink. On the last night he looks down and sees the runes, magic letters of power and wisdom. He grabs them and falls, screaming.","whoa":"Runes were a real alphabet. Thousands of runestones still stand in Scandinavia, many carved by Viking Age families to remember the dead.","question":"What did Odin discover after nine nights on the tree?","answer":"The runes","wrong":["Fire","The world serpent","A golden ring"],"more":"The rune alphabet is called the futhark, after its first six letters. People carved runes into wood, stone and metal for names, messages and magic. Hávamál also contains Odin’s advice on friendship, being a good guest and not drinking too much.","think":"Why do you think the Norse imagined that wisdom comes through suffering?","sides":["Because hard experiences really do teach lessons that comfort cannot.","It is a myth. People can also learn through joy, curiosity and patience."]},{"group":6,"year":1220,"approx":true,"kind":"lesson","title":"Loki and the gifts of the dwarves","source":"Snorri Sturluson’s Prose Edda","story":"As a prank, the trickster Loki cut off all the golden hair of Thor’s wife, Sif. To escape Thor’s fury, he got dwarves to make her new hair of real gold. Then Loki bet two other dwarf smiths his own head that they could not make better treasures. They forged Thor’s hammer, Mjölnir, among other wonders.","whoa":"Loki turned into a fly and stung the smith while he worked, which is why Mjölnir’s handle came out short.","question":"Why is Mjölnir’s handle so short?","answer":"Loki, as a fly, stung the smith","wrong":["Thor broke it","The dwarves ran out of iron","Odin wanted it small"],"more":"The dwarves won the bet, but Loki argued they could have his head only, not his neck. They sewed his lips shut instead. The contest also produced Odin’s spear Gungnir, a magic ship that folds into a pocket, and a gold ring that makes eight new rings every ninth night.","think":"Is Loki a villain or a useful troublemaker?","sides":["A troublemaker who helps. His tricks gave the gods their greatest treasures.","A villain. He causes harm for fun, and it gets worse over time."]},{"group":6,"year":1220,"approx":true,"kind":"lesson","title":"The giant who built Asgard’s wall","source":"Snorri Sturluson’s Prose Edda","story":"A builder offered to build a wall around Asgard in one winter. His price: the goddess Freyja, the sun and the moon. The gods agreed, sure he would fail, but his magic horse hauled stones so fast he nearly finished. Loki turned himself into a mare and lured the horse away, and the wall was left undone.","whoa":"Later Loki gave birth to Sleipnir, an eight-legged horse that became Odin’s steed.","question":"How many legs did Sleipnir have?","answer":"Eight","wrong":["Four","Six","Twelve"],"more":"The builder turned out to be a giant in disguise, and Thor killed him, breaking the gods’ promise of safety. Some readers see this as the moment the gods start losing their honor, a slide that ends in Ragnarök.","think":"Were the gods right to trick the builder out of his payment?","sides":["Yes. The price was impossible to pay without ruining the world.","No. They made a deal and broke it, which is dishonest even for gods."]},{"group":6,"year":1270,"approx":true,"kind":"hero","title":"Thor dresses as a bride","source":"The Poetic Edda","story":"The giant Thrym stole Thor’s hammer and would return it only if the goddess Freyja married him. Freyja refused angrily. So Thor put on a wedding dress and veil and went to the giants pretending to be Freyja, with Loki dressed as the bridesmaid. When the hammer was laid in the bride’s lap for a blessing, Thor grabbed it.","whoa":"At the wedding feast, the “bride” ate a whole ox and eight salmon. Loki explained she had been too excited to eat for eight days.","question":"Who did Thor pretend to be?","answer":"The goddess Freyja","wrong":["A giant","Odin","A servant"],"more":"This poem, Þrymskviða, is one of the funniest in Norse literature. Thor was the protector of humans and gods and the most popular god among ordinary Norse people. Many wore small hammer-shaped pendants for protection.","think":"Why do people enjoy stories where a mighty hero looks silly?","sides":["It makes heroes feel more human and relatable.","Humor helped people relax about gods and giants that were otherwise frightening."]},{"group":6,"year":1220,"approx":true,"kind":"hero","title":"Thor’s contests in Utgard","source":"Snorri Sturluson’s Prose Edda","story":"Thor and his companions visited the giant king Utgard-Loki and were challenged to contests. Thor could not drain a drinking horn, could barely lift a cat’s paw and was forced to one knee wrestling an old woman. He left ashamed, until the giant revealed the truth.","whoa":"The horn was connected to the sea, the cat was the giant serpent that circles the world, and the old woman was Old Age itself.","question":"Who was the old woman Thor wrestled?","answer":"Old Age","wrong":["Thor’s mother","A giantess queen","The goddess Hel"],"more":"Thor drank so deeply that the sea level dropped, the story says, which explains the tides. In another contest, Loki lost an eating race to Logi, who was really fire, and Thor’s servant lost a race to Hugi, who was thought.","think":"Can someone lose a contest and still be impressive?","sides":["Yes. Thor nearly beat the sea and old age, which no one can.","Losing is losing. The giants still got the better of him."]},{"group":6,"year":1220,"approx":true,"kind":"monster","title":"Thor fishes for the world serpent","source":"Snorri Sturluson’s Prose Edda","story":"Thor went fishing with a giant named Hymir, using an ox head as bait. Something huge took the hook: Jörmungandr, the serpent so long it circles the whole world. Thor pulled so hard his feet broke through the boat. Just as he raised his hammer, terrified Hymir cut the line.","whoa":"Pictures of this story are carved on Viking Age stones in Denmark, Sweden and England.","question":"What did Thor use as bait?","answer":"An ox head","wrong":["A whale","A golden ring","A goat"],"more":"Jörmungandr was one of Loki’s children, along with the wolf Fenrir and Hel, ruler of the dead. Odin threw the serpent into the sea, where it grew until it could bite its own tail. Thor and the serpent are fated to destroy each other at Ragnarök.","think":"Why might people tell stories of a god fighting a monster in the sea?","sides":["Because the sea was truly dangerous for Norse sailors and fishers.","Because it shows order fighting chaos, a struggle that never fully ends."]},{"group":6,"year":1220,"approx":true,"kind":"monster","title":"Týr and the wolf Fenrir","source":"Snorri Sturluson’s Prose Edda","story":"The gods feared the giant wolf Fenrir, who grew stronger every day. He broke two great chains, so dwarves made a thin, silky ribbon called Gleipnir. Fenrir agreed to be tied only if a god put a hand in his mouth as a promise of no trickery. Brave Týr did. Fenrir could not break free, and bit off Týr’s hand.","whoa":"Gleipnir was made from impossible things, like the sound of a cat’s footsteps and the roots of a mountain. That’s why, the story jokes, those things no longer exist.","question":"What did Týr lose?","answer":"His hand","wrong":["His eye","His sword","His voice"],"more":"Týr was a god of law and courage. Tuesday is named after him. Only he had been brave enough to feed Fenrir when the wolf was young, so the wolf trusted him most.","think":"Was it right to trick Fenrir before he had done anything wrong?","sides":["Yes. The gods knew he would become a deadly danger.","No. They punished him for something he had not done yet, and betrayed his trust."]},{"group":6,"year":1220,"approx":true,"kind":"lesson","title":"The death of Baldr","source":"Snorri Sturluson’s Prose Edda","story":"Baldr, the most beloved god, dreamed of his death. His mother Frigg made everything in the world promise never to hurt him, except the tiny mistletoe, which seemed too young. The gods made a game of throwing things at Baldr. Loki tricked Baldr’s blind brother into throwing a dart of mistletoe, and it killed him.","whoa":"Hel agreed to release Baldr if every single thing in the world wept for him. Everything did except one giantess, probably Loki in disguise.","question":"What killed Baldr?","answer":"Mistletoe","wrong":["An arrow of iron","A falling tree","Poison"],"more":"The gods punished Loki by binding him in a cave under a snake that drips venom on his face. His wife, Sigyn, holds a bowl to catch it. When she empties the bowl, the venom hits him and he shakes the ground, which the story says causes earthquakes.","think":"Could Frigg have saved Baldr, or was his fate always sealed?","sides":["She tried her best. One overlooked plant was not her fault.","In Norse belief, fate cannot be escaped. Trying to stop it only shapes how it happens."]},{"group":6,"year":1270,"approx":true,"kind":"monster","title":"Ragnarök, the twilight of the gods","source":"The Poetic Edda","story":"The Norse believed the world would end in a great battle called Ragnarök. After three winters with no summer, the wolf Fenrir breaks free and swallows Odin. Thor kills the world serpent, takes nine steps and falls from its venom. Fire covers the earth, and it sinks into the sea.","whoa":"The story doesn’t end there. A green new world rises, a few gods return, and two humans who hid in the world tree survive to begin again.","question":"Who survives Ragnarök by hiding in the world tree?","answer":"Two humans","wrong":["Loki","Fenrir","All the giants"],"more":"Most of what we know comes from the poem Völuspá, “the prophecy of the seeress,” told by a wise woman to Odin. The gods know their fate and fight anyway. That idea, facing a hopeless battle bravely, was central to Norse values.","think":"Is it brave or foolish to fight when you know you will lose?","sides":["Brave. What matters is facing danger with courage, whatever the outcome.","Foolish. If you know you will lose, it is wiser to find another way."]},{"group":7,"year":-1500,"approx":true,"kind":"god","title":"Ra sails across the sky","source":"Egyptian tomb texts","story":"Ancient Egyptians said the sun god Ra sailed across the sky in a boat each day. At sunset he entered the Duat, the underworld, and sailed through twelve dark hours of night. Each night the giant serpent Apep tried to swallow him, and each morning Ra won and rose again.","whoa":"Egyptian priests performed rituals to help Ra defeat Apep, including making clay figures of the serpent and smashing them.","question":"What was the serpent that attacked Ra every night?","answer":"Apep","wrong":["Set","Jörmungandr","Sobek"],"more":"Ra was often shown with a falcon’s head topped by a sun disk. Pharaohs called themselves sons of Ra. The night journey is painted in detail on the walls of royal tombs in the Valley of the Kings.","think":"Why might a sunrise feel like a victory to ancient people?","sides":["Because without the sun, crops and life would fail, so each dawn was a relief.","Because darkness was dangerous and mysterious, and light brought safety."]},{"group":7,"year":-2400,"approx":true,"kind":"god","title":"Isis and Osiris","source":"Egypt’s Pyramid Texts","story":"Osiris was a good king of Egypt. His jealous brother Set killed him and scattered his body across the land. Osiris’s wife, the goddess Isis, searched everywhere, gathered the pieces and wrapped them. Osiris came back to life as lord of the dead, and their son Horus grew up to defeat Set.","whoa":"Osiris is shown wrapped like a mummy with green or black skin, colors of the fertile Nile mud and new life.","question":"Who gathered Osiris’s scattered body?","answer":"Isis","wrong":["Horus","Ra","Anubis"],"more":"The Pyramid Texts, carved in royal pyramids around 2400 BC, are among the oldest religious writings in the world. Egyptians hoped to share in Osiris’s rebirth after death. Isis became so popular that she was later worshipped across the Roman Empire.","think":"Why do so many myths tell of a god who dies and comes back?","sides":["Because people see the same pattern in nature: crops die and grow again every year.","Because people hope death is not the end, and stories give that hope a shape."]},{"group":7,"year":-1550,"approx":true,"kind":"lesson","title":"The weighing of the heart","source":"The Egyptian Book of the Dead","story":"Egyptians believed that after death, your heart was weighed on a scale against the feather of Maat, goddess of truth and justice. If your heart was light with a good life, you entered a paradise of endless fields. If it was heavy with wrongdoing, a monster named Ammit ate it.","whoa":"Ammit had the head of a crocodile, the front of a lion and the back end of a hippopotamus, three of the animals Egyptians feared most.","question":"What was the heart weighed against?","answer":"A feather","wrong":["A stone","A gold coin","A scarab beetle"],"more":"The dead person recited a list of wrongs they had not done, like “I have not stolen” and “I have not lied.” The jackal god Anubis ran the scale, and Thoth, god of writing, recorded the result. The Book of the Dead was a collection of spells buried with people to guide them.","think":"Should a whole life be judged by weighing good against bad?","sides":["Yes. It is fair: how you treated others is what matters most.","It is too simple. People change, and intentions and circumstances matter too."]},{"group":7,"year":1930,"approx":true,"kind":"hero","title":"Anansi buys the sky god’s stories","source":"Akan tradition, Ghana","story":"Long ago, all stories belonged to Nyame, the sky god. Anansi the spider asked to buy them. Nyame named an impossible price: a python, a leopard, a swarm of hornets and a fairy. Using only clever tricks, Anansi captured all four. Nyame kept his word, and ever since, stories have belonged to Anansi.","whoa":"Among the Akan, folk tales are still called Anansesem, meaning “spider stories.”","question":"Who owned all the stories before Anansi?","answer":"Nyame, the sky god","wrong":["The python","The lion","The moon"],"more":"To catch the python, Anansi bet that it was not as long as a palm branch, then tied it to the branch to “measure” it. Anansi is a trickster: small, greedy and sometimes foolish, but clever. Anthropologist R. S. Rattray published Akan stories in English in 1930.","think":"Is it okay to trick others to get what you want?","sides":["Sometimes. Anansi used brains, not strength, against much bigger creatures.","No. A trick is still a kind of lie, and in other stories Anansi’s tricks backfire."]},{"group":7,"year":1930,"approx":true,"kind":"lesson","title":"Anansi and the pot of wisdom","source":"Akan tradition, Ghana","story":"Anansi gathered all the wisdom in the world into a pot and decided to hide it at the top of a tall tree. He tied the pot to his front, but it kept getting in the way as he climbed. His young son Ntikuma called up: tie it to your back. Furious that a child was wiser than him, Anansi dropped the pot, and wisdom scattered everywhere.","whoa":"That is why, the story says, everyone has a little bit of wisdom, and no one has all of it.","question":"Who gave Anansi the good advice?","answer":"His young son","wrong":["The sky god","A wise turtle","His wife"],"more":"Many Anansi stories end by explaining something about the world. Stories like this were told in the evening, and listeners often joined in with songs. Anansi stories are still told across West Africa and the Caribbean.","think":"Can a young person know something an older, wiser person does not?","sides":["Yes. A fresh look can spot simple answers experts miss.","Sometimes, but experience usually counts more in the long run."]},{"group":7,"year":1900,"approx":true,"kind":"creation","title":"Obatala makes the land","source":"Yoruba tradition, Nigeria","story":"In the beginning there was only sky above and water below. The great god Olodumare let Obatala climb down from the sky on a golden chain, carrying a snail shell full of sand, a hen and a palm nut. He poured the sand on the water, and the hen scratched it in every direction, spreading it into dry land.","whoa":"The place where the land began is said to be Ile-Ife, a real city in Nigeria that Yoruba people consider sacred.","question":"What spread the sand into land?","answer":"A hen","wrong":["A river","The wind","A giant turtle"],"more":"Obatala went on to shape the first humans from clay. The Yoruba honor many orishas, spirits or deities who each care for parts of life. Yoruba traditions traveled with enslaved Africans to Brazil, Cuba and elsewhere, and are still practiced there.","think":"Why do creation stories often begin with water?","sides":["Because water really is needed for all life.","Because an endless sea is the simplest picture of “nothing yet.”"]},{"group":7,"year":1900,"approx":true,"kind":"god","title":"Shango, king of thunder","source":"Yoruba tradition, Nigeria","story":"Shango was said to be a powerful king of the Oyo Empire who could call down lightning. In one legend, he lost control of his power and struck his own palace. After his reign, he became the orisha of thunder, lightning and justice, carrying a double-headed axe.","whoa":"When lightning strikes, some Yoruba people say Shango is punishing liars and thieves.","question":"What does Shango carry?","answer":"A double-headed axe","wrong":["A trident","A hammer","A bow"],"more":"The Oyo Empire was a real and powerful West African state from about the 1400s to the 1800s. Shango’s colors are red and white. He is honored in Yoruba communities and in religions of the Caribbean and Brazil, where he is called Xangô or Changó.","think":"Why might a powerful king be remembered as a god?","sides":["Because his deeds were so great that people felt he must be more than human.","Because rulers often encouraged people to see them as divine to strengthen their power."]},{"group":7,"year":1956,"approx":true,"kind":"hero","title":"Mwindo, the little hero","source":"Nyanga epic, Congo","story":"Chief Shemwindo ordered that his wives give birth only to daughters. But one wife gave birth to Mwindo, who was born walking and talking, holding a magic scepter. His father tried again and again to destroy him, even sealing him in a drum and throwing it in a river. Mwindo survived every attempt.","whoa":"Mwindo’s magic scepter, a kind of fly-whisk, could bring the dead back to life.","question":"How did Mwindo’s father try to get rid of him?","answer":"He sealed him in a drum and threw it in a river","wrong":["He sent him to the moon","He fed him to a lion","He turned him into a tree"],"more":"In the epic, Mwindo becomes proud and even angers the god of lightning, who takes him to the sky for a year to learn humility. He returns a wiser, gentler chief. A bard named Candi Rureke performed the epic for scholars in the 1950s.","think":"Does a hero need to fail and be humbled to become truly great?","sides":["Yes. Mwindo becomes a good ruler only after learning humility.","Not always. Some heroes are good from the start."]},{"group":7,"year":1960,"approx":true,"kind":"hero","title":"Sundiata, the lion king of Mali","source":"Mande griots, West Africa","story":"Sundiata was born unable to walk, and people mocked him and his mother. One day, angered by an insult to her, he grabbed an iron rod to pull himself up. The rod bent into a bow, but Sundiata stood. He grew into a great warrior, defeated a sorcerer-king and founded the Mali Empire.","whoa":"Sundiata was a real king of Mali in the 1200s. Mansa Musa, on the History line, was his grand-nephew.","question":"Who keeps Sundiata’s story alive by telling it?","answer":"Griots","wrong":["Monks","Pharaohs","Vikings"],"more":"Griots are West African storytellers, historians and musicians who memorize long histories and family lines, often playing the kora, a harp-like instrument. The epic was written down in French by D. T. Niane in 1960. It mixes real history with magic and legend.","think":"Can a story be both history and legend?","sides":["Yes. Sundiata was real, and the legends help people remember why he mattered.","It makes it hard to know which parts actually happened."]},{"group":7,"year":1868,"approx":true,"kind":"lesson","title":"The chameleon and the lizard","source":"Zulu tradition, South Africa","story":"Unkulunkulu, the first being, sent a chameleon to tell people they would live forever. The chameleon wandered slowly, stopping to eat berries. Meanwhile Unkulunkulu changed his mind and sent a fast lizard with a new message: people will die. The lizard arrived first, and its message became true.","whoa":"Stories of a slow messenger bringing the gift of life too late are told across much of Africa.","question":"Which animal carried the message of life too slowly?","answer":"The chameleon","wrong":["The lizard","The hare","The tortoise"],"more":"In Zulu tradition, Unkulunkulu came out of a bed of reeds and brought people and animals with him. Missionary Henry Callaway recorded these stories from Zulu speakers in the 1860s. Some people still treat chameleons with caution because of the tale.","think":"Why do so many cultures have stories explaining why people die?","sides":["To make sense of something frightening and unavoidable.","To teach lessons, like not dawdling when something important needs doing."]},{"group":7,"year":1910,"approx":true,"kind":"creation","title":"Why the sun and moon live in the sky","source":"Efik tradition, Nigeria","story":"Long ago, Sun and Water were friends who lived on Earth. Sun always visited Water, but Water never visited back, saying Sun’s house was too small. So Sun built a huge house. When Water came, he brought all the fish and sea creatures, and the water kept rising. Sun and his wife, Moon, had to climb onto the roof, and finally up into the sky.","whoa":"The story was published in English in 1910 in a book of tales from southern Nigeria.","question":"Why did Sun and Moon move into the sky?","answer":"Water filled their house","wrong":["They got lost","A storm blew them up","They wanted to see the stars"],"more":"This is a “why story,” a tale that explains something in nature. Why stories are common in African oral traditions and were often told to children. They mix humor with gentle lessons about friendship and hospitality.","think":"Should you invite a friend over even if it might cause you trouble?","sides":["Yes. Being a good host and friend is worth some trouble.","Be wise. Sun did not think about whether his house could really hold Water."]},{"group":7,"year":1875,"approx":true,"kind":"creation","title":"The mantis who made the moon","source":"San tradition, southern Africa","story":"For the /Xam San people, the trickster god was /Kaggen, who often took the form of a praying mantis. One night, needing light to find his way home, /Kaggen took off his shoe and threw it into the sky. It became the moon, glowing white with the dust of his travels.","whoa":"The / mark stands for a click sound. San languages are some of the few in the world that use clicks as regular consonants.","question":"What did /Kaggen throw into the sky to make the moon?","answer":"His shoe","wrong":["An egg","A shield","A gourd"],"more":"In the 1870s, Wilhelm Bleek and Lucy Lloyd recorded thousands of pages of /Xam stories told by San men such as //Kabbo, who wanted their stories remembered. The collection is now in UNESCO’s Memory of the World register. San peoples are among the oldest cultures on Earth.","think":"What is lost when a language or way of storytelling disappears?","sides":["A whole way of seeing the world, which no translation can fully capture.","Some is saved if stories are recorded, as the /Xam stories were."]}]}}};

s freedom","Lewis and Clark","Simón Bolívar","Queen Victoria","The Opium War","The Irish Potato Famine","The California Gold Rush","Harriet Tubman","The American Civil War","Japan's Meiji era","The Suez Canal opens","The telephone","The scramble for Africa","The Wright brothers fly","The Titanic sinks","World War I","The Russian Revolution","Women win the vote","King Tut's tomb is found","The Great Depression","Gandhi's Salt March","World War II","The United Nations","India and Pakistan are born","Mao and Communist China","Rosa Parks","Sputnik","People walk on the Moon","The Berlin Wall falls","The Soviet Union ends","Nelson Mandela"];

const T1 = new Date().getFullYear() < 2026 ? 2026 : new Date().getFullYear();
const LINES = {};
for(const [k,L] of Object.entries(DATA.lines)){
  const G={}; L.groups.forEach(g=>G[g.id]=g);
  const items=L.stories.map(s=>({v:s.group,y:s.year,c:!!s.approx,k:s.kind,t:s.title,s:s.story,f:s.whoa,
    q:[s.question,s.answer,...s.wrong],src:s.source||'',more:s.more||'',think:s.think||'',sides:s.sides||null,key:k+':'+s.title}));
  const timed=L.order==='time';
  if(timed) items.sort((a,b)=>a.y-b.y);
  items.forEach((s,i)=>s.id=i);
  LINES[k]={...L,key:k,G,items,timed};
}
const LINE_KEYS=Object.keys(LINES);

const KIND = {ruler:'Rulers',invent:'Inventions',battle:'Battles',explore:'Explorers',build:'Builders',idea:'Big ideas',life:'Daily life',

const ico = (k,s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||ICON.idea}</svg>`;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rand = a => a[Math.floor(Math.random()*a.length)];
const yr = y => y<0 ? `${-y} BC` : (y<1000 ? `AD ${y}` : `${y}`);
const label = s => (s.c?'about ':'') + yr(s.y);
const span = (a,b) => {let d=b-a; if(a<0&&b>0)d-=1; return d};
const comma = n => n.toLocaleString('en-US');
const plural = w => w.toLowerCase()+'s';
const LET='ABCD';

let line, LN, S, N, G;
function useLine(l){line=l; LN=LINES[l]; S=LN.items; N=S.length; G=LN.G}
const sideBtns = s => `<div class="sides">${s.sides.map((t,i)=>`<button class="side press pick-${'ab'[i]}" data-side="${i}"><b>${i?'Another view':'One view'}</b>${t}</button>`).join('')}</div><p class="your" aria-live="polite">Tap the one you find more convincing.</p>`;
function deepHTML(s,interactive){
  if(!s.more && !s.think) return '';
  const sides = s.sides && s.sides.length===2 ? (interactive ? sideBtns(s)
      : `<div class="sides">${s.sides.map((t,i)=>`<div class="side pick-${'ab'[i]}"><b>${i?'Another view':'One view'}</b>${t}</div>`).join('')}</div><p class="your">Which do you find more convincing? Could you argue the other one?</p>`) : '';
  return `<section class="deep">
    ${s.more?`<h3 class="deep-h">More to know</h3><p>${s.more}</p>`:''}
    ${s.think?`<div class="think"><span class="think-k">${ico('think',14)}Think about it</span><p class="think-q">${s.think}</p>${sides}</div>`:''}
  </section>`;
}
const when = s => s.src ? `${s.src}, ${LN.yearMeaning||'from'} ${label(s)}` : label(s);

/* ---------- saved progress (this browser only) ---------- */
const KEY='time-tunnel-v2';
let saved={seen:[],mast:[],best:{},mode:'order',line:LINE_KEYS[0]};
try{
  const r=localStorage.getItem(KEY);
  if(r){ saved=Object.assign(saved,JSON.parse(r)); }
  else{
    const o=JSON.parse(localStorage.getItem('time-tunnel-v1')||'null');
    if(o){
      const k=i=>V1_TITLES[i]?'history:'+V1_TITLES[i]:null;
      saved.seen=(o.seen||[]).map(k).filter(Boolean);
      saved.mast=(o.mast||[]).map(k).filter(Boolean);
      saved.best={history:o.best||0};
      if(o.mode) saved.mode=o.mode;
    }
  }
}catch(e){}
if(!saved.best||typeof saved.best!=='object') saved.best={};
LINE_KEYS.forEach(k=>{ if(typeof saved.best[k]!=='number') saved.best[k]=0 });
const seen=new Set(saved.seen), mast=new Set(saved.mast);
function persist(){try{localStorage.setItem(KEY,JSON.stringify({seen:[...seen],mast:[...mast],best:saved.best,mode:saved.mode,line}))}catch(e){}}

function stamp(id){
  const k=S[id].key; if(seen.has(k)) return;
  seen.add(k); persist(); updateCounts();
  const p=$('#passPill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump');
  const st=stations[id]; if(st) st.classList.add('seen');
}
const lineSeen = l => LINES[l].items.filter(s=>seen.has(s.key)).length;
function updateCounts(){
  $('#passN').textContent=lineSeen(line); $('#passT').textContent=N;
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- views ---------- */
const views=['machine','feedView','quiz'];
let current='machine';
function show(v){
  current=v;
  views.forEach(id=>{$('#'+id).hidden = id!==v});
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current', b.dataset.view===v?'page':'false'));
  if(v==='machine') requestAnimationFrame(()=>{layout(); go(active,false)});
  if(v==='quiz' && !round) quizHome();
  const h={machine:'machine',feedView:'scroll',quiz:'quiz'}[v];
  try{history.replaceState(null,'','#'+h)}catch(e){}
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));

/* ---------- line switch ---------- */
const linesEl=$('#lines');
linesEl.hidden = LINE_KEYS.length<2;
linesEl.innerHTML=LINE_KEYS.map(k=>`<button class="press" data-line="${k}" aria-pressed="false">${ico(LINES[k].icon||'idea',18)}${LINES[k].name} <small>${LINES[k].items.length}</small></button>`).join('');
const activeBy={};
function applyLineUI(){
  document.documentElement.dataset.line=line;
  document.documentElement.style.setProperty('--tint', LN.tint||'#71b4ff');
  linesEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.line===line));
}
function switchLine(l){
  if(l===line) return;
  activeBy[line]=active;
  useLine(l); persist(); applyLineUI();
  buildChips(); buildScale(); buildTrack(); updateCounts(); resetFeed();
  round=null;
  active=-1; setActive(activeBy[l]||0);
  if(current==='machine') requestAnimationFrame(()=>{layout(); go(active,false)});
  if(current==='quiz') quizHome();
  toast(`${LN.name} · ${N} stories`);
}
linesEl.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) switchLine(b.dataset.line)});

/* ---------- time machine ---------- */
const track=$('#track'), digits=$('#digits'), panel=$('#panel'), chips=$('#chips');
let stations=[], centers=[], active=0, dwell;

for(let i=0;i<4;i++){
  const d=document.createElement('span'); d.className='dg';
  d.innerHTML='<span class="strip">'+[...'0123456789'].map(n=>`<span>${n}</span>`).join('')+'</span>';
  digits.appendChild(d);
}
function setOdo(s){
  const n=String(Math.abs(s.y)).padStart(4,'0'), len=String(Math.abs(s.y)).length;
  [...digits.children].forEach((d,i)=>{
    d.classList.toggle('off', i<4-len);
    d.firstChild.style.transform=`translateY(${-Number(n[i])}em)`;
  });
  digits.setAttribute('aria-label', label(s));
  $('#odoEra').textContent = s.y<0?'BC':'AD';
  $('#odoAbout').style.visibility = s.c?'visible':'hidden';
  $('#odoVol').textContent = `${LN.word} ${s.v} · ${G[s.v].name}`;
  $('#odoSub').innerHTML = LN.yearMeaning ? `${s.t} <small>· year first ${LN.yearMeaning}</small>` : s.t;
}

function buildChips(){
  chips.innerHTML='';
  for(const g of LN.groups){
    if(!S.some(s=>s.v===g.id)) continue;
    const b=document.createElement('button'); b.className='chip press'; b.style.setProperty('--cc',g.color); b.dataset.v=g.id;
    b.innerHTML=`<span class="d"></span>${g.short}<small>${LN.short} ${g.id}</small>`;
    b.addEventListener('click',()=>go(S.findIndex(s=>s.v===g.id)));
    chips.appendChild(b);
  }
  const warp=document.createElement('button'); warp.className='chip warp press';
  warp.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Time warp`;
  warp.addEventListener('click',()=>{if(N<2)return; let i; do{i=Math.floor(Math.random()*N)}while(i===active); go(i)});
  chips.appendChild(warp);
}

function buildTrack(){
  track.innerHTML=''; stations=[]; centers=[];
  const frag=document.createDocumentFragment();
  const sp=()=>{const e=document.createElement('div');e.className='spacer';return e};
  frag.appendChild(sp());
  S.forEach((s,i)=>{
    const b=document.createElement('button'); b.className='st'+(seen.has(s.key)?' seen':''); b.style.setProperty('--c',G[s.v].color);
    b.setAttribute('aria-label',`${s.t}, ${label(s)}`);
    b.innerHTML=`<span class="yr">${yr(s.y)}</span><span class="dot"></span><span class="nm">${s.t}</span>`;
    b.addEventListener('click',()=>{ if(!suppress) go(i) });
    frag.appendChild(b); stations.push(b);
    if(i<N-1){
      const n=S[i+1], g=document.createElement('div'); g.className='gap';
      g.style.setProperty('--a',G[s.v].color); g.style.setProperty('--b',G[n.v].color);
      if(LN.timed){
        const d=span(s.y,n.y);
        g.innerHTML=`<span>${d<=0?'same year':'+'+comma(d)+' yrs'}</span>`;
      }else if(n.v!==s.v){
        g.classList.add('book'); g.innerHTML=`<span>${LN.short} ${n.v} →</span>`;
      }
      frag.appendChild(g);
    }
  });
  frag.appendChild(sp());
  track.appendChild(frag);
}
function layout(){centers=stations.map(st=>st.offsetLeft+st.offsetWidth/2)}
function go(i,smooth=true){
  i=Math.max(0,Math.min(N-1,i));
  if(!centers.length||!track.clientWidth||!centers[centers.length-1]){setActive(i);return}
  track.scrollTo({left:centers[i]-track.clientWidth/2, behavior: smooth?'smooth':'auto'});
  setActive(i);
}
let ticking=false;
track.addEventListener('scroll',()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    ticking=false; if(!centers.length) layout();
    const mid=track.scrollLeft+track.clientWidth/2;
    let best=0,bd=Infinity;
    for(let i=0;i<centers.length;i++){const d=Math.abs(centers[i]-mid); if(d<bd){bd=d;best=i}}
    if(best!==active) setActive(best);
  });
},{passive:true});
track.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();go(active+1)}
  if(e.key==='ArrowLeft'){e.preventDefault();go(active-1)}
});
let drag=null, suppress=false;
track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;drag={x:e.clientX,s:track.scrollLeft,m:false}});
window.addEventListener('pointermove',e=>{
  if(!drag)return; const dx=e.clientX-drag.x;
  if(!drag.m && Math.abs(dx)>4){drag.m=true;track.classList.add('dragging')}
  if(drag.m) track.scrollLeft=drag.s-dx;
});
window.addEventListener('pointerup',()=>{
  if(!drag)return; const m=drag.m; drag=null; track.classList.remove('dragging');
  if(m){suppress=true;setTimeout(()=>suppress=false,60);go(active)}
});
window.addEventListener('resize',()=>{layout()});

// real-scale bar
const pos = y => Math.max(0,Math.min(100,(y-LN.start)/(T1-LN.start)*100));
function buildScale(){
  let bar='';
  const ranged=LN.timed && LN.groups.every(g=>g.from!==undefined&&g.to!==undefined);
  if(ranged){
    for(const g of LN.groups) bar+=`<i style="background:${g.color};flex-grow:${Math.max(1,g.to-g.from)}" title="${g.name}"></i>`;
  }else{
    bar='<i style="flex-grow:1;background:rgba(255,255,255,.07)"></i>'+S.map(s=>`<b class="tick" style="left:${pos(s.y)}%;background:${G[s.v].color}"></b>`).join('');
  }
  const mid = LN.start<0 ? `<span style="left:${pos(1)}%">AD 1</span>` : '';
  $('#scaleBox').innerHTML=`
    <div class="scale-head"><b>${LN.scaleTitle||'Drawn to scale'}</b><span id="scaleNote"></span></div>
    <div class="scale">${bar}<span class="pin" id="pin"></span></div>
    <div class="scale-ends"><span style="left:0">${yr(LN.start)}</span>${mid}<span style="left:100%">Today</span></div>`;
}
function scaleNote(s){
  const g=G[s.v];
  if(g.scaleNote) return g.scaleNote;
  if(LN.timed && g.from!==undefined) return `${g.short} is ${Math.max(1,Math.round((g.to-g.from)/(T1-LN.start)*100))}% of it`;
  return `${g.short}: ${label(s)}`;
}

function setActive(i){
  const prev=active; active=i;
  stations.forEach((st,k)=>st.classList.toggle('on',k===i));
  const s=S[i];
  $('#machine').style.setProperty('--c',G[s.v].color);
  chips.querySelectorAll('.chip[data-v]').forEach(c=>c.classList.toggle('on',+c.dataset.v===s.v));
  setOdo(s);
  $('#pin').style.left=pos(s.y)+'%';
  $('#scaleNote').textContent = scaleNote(s);
  renderPanel(s, prev!==i);
  clearTimeout(dwell); dwell=setTimeout(()=>stamp(i),900);
}
function renderPanel(s,anim){
  panel.classList.remove('swap');
  panel.innerHTML=`
    <div class="meta"><span class="tag">${LN.short} ${s.v} · ${G[s.v].short}</span><span class="tag k">${ico(s.k)}${KIND[s.k]||s.k}</span><span class="tag k">${when(s)}</span></div>
    <h2>${s.t}</h2>
    <p class="story">${s.s}</p>
    <div class="whoa"><b>Whoa.</b>${s.f}</div>
    ${deepHTML(s,false)}
    <div class="acts">
      <button class="btn round press" data-a="prev" aria-label="Previous story"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="btn round press" data-a="next" aria-label="Next story"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn go press" data-a="quiz">Quiz me on this</button>
    </div>`;
  if(anim){void panel.offsetWidth; panel.classList.add('swap')}
}
panel.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]')?.dataset.a; if(!a) return;
  if(a==='prev') go(active-1);
  if(a==='next') go(active+1);
  if(a==='quiz'){show('quiz'); startRound('focus',active)}
});

/* ---------- feed ---------- */
const feed=$('#feed');
let fOrder=[], fPos=0, fCount=0, fAlt=0;
const io=new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(!en.isIntersecting) return;
    const c=en.target; c.classList.add('live');
    if(c.dataset.id){stamp(+c.dataset.id)}
    if(c.dataset.n) setFeedLabel(+c.dataset.n);
    if(c.dataset.last) {delete c.dataset.last; feedMore()}
  });
},{root:feed,threshold:.6});

let fMode = saved.mode==='shuffle' ? 'shuffle' : 'order';
function nextStory(){
  if(fPos>=fOrder.length){ const ids=S.map(s=>s.id); fOrder = fMode==='order' ? ids : shuffle(ids); fPos=0 }
  return fOrder[fPos++];
}
function setFeedLabel(n){
  $('#fbLabel').innerHTML = fMode==='order' ? `<b>${((n-1)%N)+1}</b> of ${N}` : `Story <b>${n}</b>`;
}
function addHint(){
  const first=feed.firstElementChild; if(!first) return;
  const h=document.createElement('div'); h.className='hint';
  h.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>Swipe up for the next story';
  first.classList.add('first'); first.appendChild(h);
}
function resetFeed(){
  io.disconnect();
  feed.innerHTML=''; fOrder=[]; fPos=0; fCount=0; fAlt=0;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===fMode));
  feedMore(); addHint(); setFeedLabel(1); feed.scrollTop=0;
}
document.querySelector('.seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b || b.dataset.mode===fMode) return;
  fMode=b.dataset.mode; saved.mode=fMode; persist(); resetFeed();
  toast(fMode==='order' ? (LN.timed?'Stories in time order, oldest first':`Stories ${LN.word.toLowerCase()} by ${LN.word.toLowerCase()}`) : 'Stories shuffled');
});
function feedCard(id){
  const s=S[id], a=document.createElement('article'); fCount++;
  a.className='card'; a.dataset.id=id; a.dataset.n=fCount; a.style.setProperty('--c',G[s.v].color);
  const wm = LN.timed || !G[s.v].watermark
    ? `<div class="wm" aria-hidden="true">${Math.abs(s.y)}<small>${s.y<0?'BC':'AD'}</small></div>`
    : `<div class="wm word" aria-hidden="true">${G[s.v].watermark}</div>`;
  a.innerHTML=`${wm}
    <div class="card-in">
      <div class="meta"><span class="tag">${LN.short} ${s.v} · ${G[s.v].short}</span><span class="tag k">${ico(s.k)}${KIND[s.k]||s.k}</span></div>
      <div class="cyear">${when(s)}</div>
      <h2>${s.t}</h2>
      <p class="story">${s.s}</p>
      <div class="whoa"><b>Whoa.</b>${s.f}</div>
      <div class="acts">
        <button class="btn go press" data-a="quiz">Quiz me</button>
        ${s.more||s.think?`<button class="btn press" data-a="deep">${ico('think',18)}Dig deeper</button>`:''}

function orderPair(){

const groupIds = () => [...new Set(S.map(s=>s.v))];
function otherBooks(v,n){return shuffle(groupIds().filter(x=>x!==v)).slice(0,n)}
function altCard(){

function feedMore(){

function qStory(id){const s=S[id];return{kind:'story',id,text:s.q[0],opts:shuffle(s.q.slice(1)),ans:s.q[1],s}}
function qOrder(){const [a,b]=orderPair();const first=a.y<b.y?a:b;return{kind:'order',text:'Which happened first?',opts:[a.t,b.t],ans:first.t,pair:[a,b]}}

    <div class="qtop">

}

    <div class="endcard">
      <span class="tag" style="--c:var(--gold)">${endless?streakName():'Round complete'}</span>
