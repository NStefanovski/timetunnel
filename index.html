lped inspire Darwin?","answer":"The Galápagos","wrong":["Hawaiʻi","Iceland","Japan"],"more":"Alfred Russel Wallace came up with the same idea independently, and their work was presented together in 1858. Darwin’s ideas upset many people, especially those who saw them as conflicting with religion. Today evolution is the foundation of modern biology, supported by fossils and DNA.","think":"Why do new scientific ideas sometimes upset people so much?"},{"group":4,"year":1867,"approx":false,"kind":"ruler","title":"Canada is born","story":"On July 1, 1867, Ontario, Quebec, Nova Scotia and New Brunswick joined to form the Dominion of Canada. John A. Macdonald became the first prime minister. Over time, more provinces and territories joined.","whoa":"Canada Day is celebrated every July 1.","question":"Who was Canada’s first prime minister?","answer":"John A. Macdonald","wrong":["Wilfrid Laurier","Samuel de Champlain","Pierre Trudeau"],"more":"Confederation was partly a response to fears of the United States after its Civil War. Indigenous nations were not part of the talks. Manitoba joined in 1870 after the Red River Resistance led by Louis Riel, and Nunavut became a territory in 1999.","think":"Whose voices should be part of creating a country?"},{"group":4,"year":1879,"approx":false,"kind":"invent","title":"Edison’s light bulb","story":"Thomas Edison and his team tested thousands of materials to find one that would glow inside a bulb without burning out fast. A thin thread of carbon worked, and later carbonized bamboo lasted even longer. Electric lights began replacing gas lamps.","whoa":"Edison held more than 1,000 patents.","question":"Who made the first practical light bulb?","answer":"Thomas Edison","wrong":["Alexander Graham Bell","Isaac Newton","James Watt"],"more":"Others, like Joseph Swan in England, made bulbs at the same time. Edison’s big achievement was a whole system: power plants, wires and meters. He also invented the phonograph and movie cameras. He argued fiercely with Nikola Tesla over which kind of electricity was better.","think":"Is the real genius the inventor or the person who makes an invention work for everyone?","sides":["The inventor. Without the idea, nothing happens.","The system builder. Edison’s power network brought light into homes."]},{"group":4,"year":1896,"approx":false,"kind":"life","title":"The modern Olympics begin","story":"Inspired by ancient Greece, a Frenchman named Pierre de Coubertin brought back the Olympic Games. The first modern Games were held in Athens. About 240 athletes from 14 countries competed.","whoa":"Winners got silver medals, not gold. Second place got bronze.","question":"Where were the first modern Olympics held?","answer":"Athens","wrong":["Paris","London","Rome"],"more":"Women could compete starting in 1900. Today over 10,000 athletes take part. The Olympics have been boycotted, used for propaganda and hit by doping scandals, but they also showed moments like Jesse Owens winning four golds in Nazi Berlin in 1936.","think":"Can sports stay separate from politics?","sides":["They should. Sports should unite people, not divide them.","They never really have, and athletes speaking up can do good."]},{"group":4,"year":1905,"approx":false,"kind":"idea","title":"Einstein’s big year","story":"A young patent clerk named Albert Einstein published four papers that changed science. One showed that light comes in tiny packets. Another led to the famous equation E = mc², which says a little mass holds a huge amount of energy.","whoa":"He worked on these ideas in his spare time while holding a full-time job.","question":"What was Einstein’s job in 1905?","answer":"Patent clerk","wrong":["Teacher","Astronaut","Doctor"],"more":"Einstein later developed general relativity, showing that gravity bends space and time, which GPS satellites must account for today. He fled Nazi Germany in 1933. He wrote to President Roosevelt warning about atomic bombs, which he later regretted.","think":"Are scientists responsible for how their discoveries are used?","sides":["Yes. They should think about consequences and speak out.","Not fully. Leaders and societies decide how knowledge is used."]},{"group":4,"year":1922,"approx":false,"kind":"invent","title":"Insulin in Toronto","story":"People with type 1 diabetes used to die young. At the University of Toronto, Frederick Banting and Charles Best found a way to collect insulin. In January 1922, a 14-year-old boy named Leonard Thompson became the first person treated with it, and he got better.","whoa":"The discoverers sold the patent for one dollar each so the medicine could help as many people as possible.","question":"In which city was insulin discovered?","answer":"Toronto","wrong":["London","Paris","New York"],"more":"Banting and Macleod won the 1923 Nobel Prize. Banting shared his prize money with Best; Macleod shared his with chemist James Collip. Before insulin, children with diabetes often lived only a year or two after diagnosis. Today insulin is still expensive in some countries.","think":"Should life-saving medicines ever be sold for profit?","sides":["Profit pays for research into new medicines.","Medicines people need to live should be affordable for everyone."]},{"group":4,"year":1928,"approx":false,"kind":"invent","title":"Penicillin","story":"Alexander Fleming came back from vacation to find mold growing in one of his dishes of bacteria. Around the mold, the bacteria had died. That mold made penicillin, the first antibiotic, which has saved millions of lives.","whoa":"It was an accident caused by a messy lab bench.","question":"What did penicillin come from?","answer":"Mold","wrong":["Seaweed","Honey","Snake venom"],"more":"It took over a decade for scientists Howard Florey and Ernst Chain to turn penicillin into a usable medicine, in time for World War II. Today some bacteria have become resistant to antibiotics because they are overused.","think":"Who deserves credit for penicillin?","sides":["Fleming, who noticed it first.","Florey and Chain, who made it into a medicine that saved lives."]},{"group":4,"year":1953,"approx":false,"kind":"idea","title":"The shape of DNA","story":"DNA carries the instructions for building every living thing. Rosalind Franklin took X-ray photos of DNA, and James Watson and Francis Crick used one of them to work out its shape. It is a double helix, like a twisted ladder.","whoa":"If you unwound all the DNA in one human body, it would stretch to the Sun and back hundreds of times.","question":"What shape is DNA?","answer":"A double helix","wrong":["A cube","A circle","A star"],"more":"Watson and Crick saw Rosalind Franklin’s famous Photo 51 without her permission. Franklin died in 1958, aged 37. Watson, Crick and Maurice Wilkins won the Nobel Prize in 1962; Nobel Prizes are not given after death. Many people now think Franklin was unfairly overlooked.","think":"Was it fair that Franklin did not get the Nobel Prize?","sides":["No. Her work was key, and it was used without asking.","The prize rules did not allow it after death, though her credit deserved more."]},{"group":4,"year":1953,"approx":false,"kind":"explore","title":"The top of Everest","story":"Edmund Hillary from New Zealand and Tenzing Norgay, a Sherpa from Nepal, became the first people known to reach the top of Mount Everest. At about 8,849 meters, it is the highest mountain on Earth. They spent about 15 minutes on top.","whoa":"Tenzing left some sweets in the snow at the summit as an offering.","question":"Who reached the top of Everest with Edmund Hillary?","answer":"Tenzing Norgay","wrong":["Neil Armstrong","Roald Amundsen","Ernest Shackleton"],"more":"Many climbers had died trying before. Hillary and Tenzing refused for years to say who stepped on top first, saying they reached it as a team. Today hundreds climb Everest each year, and its slopes have problems with crowds and trash.","think":"Should mountains like Everest be open to anyone who can pay?","sides":["Yes. People have a right to chase dreams.","No. Crowds and trash harm the mountain and put climbers and Sherpas in danger."]},{"group":4,"year":1963,"approx":false,"kind":"idea","title":"The March on Washington","story":"About 250,000 people marched in Washington, D.C., for jobs and equal rights for Black Americans. Martin Luther King Jr. gave his famous “I Have a Dream” speech. The next year, the Civil Rights Act made segregation illegal.","whoa":"Parts of the most famous section of the speech were made up on the spot.","question":"Who gave the “I Have a Dream” speech?","answer":"Martin Luther King Jr.","wrong":["Abraham Lincoln","Nelson Mandela","Rosa Parks"],"more":"The march was planned by A. Philip Randolph and Bayard Rustin. Singers like Mahalia Jackson performed. Some leaders worried violence might break out, but the day was peaceful. King won the Nobel Peace Prize in 1964 and was assassinated in 1968.","think":"Can a single speech change a country?","sides":["Yes. Words can inspire millions and shift what people believe.","Speeches help, but laws, votes and years of organizing made the real change."]},{"group":4,"year":1991,"approx":false,"kind":"invent","title":"The World Wide Web","story":"Tim Berners-Lee, a scientist at a lab in Switzerland called CERN, invented a way to link pages of information across the internet. He called it the World Wide Web. The first website went online in 1991, and he made the idea free for everyone.","whoa":"The first website explained what the web was and how to use it. A copy is still online.","question":"Who invented the World Wide Web?","answer":"Tim Berners-Lee","wrong":["Thomas Edison","Alexander Graham Bell","Albert Einstein"],"more":"The internet is the network of connected computers; the web is pages and links that run on it. Berners-Lee chose not to patent the web so it would be free. Today over five billion people use the internet. He has since worried about misinformation and privacy online.","think":"Was making the web free the right choice?","sides":["Yes. It let anyone build and share, so it grew everywhere.","It also let powerful companies grow without rules, which brought new problems."]},{"group":5,"year":2000,"approx":false,"kind":"explore","title":"Living in space","story":"The first crew moved into the International Space Station, built by the United States, Russia, Europe, Japan and Canada. It circles Earth about every 90 minutes. People have lived on board ever since.","whoa":"Astronauts on the station see about 16 sunrises every day.","question":"How often does the space station circle Earth?","answer":"About every 90 minutes","wrong":["Once a day","Once a week","Once a year"],"more":"The station is about as long as a football field and travels about 28,000 kilometers per hour. Astronauts exercise about two hours a day because bones and muscles weaken in low gravity. Canadian astronaut Chris Hadfield commanded it in 2013. NASA plans to retire it around 2030.","think":"Should countries keep spending on space stations?","sides":["Yes. They teach us how humans can live in space and help science on Earth.","The money could do more good solving problems here at home."]},{"group":5,"year":2001,"approx":false,"kind":"life","title":"September 11","story":"Terrorists hijacked four passenger planes in the United States. Two crashed into the World Trade Center towers in New York City, and one hit the Pentagon. Passengers on the fourth plane fought back, and it crashed in a field. Nearly 3,000 people died.","whoa":"The small town of Gander, Newfoundland, took in about 6,700 airline passengers who were stranded when skies closed.","question":"Which New York buildings were destroyed?","answer":"The World Trade Center towers","wrong":["The Empire State Building","The Statue of Liberty","Central Park"],"more":"The attacks were carried out by al-Qaeda, a terrorist group. They led to a U.S.-led war in Afghanistan, and later the war in Iraq. Air travel changed for good, with much tighter security checks. A memorial and museum now stand where the towers fell.","think":"How do communities come together after a tragedy?"},{"group":5,"year":2001,"approx":false,"kind":"invent","title":"Wikipedia","story":"Wikipedia launched as a free encyclopedia that anyone could edit. Volunteers around the world write and fix its articles. It grew into one of the most visited websites on Earth.","whoa":"The English version alone has more than 7 million articles.","question":"Who writes Wikipedia?","answer":"Volunteers","wrong":["Robots only","One company","Kings and queens"],"more":"Wikipedia has versions in over 300 languages. Anyone can edit, but volunteer editors watch for mistakes and vandalism, and articles are supposed to cite sources. Teachers often say it is a good place to start research but not the place to finish.","think":"Can something written by anyone be trusted?","sides":["Mostly yes. Many eyes catch mistakes quickly, and sources are listed.","Be careful. Errors can slip in, so check important facts elsewhere."]},{"group":5,"year":2003,"approx":false,"kind":"idea","title":"Reading the human genome","story":"Scientists from many countries spent 13 years mapping the human genome, the full set of instructions in our DNA. It has about 3 billion letters. This helps doctors understand and treat diseases.","whoa":"Reading it aloud at one letter per second, without ever stopping, would take about 95 years.","question":"About how many letters are in the human genome?","answer":"3 billion","wrong":["3 thousand","3 million","3 trillion"],"more":"The first genome cost about $3 billion to read. Today a person’s genome can be read for a few hundred dollars. Scientists found humans have only about 20,000 genes, fewer than expected. Gene editing tools like CRISPR now raise big questions about changing DNA.","think":"Should scientists be allowed to edit human genes?","sides":["Yes, to cure serious diseases that run in families.","Very carefully, if at all. Mistakes or “designer babies” could cause serious harm."]},{"group":5,"year":2004,"approx":false,"kind":"life","title":"The Indian Ocean tsunami","story":"An enormous earthquake under the sea near Indonesia sent giant waves across the Indian Ocean. They struck 14 countries, from Thailand to Somalia. About 230,000 people died, and countries later built a tsunami warning system.","whoa":"A 10-year-old girl named Tilly Smith saw the sea pull back and remembered from geography class that a tsunami might be coming. She warned people and helped clear a beach.","question":"What warning sign did Tilly Smith notice?","answer":"The sea pulled back quickly","wrong":["It started snowing","Birds sang louder","The sun turned green"],"more":"The earthquake had a magnitude of about 9.1, one of the strongest ever recorded. Waves reached up to 30 meters high in places. There was no warning system in the Indian Ocean then, so most people had no idea the waves were coming. People around the world donated billions to help.","think":"Why does knowing a few facts sometimes save lives?"},{"group":5,"year":2007,"approx":false,"kind":"invent","title":"Smartphones","story":"Apple introduced the iPhone, a phone with a big touchscreen and no keyboard. Smartphones soon let people carry a camera, maps, music and the internet in their pockets. Today most people on Earth have a mobile phone.","whoa":"A smartphone is far more powerful than the computer that guided Apollo 11 to the Moon.","question":"What was new about the iPhone in 2007?","answer":"A big touchscreen and no keyboard","wrong":["It was made of wood","It could fly","It had no screen"],"more":"Smartphones changed how people shop, meet, find directions and learn. They also raised concerns about screen time, sleep and attention. Some schools now limit phones during class. Most of the minerals inside come from mines around the world, some with poor working conditions.","think":"Should phones be banned in schools?","sides":["Yes. Kids focus better and talk more to each other without phones.","No. Phones can be useful tools, and students should learn to manage them."]},{"group":5,"year":2008,"approx":false,"kind":"ruler","title":"Barack Obama","story":"Barack Obama was elected president of the United States. He was the first African American to hold the job. He served two terms, until 2017.","whoa":"Before politics, he worked as a community organizer and taught law.","question":"Which country elected Barack Obama president?","answer":"The United States","wrong":["Kenya","Canada","Britain"],"more":"Obama’s father was from Kenya and his mother from Kansas. As president he passed a major health care law and led the country through a financial crisis. He won the Nobel Peace Prize in 2009, early in his presidency. Like every president, he had strong supporters and strong critics.","think":"Why does it matter to many people when someone is the first from their group to reach a top job?"},{"group":5,"year":2010,"approx":false,"kind":"idea","title":"The Arab Spring","story":"In December 2010, protests began in Tunisia and spread to Egypt, Libya, Syria and other countries. Many people wanted freedom, fair leaders and jobs. Some rulers fell, and in a few countries long wars followed.","whoa":"People used phones and social media to organize and share news of the protests.","question":"Where did the Arab Spring protests begin?","answer":"Tunisia","wrong":["Egypt","Iraq","Morocco"],"more":"It began when a Tunisian fruit seller, Mohamed Bouazizi, set himself on fire in protest after officials took his cart. Tunisia became a democracy for a time. Egypt’s leader resigned, and wars broke out in Libya, Syria and Yemen. Results were very different from country to country.","think":"Why do protests lead to freedom in some places and to war in others?"},{"group":5,"year":2012,"approx":false,"kind":"explore","title":"Curiosity lands on Mars","story":"NASA lowered a car-sized rover named Curiosity onto Mars with a rocket-powered “sky crane.” Curiosity found that Mars once had lakes that could have supported tiny life. It is still exploring.","whoa":"On its first anniversary, Curiosity hummed “Happy Birthday” to itself by vibrating one of its science instruments.","question":"What lowered Curiosity onto Mars?","answer":"A sky crane","wrong":["A ladder","A balloon","A giant net"],"more":"The landing was called the “seven minutes of terror” because it had to work automatically; radio signals take too long for controllers to help. Curiosity found organic molecules, the building blocks of life. Its wheels have worn holes from sharp Martian rocks.","think":"If we found tiny life on Mars, would it change how we see ourselves?","sides":["Yes. It would mean life is common in the universe.","Not much. Bacteria on Mars would be exciting, but life on Earth would go on the same."]},{"group":5,"year":2014,"approx":false,"kind":"idea","title":"Malala wins the Nobel Prize","story":"In Pakistan, Malala Yousafzai spoke up for girls’ right to go to school. In 2012 she was attacked for it, but she survived and kept speaking out. At 17, she became the youngest person ever to win the Nobel Peace Prize.","whoa":"She shared the prize with Kailash Satyarthi, who fights child labor in India.","question":"How old was Malala when she won the Nobel Peace Prize?","answer":"17","wrong":["27","37","12"],"more":"Malala began writing a blog for the BBC at 11 about life under the Taliban, who had banned girls from school. She was shot on a school bus at 15. She recovered in Britain and later studied at Oxford. Her fund supports girls’ education around the world.","think":"Why is education so powerful that some people fear it?","sides":["Education helps people think for themselves and question those in power.","It also brings new ideas that can challenge traditions some people want to protect."]},{"group":5,"year":2015,"approx":false,"kind":"explore","title":"Pluto up close","story":"The New Horizons spacecraft flew past Pluto after a journey of more than nine years. Its photos showed mountains of ice and a giant heart-shaped plain. Nobody had ever seen Pluto clearly before.","whoa":"Some ashes of Clyde Tombaugh, who discovered Pluto in 1930, rode along on the spacecraft.","question":"What shape is the big plain on Pluto?","answer":"A heart","wrong":["A star","A square","A crescent"],"more":"In 2006, astronomers decided Pluto was a “dwarf planet” because it has not cleared other objects from its orbit. New Horizons launched just months before. Its photos showed Pluto is geologically active, with glaciers of frozen nitrogen. The spacecraft later flew past an even more distant object, Arrokoth.","think":"Should Pluto still be called a planet?","sides":["No. Scientists need clear rules, and Pluto shares its orbit with many similar objects.","Yes. Pluto is complex and active, and the definition is too narrow."]},{"group":5,"year":2015,"approx":false,"kind":"idea","title":"The Paris climate agreement","story":"Almost every country in the world agreed in Paris to cut the gases that are warming the planet. The goal is to keep warming well below 2 degrees Celsius. Countries report on their progress every few years.","whoa":"The ten warmest years ever measured have all come since 2015.","question":"What is the Paris Agreement about?","answer":"Climate change","wrong":["Soccer","Space travel","The silk trade"],"more":"Each country sets its own goals, called nationally determined contributions, and the agreement has no penalties for missing them. Earth has warmed about 1.2 degrees Celsius since the 1800s. Countries disagree about how fast to cut fossil fuels and who should pay.","think":"Who should do the most to fight climate change?","sides":["Rich countries, which caused most past pollution and can afford to change.","Every country, including fast-growing ones that produce a lot of emissions today."]},{"group":5,"year":2019,"approx":false,"kind":"invent","title":"A photo of a black hole","story":"Eight radio telescopes around the world worked together like one telescope the size of Earth. They took the first picture of a black hole, in a galaxy called M87. It looks like a glowing orange ring around a dark center.","whoa":"That black hole is about 6.5 billion times heavier than our Sun.","question":"How many telescopes worked together?","answer":"Eight","wrong":["One","Two","Eight hundred"],"more":"The network is called the Event Horizon Telescope. It collected so much data that hard drives were flown to computing centers instead of sent online. Katie Bouman and others built computer methods to make the image. In 2022 the team photographed the black hole at the center of our own galaxy.","think":"Why do we spend so much effort to see things we can never visit?","sides":["Curiosity and knowledge are valuable in themselves.","It tests our theories, like Einstein’s, which helps all of science."]},{"group":5,"year":2020,"approx":false,"kind":"life","title":"The COVID-19 pandemic","story":"A new virus spread around the world. Schools and businesses closed, and many people stayed home for months. Scientists made vaccines in less than a year, much faster than ever before.","whoa":"Millions of kids went to school over video calls from their kitchens and bedrooms.","question":"How quickly were COVID-19 vaccines made?","answer":"Less than a year","wrong":["About 50 years","About 10 years","They never were"],"more":"Millions of people died worldwide, and many more were seriously ill. Health workers worked long, hard shifts. Countries made different choices about lockdowns, masks and school closures, and people still debate what worked best. New mRNA vaccine technology was used widely for the first time.","think":"How should countries prepare for the next pandemic?"},{"group":5,"year":2021,"approx":false,"kind":"invent","title":"A helicopter on Mars","story":"NASA’s Perseverance rover carried a tiny helicopter named Ingenuity to Mars. In April 2021, it made the first powered flight on another planet. It was planned to fly 5 times. It flew 72.","whoa":"It carried a stamp-sized piece of fabric from the Wright brothers’ first airplane.","question":"What was the Mars helicopter called?","answer":"Ingenuity","wrong":["Curiosity","Sputnik","Apollo"],"more":"Mars’s air is about 1 percent as thick as Earth’s, so Ingenuity’s blades spun about 2,500 times a minute. It weighed only 1.8 kilograms. Its final flight in 2024 damaged a blade. Engineers say future Mars helicopters could scout for rovers and astronauts.","think":"Why test something risky like a helicopter on another planet?","sides":["It opens new ways to explore places rovers cannot reach.","It was a small, cheap experiment, so even failure would teach a lot."]},{"group":5,"year":2021,"approx":false,"kind":"explore","title":"The James Webb telescope","story":"On December 25, 2021, the James Webb Space Telescope launched into space. Its gold-coated mirror is wider than a giraffe is tall. It sees infrared light, which lets it spot some of the first galaxies ever formed.","whoa":"It sits about 1.5 million kilometers from Earth, four times farther away than the Moon.","question":"What is Webb’s mirror coated with?","answer":"Gold","wrong":["Silver","Glass paint","Chocolate"],"more":"Webb’s mirror is made of 18 gold-coated hexagons that unfolded in space. A sunshield the size of a tennis court keeps it extremely cold. Canada built its guidance sensor and one science instrument. Webb has found galaxies from about 300 million years after the Big Bang.","think":"What question about the universe would you want Webb to answer?"},{"group":5,"year":2022,"approx":false,"kind":"battle","title":"War in Ukraine","story":"In February 2022, Russia launched a full invasion of its neighbor Ukraine. It became the biggest war in Europe since World War II. Millions of Ukrainians had to leave their homes.","whoa":"Ukraine’s flag is blue and yellow, for a blue sky over fields of wheat.","question":"Which country invaded Ukraine in 2022?","answer":"Russia","wrong":["Germany","Poland","Turkey"],"more":"Fighting in eastern Ukraine had already begun in 2014, when Russia also took over Crimea. The 2022 invasion caused great loss of life and destroyed cities. Many countries sent aid to Ukraine and placed sanctions on Russia. Canada has one of the largest Ukrainian communities outside Europe.","think":"How do wars far away affect people in other countries?"},{"group":5,"year":2022,"approx":false,"kind":"invent","title":"AI chatbots","story":"In late 2022, an AI chatbot called ChatGPT was released to the public. It could answer questions, write stories and help with code in everyday language. Many more AI assistants followed, and people began using them at school and work.","whoa":"ChatGPT reached about 100 million users in two months, faster than any app before it.","question":"What can AI chatbots do?","answer":"Answer questions in everyday language","wrong":["Grow plants","Cook dinner","Fix teeth"],"more":"Chatbots learn patterns from huge amounts of text. They can be very helpful but sometimes make up facts that sound convincing. Schools, artists and governments are debating rules about how AI should be used and how to make it safe.","think":"Should students be allowed to use AI for homework?","sides":["Yes, as a tutor that explains ideas, just like a calculator or a library.","Limits are needed. If AI does the thinking, students do not learn."]},{"group":5,"year":2022,"approx":false,"kind":"life","title":"Eight billion people","story":"On November 15, 2022, the United Nations said the world’s population had reached 8 billion. In 1800 there were only about 1 billion people. Better food, clean water and medicine helped people live longer.","whoa":"It took all of human history to reach 1 billion, but only about 12 years to go from 7 billion to 8.","question":"About how many people lived on Earth in 1800?","answer":"1 billion","wrong":["8 billion","100 million","10 thousand"],"more":"Population growth is slowing. In many countries families are having fewer children, and some populations, like Japan’s and Italy’s, are shrinking. India passed China as the most populous country in 2023. The UN expects world population to peak later this century.","think":"Is a growing population good or bad for the planet?","sides":["More people means more ideas and inventions to solve problems.","More people means more pressure on food, water and nature."]},{"group":5,"year":2023,"approx":false,"kind":"explore","title":"India lands near the Moon’s south pole","story":"India’s Chandrayaan-3 mission landed near the Moon’s south pole, where no spacecraft had landed before. Its little rover, Pragyan, drove around testing the soil. India became the fourth country to land softly on the Moon.","whoa":"Chandrayaan means “moon craft” in Sanskrit.","question":"Which country landed near the Moon’s south pole in 2023?","answer":"India","wrong":["Japan","Brazil","Egypt"],"more":"The Moon’s south pole may have ice in deep, shadowed craters, which could give future astronauts water and rocket fuel. A Russian lander crashed there just days before India’s success. Chandrayaan-3 cost less than many Hollywood space movies.","think":"Why are so many countries racing to the Moon’s south pole?","sides":["Water ice there could support future bases and fuel.","National pride. Being first is a sign of power."]},{"group":5,"year":2024,"approx":false,"kind":"life","title":"The great eclipse","story":"On April 8, 2024, the Moon blocked the Sun along a path across Mexico, the United States and Canada. Millions of people watched the sky go dark in the middle of the day. Niagara Falls and Montreal were in the path.","whoa":"During totality you can see the Sun’s glowing outer layer, the corona, with your own eyes.","question":"What blocks the Sun in a solar eclipse?","answer":"The Moon","wrong":["A cloud","Mars","A comet"],"more":"Total solar eclipses happen somewhere on Earth about every year and a half, but any one spot sees one only every few hundred years on average. People must use special eclipse glasses except during totality. Scientists used the eclipse to study the Sun’s corona and how animals react.","think":"Why do eclipses still amaze people even though we can predict them?","sides":["Because seeing day turn to night is powerful, no matter how well you understand it.","Because they make us feel connected to everyone else watching."]},{"group":5,"year":2025,"approx":false,"kind":"ruler","title":"The first American pope","story":"After Pope Francis died, cardinals met in the Sistine Chapel to choose a new pope. They picked Robert Prevost from Chicago, who took the name Leo XIV. He is the first pope from the United States.","whoa":"He spent many years as a missionary in Peru and is also a citizen of Peru.","question":"Which name did the new pope choose?","answer":"Leo XIV","wrong":["Francis II","John XXIV","Peter II"],"more":"The pope leads the Catholic Church, which has about 1.4 billion members. Cardinals vote in secret; black smoke from the chimney means no decision, white smoke means a new pope. Leo XIV is also the first pope from the Augustinian order.","think":"Why do you think the cardinals choose a new pope in secret?"},{"group":5,"year":2026,"approx":false,"kind":"explore","title":"Artemis II circles the Moon","story":"In April 2026, four astronauts flew around the Moon in NASA’s Orion spacecraft. They were the first people to travel to the Moon since 1972. The crew included the first woman, the first Black astronaut and the first Canadian, Jeremy Hansen, to make the trip.","whoa":"In Greek myth, Artemis is the twin sister of Apollo, so the new program is named after the old one’s sister.","question":"Who was the Canadian on Artemis II?","answer":"Jeremy Hansen","wrong":["Chris Hadfield","Neil Armstrong","Roberta Bondar"],"more":"The crew were Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen. The mission tested the Orion spacecraft with people aboard for the first time. NASA plans for later Artemis missions to land astronauts near the Moon’s south pole.","think":"Should people return to the Moon, or send robots instead?","sides":["People. Humans can explore, fix problems and inspire others in ways robots cannot.","Robots. They are cheaper and safer, and can go places people cannot survive."]},{"group":5,"year":2026,"approx":false,"kind":"life","title":"A World Cup for three countries","story":"Canada, the United States and Mexico hosted the first World Cup with 48 teams. Games were played in 16 cities, including Toronto and Vancouver. Spain beat Argentina 1–0 in the final.","whoa":"It was the first time Canada hosted men’s World Cup games.","question":"Who won the 2026 World Cup?","answer":"Spain","wrong":["Argentina","Canada","Brazil"],"more":"The 2026 World Cup had 104 matches, more than any before. Hosting brought fans and money to cities, but also high costs for stadiums and security. Canada’s men’s team played home games in Toronto and Vancouver.","think":"Is it worth it for a city to host a giant sports event?","sides":["Yes. It brings visitors, pride and global attention.","Often not. Costs can be huge, and the benefits do not always reach ordinary residents."]},{"group":1,"year":-730,"approx":true,"kind":"ruler","title":"Kush rules Egypt","story":"South of Egypt, along the Nile in what is now Sudan, lay the kingdom of Kush. Its king Piye marched north and conquered Egypt. For about 70 years, Kushite kings ruled as Egypt’s pharaohs, the 25th Dynasty.","whoa":"Sudan has more pyramids than Egypt, about 200, built by the kings and queens of Kush.","question":"In which modern country was the kingdom of Kush?","answer":"Sudan","wrong":["Morocco","Kenya","Greece"],"more":"Kushites worshipped many Egyptian gods and saw themselves as protecting Egypt’s old traditions. After the Assyrians drove them out, Kush thrived for centuries more, with its capital at Meroë, famous for iron-working. Several powerful queens, called kandakes, ruled Kush.","think":"Why are African kingdoms like Kush less famous than Egypt?","sides":["Egypt left more writing and monuments that early historians studied.","Old ideas about Africa led scholars to overlook Kush for a long time."]},{"group":1,"year":330,"approx":true,"kind":"ruler","title":"Aksum becomes Christian","story":"The kingdom of Aksum, in what is now Ethiopia and Eritrea, traded across the Red Sea with Rome, Persia and India. Around 330, King Ezana became a Christian, making Aksum one of the first Christian kingdoms in the world. It minted its own gold coins.","whoa":"A Persian writer of the 200s listed Aksum as one of the four great powers of the world, alongside Rome, Persia and China.","question":"Which modern country was home to Aksum?","answer":"Ethiopia","wrong":["Egypt","Nigeria","South Africa"],"more":"Aksum is famous for giant carved stone pillars called stelae, some over 20 meters tall. Italian soldiers took one to Rome in 1937; it was returned to Ethiopia in 2005. The Ethiopian Orthodox Church, which grew from Aksum, is one of the oldest Christian churches.","think":"Why might a trading kingdom be open to new religions?","sides":["Traders meet new people and ideas all the time.","A shared religion with trading partners can make deals and friendships easier."]},{"group":2,"year":1200,"approx":true,"kind":"build","title":"The rock churches of Lalibela","story":"King Lalibela of Ethiopia had eleven churches carved downward into solid rock. Workers dug trenches around great blocks of stone, then hollowed them out into churches with doors, windows and columns. Each church is a single piece of rock.","whoa":"Lalibela was meant to be a “New Jerusalem,” so Ethiopian Christians could make a pilgrimage without traveling to the Holy Land.","question":"What were Lalibela’s churches carved from?","answer":"Solid rock","wrong":["Ice","Wood","Clay bricks"],"more":"The largest church, Bete Medhane Alem, may be the biggest rock-cut church in the world. Lalibela is still a working holy site, and thousands of pilgrims gather there for Ethiopian Christmas. It is a UNESCO World Heritage Site.","think":"Why would people carve buildings down into rock instead of building up?","sides":["Rock-cut churches last for centuries and need no building materials brought in.","Hidden below ground, they might have been safer from enemies."]},{"group":2,"year":1500,"approx":true,"kind":"build","title":"The Benin Bronzes","story":"Artists in the Kingdom of Benin, in what is now Nigeria, made thousands of brass plaques and sculptures for the royal palace. They showed kings, warriors, ceremonies and even Portuguese traders. The artists worked in a guild that served the king, the Oba.","whoa":"In 1897, British soldiers attacked Benin City and took thousands of these artworks. Many ended up in museums in Europe and North America.","question":"Who ruled the Kingdom of Benin?","answer":"The Oba","wrong":["The pharaoh","The shogun","The sultan"],"more":"The plaques worked like a history record of the court. Benin City had huge earthen walls, built over centuries. Since 2022, Germany, the Smithsonian and some other museums have returned bronzes to Nigeria, but many are still held abroad.","think":"Should museums return objects that were taken during wars?","sides":["Yes. They were stolen, and they belong to the people whose history they record.","Some museums argue they keep objects safe and let more people see them, though many have started returning them."]},{"group":2,"year":1526,"approx":false,"kind":"idea","title":"King Afonso of Kongo protests the slave trade","story":"The Kingdom of Kongo, in central Africa, made friends with Portugal and its king Afonso I became a Christian. But Portuguese traders began kidnapping and enslaving Kongo people. In 1526, Afonso wrote letters to the king of Portugal begging him to stop it.","whoa":"Afonso’s letters still survive. They are among the oldest documents written by an African ruler in a European language.","question":"What did King Afonso ask the king of Portugal to stop?","answer":"The kidnapping and enslaving of his people","wrong":["Building churches","Selling cloth","Teaching Portuguese"],"more":"Afonso sent his own son to study in Portugal, and Kongo had schools and churches. But Portugal ignored his pleas, and the slave trade grew. The kingdom weakened over the next centuries under the pressure.","think":"What can a leader do when a powerful partner is harming their people?","sides":["Speak out and protest, as Afonso did, even if it may not work.","Break the partnership, even at great cost, to protect your people."]},{"group":3,"year":1624,"approx":false,"kind":"ruler","title":"Queen Nzinga of Ndongo","story":"Nzinga became queen of Ndongo and Matamba, in what is now Angola, and spent decades resisting Portuguese invaders and slave raiders. She was a skilled diplomat and a military leader who fought in battle into her sixties.","whoa":"At a meeting with the Portuguese governor, she was offered no chair, so one of her servants knelt to make a seat. She would not stand below him.","question":"Which modern country was Queen Nzinga’s kingdom in?","answer":"Angola","wrong":["Egypt","Ghana","Kenya"],"more":"Nzinga made alliances with the Dutch to fight Portugal and welcomed people who had escaped slavery into her army. Some criticize her for also taking part in the slave trade herself. She is honored in Angola today as a national hero.","think":"Can a leader be a hero and still have done wrong things?","sides":["Yes. She defended her people brilliantly for 40 years.","Her role in the slave trade should not be ignored when we honor her."]},{"group":3,"year":1750,"approx":true,"kind":"life","title":"The Atlantic slave trade","story":"Between the 1500s and 1800s, European traders forced about 12.5 million Africans onto ships bound for the Americas. They were packed into ships for the terrible crossing called the Middle Passage. Those who survived were sold and forced to work on plantations, often growing sugar, cotton and tobacco.","whoa":"About 2 million people died during the crossing alone.","question":"What was the terrible ocean crossing called?","answer":"The Middle Passage","wrong":["The Silk Road","The Royal Road","The Northwest Passage"],"more":"The trade linked Europe, Africa and the Americas in a triangle of goods and people. Enslaved people resisted in many ways, from revolts on ships to running away and keeping their cultures alive. Their music, food and beliefs shaped cultures across the Americas.","think":"Why is it important to learn about the slave trade even though it is painful?"},{"group":3,"year":1834,"approx":false,"kind":"idea","title":"Slavery ends in the British Empire","story":"After decades of campaigning, Britain passed a law ending slavery in most of its empire, including what is now Canada. It took effect on August 1, 1834. About 800,000 enslaved people were freed, though many were forced to keep working for several more years.","whoa":"Canada now marks August 1 as Emancipation Day.","question":"On which date did the law ending British slavery take effect?","answer":"August 1, 1834","wrong":["July 1, 1867","January 1, 1900","July 4, 1776"],"more":"Campaigners included Olaudah Equiano, who had been enslaved and wrote about it, and William Wilberforce. Revolts by enslaved people, like one in Jamaica in 1831, also pushed Britain to act. Britain paid enslavers compensation, but the freed people received nothing.","think":"Who deserves most credit for ending slavery?","sides":["Campaigners in Britain who changed laws and public opinion.","Enslaved people themselves, whose revolts and resistance made slavery impossible to keep."]},{"group":3,"year":1816,"approx":false,"kind":"ruler","title":"Shaka builds the Zulu kingdom","story":"Shaka became chief of the small Zulu clan in southern Africa and quickly turned it into a powerful kingdom. He reorganized his army, trained soldiers to fight in tight groups and is said to have introduced a short stabbing spear.","whoa":"Shaka’s army used a battle formation called the “bull’s horns,” surrounding enemies from both sides.","question":"What famous formation did Shaka’s army use?","answer":"The bull’s horns","wrong":["The turtle","The phalanx","The wedge"],"more":"Shaka’s wars were part of a time of upheaval in southern Africa that caused many people to flee. He was killed by his half-brothers in 1828. Historians still argue about how much of his fierce reputation is true and how much came from biased European accounts.","think":"Should Shaka be remembered as a great leader or a brutal one?","sides":["A great leader. He built a strong nation that later fought the British Empire.","A brutal one. His wars caused enormous suffering for neighboring peoples."]},{"group":4,"year":1957,"approx":false,"kind":"ruler","title":"Ghana wins independence","story":"The British colony of the Gold Coast became the independent country of Ghana, led by Kwame Nkrumah. It was one of the first African colonies to win freedom from European rule. Within ten years, dozens of other African countries became independent.","whoa":"Ghana chose its name in honor of the old Ghana Empire, a powerful West African kingdom from over 1,000 years earlier.","question":"Who led Ghana to independence?","answer":"Kwame Nkrumah","wrong":["Nelson Mandela","Mansa Musa","Haile Selassie"],"more":"Nkrumah dreamed of a united Africa and helped found what became the African Union. He later banned opposition parties and was overthrown in 1966. Ghana is now a stable democracy, and its independence day is March 6.","think":"Why is building a country after independence so hard?","sides":["Colonial rulers left weak institutions and borders that divided peoples.","New leaders sometimes held on to power too tightly once they had it."]},{"group":5,"year":2004,"approx":false,"kind":"idea","title":"Wangari Maathai plants a movement","story":"Wangari Maathai of Kenya started the Green Belt Movement, paying women to plant trees to fight soil erosion and earn income. She was jailed and beaten for protesting against the government. In 2004 she became the first African woman to win the Nobel Peace Prize.","whoa":"The Green Belt Movement has planted tens of millions of trees in Kenya.","question":"What did the Green Belt Movement do?","answer":"Planted trees","wrong":["Built roads","Trained soldiers","Mined gold"],"more":"Maathai was also the first woman in East and Central Africa to earn a doctorate. She argued that protecting the environment, fighting poverty and building democracy are all connected. She died in 2011.","think":"How can planting a tree be a political act?","sides":["It protects land that powerful people might want to take or destroy.","It gives ordinary people, especially women, independence and a voice."]}]},"myths":{"name":"Myths & Legends","word":"Book","short":"Book","icon":"moon","order":"book","start":-1000,"tint":"#ff7096","passport":"legends passport","scaleTitle":"When each story was first written down","yearMeaning":"written down","groups":[{"id":1,"name":"Greek Gods & Heroes","short":"Greek","color":"#8fb8ff","watermark":"ΘΕΟΙ"},{"id":2,"name":"Homer’s Tales","short":"Homer","color":"#ff936e","watermark":"ΟΜΗΡΟΣ"},{"id":3,"name":"The Bhagavad Gita","short":"Gita","color":"#ffc94d","watermark":"गीता"},{"id":4,"name":"Japanese Myths","short":"Japan","color":"#ff7096","watermark":"神話"},{"id":5,"name":"Polynesian Myths","short":"Polynesia","color":"#4fd6b4","watermark":"Hawaiki","scaleNote":"Told aloud for centuries before anyone wrote it down"},{"id":6,"name":"Norse Myths","short":"Norse","color":"#b8a4ff","watermark":"EDDA"},{"id":7,"name":"African Myths","short":"Africa","color":"#6fd37a","watermark":"Sankofa","scaleNote":"Some carved in Egypt over 4,000 years ago, others told aloud until recent times"}],"facts":[{"headline":"Homer’s poems and the first Olympic Games come from the same century.","detail":"Both date to the 700s BC, when Greek city-states were just getting started."},{"headline":"Japan’s Izanagi and Greece’s Orpheus both lost their wives by looking at them in the land of the dead.","detail":"The two stories come from opposite ends of Asia, with no known contact between them."},{"headline":"The Mahabharata is about ten times as long as the Iliad and the Odyssey put together.","detail":"The Bhagavad Gita is only a small part of it, 700 verses."},{"headline":"Pandora never had a box. In the oldest Greek telling, it was a big storage jar.","detail":"A scholar translating the story in the 1500s mixed up the word, and “box” stuck."},{"headline":"The Kojiki was written in 712, less than 100 years before Charlemagne was crowned emperor.","detail":"Find Charlemagne on the History line, Volume 2."},{"headline":"Polynesian voyagers settled islands spread across an area of ocean bigger than Russia.","detail":"The Polynesian Triangle runs from Hawaiʻi to New Zealand to Rapa Nui (Easter Island)."},{"headline":"NASA named its Moon missions after Greek twins: first Apollo, now his sister Artemis.","detail":"Artemis II flew four astronauts around the Moon in 2026. Find it on the History line."},{"headline":"Four days of the week are named after Norse and Germanic gods.","detail":"Tuesday for Týr, Wednesday for Odin (Woden), Thursday for Thor, and Friday for Frigg."},{"headline":"Anansi the spider crossed the Atlantic.","detail":"Enslaved Akan people carried his stories to the Caribbean and the Americas, where he became Aunt Nancy and Br’er Anansi."}],"stories":[{"group":1,"year":-700,"approx":true,"kind":"creation","title":"Chaos, Gaia and the Titans","story":"In the beginning there was Chaos, a vast empty gap. Out of it came Gaia, the Earth, who gave birth to Ouranos, the Sky. Their children were the Titans, giant gods who ruled the world before the Olympians.","whoa":"People still use “Gaia” as a name for planet Earth.","question":"Who was the Earth in Greek myth?","answer":"Gaia","wrong":["Hera","Athena","Nyx"],"source":"Hesiod’s Theogony","more":"Hesiod’s Theogony means “birth of the gods.” Ouranos hid his children inside Gaia, so she gave her son Kronos a sickle to overthrow him. Many cultures have creation stories where sky and earth start out joined and must be separated, like the Māori story of Rangi and Papa.","think":"Why do so many cultures imagine the world began as darkness or emptiness?","sides":["Because it matches what people see each night: light coming out of darkness.","Because it is hard to imagine “nothing,” so stories begin with something shapeless instead."]},{"group":1,"year":-700,"approx":true,"kind":"god","title":"Kronos swallows his children","story":"The Titan Kronos heard a prophecy that one of his children would overthrow him. So each time his wife Rhea had a baby, he swallowed it whole. When Zeus was born, Rhea hid him in a cave on Crete and gave Kronos a stone wrapped in a blanket instead.","whoa":"Baby Zeus was raised on the milk of a goat named Amalthea.","question":"What did Rhea give Kronos instead of baby Zeus?","answer":"A stone wrapped in a blanket","wrong":["A lamb","An apple","A golden egg"],"source":"Hesiod’s Theogony","more":"Kronos had overthrown his own father, so he feared the same would happen to him. The prophecy came true anyway, because his cruelty made his wife and children turn against him. Greek myths often show people causing the very fate they try to avoid.","think":"Can trying to stop something from happening make it more likely?","sides":["Yes. Kronos’s fear made Rhea and Zeus fight back, which fulfilled the prophecy.","Not always. Sometimes careful planning really does prevent disaster."]},{"group":1,"year":-700,"approx":true,"kind":"god","title":"Zeus and the war of the gods","story":"Grown-up Zeus made Kronos cough up his brothers and sisters: Hestia, Demeter, Hera, Hades and Poseidon. Together they fought the Titans for ten years. The one-eyed Cyclopes forged a thunderbolt for Zeus, a trident for Poseidon and a helmet of invisibility for Hades.","whoa":"Afterward the brothers split the world: Zeus took the sky, Poseidon the sea, and Hades the underworld.","question":"Which god ruled the sea?","answer":"Poseidon","wrong":["Hades","Apollo","Ares"],"source":"Hesiod’s Theogony","more":"This war is called the Titanomachy. Zeus won partly by freeing the Cyclopes and the hundred-handed giants whom Kronos had imprisoned, and they fought on his side. The defeated Titans were locked in Tartarus, a pit deep below the underworld. Atlas was punished by having to hold up the sky.","think":"Is Zeus any better than Kronos, or just the next ruler?","sides":["Better. He shared power with his siblings and set up order among the gods.","Not really. He took power by force and later punished others harshly too."]},{"group":1,"year":-700,"approx":true,"kind":"god","title":"Prometheus steals fire","story":"The Titan Prometheus felt sorry for humans shivering in the dark. He stole fire from the gods, hiding a glowing ember inside a hollow fennel stalk. Zeus chained him to a mountain, where an eagle came every day to eat his liver, which grew back every night.","whoa":"The hero Heracles finally set Prometheus free.","question":"How did Prometheus carry the stolen fire?","answer":"Inside a fennel stalk","wrong":["In a lantern","In his bare hands","In a seashell"],"source":"Hesiod’s Theogony","more":"Prometheus means “forethought.” In some stories he also shaped the first humans from clay. Fire stands for technology and skill, the things that set humans apart. Writers have called Prometheus a symbol of rebellion and of science, and Mary Shelley subtitled Frankenstein “The Modern Prometheus.”","think":"Was Prometheus right to break the gods’ rules to help humans?","sides":["Yes. Some rules are unjust, and helping others can be worth the punishment.","Rules exist for reasons. Gifts like fire, or new technology, can also be dangerous."]},{"group":1,"year":-700,"approx":true,"kind":"lesson","title":"Pandora’s jar","story":"Zeus had the gods make the first woman, Pandora, and sent her to earth with a sealed jar. She was told never to open it. Curiosity won, and out flew sickness, sorrow and all the world’s troubles. She slammed the lid just in time to keep one thing inside: Hope.","whoa":"In the oldest telling it was a big storage jar, not a box. A translator in the 1500s mixed up the word.","question":"What stayed inside Pandora’s jar?","answer":"Hope","wrong":["Gold","Love","Fire"],"source":"Hesiod’s Works and Days","more":"Hesiod told the story partly as punishment for Prometheus’s theft of fire, and blamed women for humanity’s troubles, a view many readers today reject. The meaning of Hope staying in the jar is debated: was it saved for humans, or kept from them?","think":"Is it good that Hope stayed in the jar?","sides":["Yes. It means hope is saved for people, helping them face troubles.","Maybe not. Hope trapped inside could mean it is kept away from us."]},{"group":1,"year":-600,"approx":true,"kind":"lesson","title":"Persephone and the seasons","story":"Hades, god of the underworld, carried off Persephone, daughter of Demeter, the harvest goddess. Demeter searched the earth in grief, and nothing would grow. Zeus ordered Persephone home, but she had eaten pomegranate seeds in the underworld, so she must return there part of every year.","whoa":"The Greeks used this story to explain winter. When Persephone is away, Demeter mourns and the fields go bare.","question":"What fruit did Persephone eat in the underworld?","answer":"Pomegranate","wrong":["Apple","Fig","Grape"],"source":"The Homeric Hymn to Demeter","more":"In some versions, Persephone ate six seeds and spends six months below; in others, it is a third of the year. As queen of the underworld, she became a powerful goddess, not just a victim. A secret festival at Eleusis honored Demeter and Persephone for nearly 2,000 years.","think":"Why do people tell stories to explain things like seasons?","sides":["Before science, stories were how people made sense of nature.","Stories also carry feelings, like how winter feels like loss and spring like return."]},{"group":1,"year":-430,"approx":true,"kind":"god","title":"Athena wins Athens","story":"Athena and Poseidon both wanted to be the patron of a new city. Poseidon struck a rock with his trident and a spring of salty sea water gushed out. Athena planted the first olive tree, which gave food, oil and wood. The people chose the olive, and the city was named Athens.","whoa":"Visitors to the Acropolis were shown an ancient olive tree said to be Athena’s.","question":"What gift won Athena the city?","answer":"An olive tree","wrong":["A horse","A spring of water","A golden shield"],"source":"Herodotus’s Histories","more":"Athena was goddess of wisdom, crafts and strategy in war. The olive was central to Athens: its oil was used for food, lamps and soap, and prize jars of it were given at the Panathenaic Games. In one version, women voted for Athena and men for Poseidon, and the women won by one vote.","think":"Was the olive tree really a better gift than water?","sides":["Yes. It fed and supported people for generations.","Poseidon’s gift meant sea power, which later made Athens rich and strong."]},{"group":1,"year":-700,"approx":true,"kind":"monster","title":"Perseus and Medusa","story":"Medusa was a Gorgon with snakes for hair, and anyone who looked at her turned to stone. Perseus borrowed winged sandals and a polished shield. He watched her reflection in the shield instead of looking at her directly, and cut off her head.","whoa":"The winged horse Pegasus sprang up from the spot where she fell.","question":"How did Perseus avoid Medusa’s stare?","answer":"He watched her reflection in his shield","wrong":["He closed his eyes","He wore dark glasses","He hid in a cave"],"source":"Hesiod’s Theogony","more":"In Ovid’s later telling, Medusa was a beautiful woman cursed by Athena. Perseus used her head as a weapon, turning a sea monster to stone to save Princess Andromeda. Some modern writers retell Medusa as a victim rather than a monster.","think":"Was Medusa a monster or a victim?","sides":["A monster. She turned innocent people to stone.","A victim. She was cursed for something that was not her fault, then hunted."]},{"group":1,"year":-600,"approx":true,"kind":"hero","title":"The twelve labors of Heracles","story":"Heracles, son of Zeus, was the strongest man alive. To make up for a terrible deed, he had to complete twelve impossible tasks. He wrestled the Nemean lion, fought the many-headed Hydra, and cleaned the filthy stables of King Augeas in one day by making two rivers flow through them.","whoa":"The Romans called him Hercules.","question":"How did Heracles clean the Augean stables?","answer":"He made two rivers flow through them","wrong":["He used a giant broom","He burned them down","He asked the gods for help"],"source":"Greek poets and vase painters","more":"Hera, Zeus’s wife, hated Heracles and drove him into a madness in which he harmed his own family. The labors were his penance. They included capturing the three-headed dog Cerberus and fetching golden apples. After death, he became a god on Olympus.","think":"Can doing hard good deeds make up for a terrible mistake?","sides":["Yes. Effort and change show real regret.","Some harm cannot be undone, no matter how many good deeds follow."]},{"group":1,"year":-550,"approx":true,"kind":"monster","title":"Theseus and the Minotaur","story":"Every few years, Athens had to send young people to Crete to be fed to the Minotaur, a monster with a bull’s head, kept in a maze called the labyrinth. Prince Theseus volunteered to go. Princess Ariadne gave him a ball of thread to unwind, so after slaying the Minotaur he could find his way out.","whoa":"Archaeologists found a huge maze-like palace at Knossos on Crete. Look for the Minoans on the History line.","question":"What did Ariadne give Theseus?","answer":"A ball of thread","wrong":["A sword","A map","A lantern"],"source":"Greek vase paintings","more":"Theseus promised his father, King Aegeus, to raise white sails if he survived. He forgot, and Aegeus, seeing black sails, threw himself into the sea, which is why it is called the Aegean. Theseus also abandoned Ariadne on an island on the way home.","think":"Is Theseus a true hero?","sides":["Yes. He bravely ended the monster’s killing.","Not entirely. He broke promises and left Ariadne, who saved him."]},{"group":1,"year":8,"approx":false,"kind":"lesson","title":"Daedalus and Icarus","story":"The inventor Daedalus built the labyrinth, then was trapped on Crete himself. He made wings from feathers and wax for himself and his son Icarus. He warned Icarus not to fly too close to the sun. Icarus soared higher and higher, the wax melted, and he fell into the sea.","whoa":"Part of the Aegean Sea is still called the Icarian Sea.","question":"What held Icarus’s wings together?","answer":"Wax","wrong":["Glue","Rope","Iron nails"],"source":"Ovid’s Metamorphoses","more":"Daedalus warned Icarus not to fly too high, near the sun, or too low, near the sea, where spray would soak the feathers. The story is often used to warn against overconfidence. Some people now see Icarus as brave, daring to go higher.","think":"Is the lesson “don’t aim too high” or “find a balance”?","sides":["Be careful. Ambition without limits leads to a fall.","Take the middle path. Flying too low was dangerous too."]},{"group":1,"year":8,"approx":false,"kind":"lesson","title":"Arachne the weaver","story":"Arachne was a brilliant weaver who boasted she was better than Athena, goddess of crafts. Athena challenged her to a contest. Arachne’s tapestry was flawless, but it mocked the gods. Furious, Athena turned her into a spider, to weave forever.","whoa":"Spiders, scorpions and their relatives are called arachnids after her.","question":"What did Athena turn Arachne into?","answer":"A spider","wrong":["A moth","A snake","A bird"],"source":"Ovid’s Metamorphoses","more":"In Ovid’s version, Arachne’s tapestry showed the gods tricking and harming humans, while Athena’s showed gods punishing those who challenged them. Arachne’s work was actually perfect. Some readers see her as an artist punished for telling an uncomfortable truth.","think":"Was Arachne punished for pride or for honesty?","sides":["Pride. She insulted a goddess and refused to be humble.","Honesty. Her art told the truth about the gods, and they could not bear it."]},{"group":1,"year":8,"approx":false,"kind":"lesson","title":"King Midas’s golden touch","story":"The god Dionysus offered King Midas any wish. Midas wished that everything he touched would turn to gold. It was wonderful until his food and drink turned to gold too. He begged to be cured and was told to wash in the River Pactolus.","whoa":"That river really did carry flakes of gold, which helped make the kingdom of Lydia rich.","question":"Which god granted Midas’s wish?","answer":"Dionysus","wrong":["Zeus","Hermes","Apollo"],"source":"Ovid’s Metamorphoses","more":"Midas got his wish as a reward for helping Silenus, a friend of Dionysus. In another myth, Midas judged a music contest badly, and Apollo gave him donkey ears. The phrase “Midas touch” now means someone who makes money from everything.","think":"What is something you think would be great but could turn out badly?","sides":["Endless money. You could do anything, but you might stop valuing what matters.","Being famous. Attention seems fun, but it can take away privacy and peace."]},{"group":1,"year":-29,"approx":false,"kind":"quest","title":"Orpheus and Eurydice","story":"Orpheus played music so beautiful that even rocks and trees followed him. When his wife Eurydice died, he went down to the underworld and charmed Hades with his songs. Hades let her go on one condition: Orpheus must not look back until they reached the sunlight. Just before the end, he turned around, and she vanished.","whoa":"A Japanese myth about the god Izanagi has a very similar ending. Find it in the Japanese Myths book.","question":"What was the one rule Orpheus had to follow?","answer":"Don’t look back","wrong":["Don’t speak","Don’t eat","Don’t sing"],"source":"Virgil’s Georgics","more":"Orpheus was said to be the son of the muse Calliope, and his music could calm wild beasts. Some think his failure shows how hard it is to trust when you cannot see. The story has inspired operas, paintings and the musical Hadestown.","think":"Why did Orpheus look back?","sides":["Doubt. He could not trust that Eurydice was really there.","Love. He needed to see her, even knowing the cost."]},{"group":2,"year":-650,"approx":true,"kind":"god","title":"The golden apple","story":"Eris, goddess of discord, tossed a golden apple marked “for the fairest” among the goddesses. Hera, Athena and Aphrodite each claimed it. A Trojan prince named Paris had to choose. Aphrodite promised him the most beautiful woman in the world, so he picked her.","whoa":"That woman was Helen, who was already married to the king of Sparta. Trouble followed.","question":"Which goddess did Paris choose?","answer":"Aphrodite","wrong":["Hera","Athena","Artemis"],"source":"The Cypria, a lost poem","more":"Eris threw the apple because she was the only goddess not invited to a wedding, of the sea nymph Thetis and King Peleus, who became Achilles’ parents. Zeus refused to judge and handed the choice to Paris. Each goddess offered a bribe: Hera offered power, Athena offered wisdom and victory, Aphrodite offered love.","think":"Which gift would you have chosen: power, wisdom or love?","sides":["Wisdom. It helps you make every other choice well.","Love. Power and wisdom feel empty without people you care about."]},{"group":2,"year":-750,"approx":true,"kind":"quest","title":"A thousand ships sail for Troy","story":"Paris took Helen, queen of Sparta, home with him to Troy. Her husband Menelaus and his brother Agamemnon gathered a great Greek army and fleet. They camped outside Troy’s walls, and the siege dragged on for ten years.","whoa":"An English playwright later described Helen as having a face that launched a thousand ships.","question":"How long did the siege of Troy last?","answer":"Ten years","wrong":["Ten days","One year","Fifty years"],"source":"Homer’s Iliad","more":"Helen’s suitors had sworn to defend whoever married her, so all the Greek kings had to join. Some versions say Helen went willingly, others that she was taken. A real city of Troy existed in what is now Turkey, and it was destroyed around 1200 BC, though no one knows if the war happened as told.","think":"Was the Trojan War really about Helen?","sides":["Yes, in the story. Honor and a promise forced the kings to fight.","Probably not in real life. Wars are usually about land, trade and power."]},{"group":2,"year":-750,"approx":true,"kind":"hero","title":"The rage of Achilles","story":"The Iliad begins with anger. Agamemnon took a prize away from Achilles, the greatest Greek warrior. Achilles was so furious that he refused to fight, and the Greeks began losing battle after battle.","whoa":"The Iliad covers only about 50 days of the ten-year war.","question":"Why did Achilles stop fighting?","answer":"He was angry at Agamemnon","wrong":["He was injured","He was afraid","He went home to sleep"],"source":"Homer’s Iliad","more":"The Iliad’s first word in Greek is mēnis, meaning “rage.” Achilles had been told he could live a long, quiet life or a short, glorious one. While he sulked, many Greeks died. The poem asks whether pride is worth what it costs others.","think":"Was Achilles right to refuse to fight?","sides":["Yes. Agamemnon insulted him, and he had the right to stand up for himself.","No. His friends died because of his pride."]},{"group":2,"year":-750,"approx":true,"kind":"hero","title":"Hector and King Priam","story":"Achilles’ best friend Patroclus put on Achilles’ armor and was killed by Hector, the prince of Troy. Achilles returned to battle and killed Hector. Then Hector’s old father, King Priam, crept into the Greek camp at night to beg for his son’s body. Achilles wept with him and gave it back.","whoa":"The Iliad ends not with a victory but with Hector’s funeral.","question":"Who came to ask Achilles for Hector’s body?","answer":"King Priam","wrong":["Helen","Paris","Odysseus"],"source":"Homer’s Iliad","more":"Achilles dragged Hector’s body behind his chariot for days. Priam’s visit is one of the most famous scenes in literature: two enemies grieving together. Hector is often seen as the most decent hero in the poem, fighting to protect his family and city.","think":"Can enemies find something in common?","sides":["Yes. Achilles and Priam both knew what it meant to lose someone they loved.","Only for a moment. The war started again the next day."]},{"group":2,"year":95,"approx":true,"kind":"hero","title":"Achilles’ heel","story":"When Achilles was a baby, his mother Thetis dipped him in the magical River Styx to make him unbeatable. But she held him by one heel, which stayed dry. Years later, Paris shot an arrow that struck Achilles right there.","whoa":"The tendon at the back of your ankle is called the Achilles tendon.","question":"Where was Achilles’ only weak spot?","answer":"His heel","wrong":["His elbow","His neck","His knee"],"source":"Statius’s Achilleid","more":"Homer never mentions the heel; that detail comes from later writers. In the Iliad, Achilles knows he will die young at Troy. Today “Achilles’ heel” means a small weakness in something strong.","think":"What is the difference between a weakness and a flaw?","sides":["A weakness is something you cannot help, like Achilles’ heel.","A flaw is something in your character you could change, like Achilles’ pride."]},{"group":2,"year":-725,"approx":true,"kind":"hero","title":"The Trojan Horse","story":"Clever Odysseus had an idea. The Greeks built a giant wooden horse, hid soldiers inside, and pretended to sail away. The Trojans pulled the horse into their city as a trophy. That night the soldiers climbed out and opened the gates.","whoa":"Computer programs that sneak in disguised as something harmless are called Trojans.","question":"Whose idea was the Trojan Horse?","answer":"Odysseus","wrong":["Achilles","Hector","Zeus"],"source":"Homer’s Odyssey","more":"A Trojan priest, Laocoön, warned his people, “Beware of Greeks bearing gifts,” but sea serpents killed him. Princess Cassandra also warned them, but she was cursed so no one believed her. The fall of Troy is told most fully in Virgil’s Aeneid.","think":"Was the Trojan Horse clever or unfair?","sides":["Clever. War is about strategy, and the trick ended a ten-year siege.","Unfair. It used a fake gift to fool people, and the city was destroyed."]},{"group":2,"year":-725,"approx":true,"kind":"monster","title":"Odysseus and the Cyclops","story":"On the way home, Odysseus and his crew were trapped in the cave of Polyphemus, a one-eyed giant. Odysseus told him his name was “Nobody,” then blinded him while he slept. When the giant yelled that Nobody was hurting him, his neighbors stayed away. The men escaped clinging under his sheep.","whoa":"Polyphemus was a son of Poseidon, which is why the sea god made Odysseus’s journey so hard.","question":"What name did Odysseus give the Cyclops?","answer":"Nobody","wrong":["Hercules","Zeus","Someone"],"source":"Homer’s Odyssey","more":"Odysseus escaped, then shouted his real name to brag. Polyphemus prayed to his father Poseidon, who made Odysseus wander for ten years. Being clever saved him; being boastful cost him dearly.","think":"Why couldn’t Odysseus resist telling the Cyclops his real name?","sides":["Pride. He wanted credit for his trick.","Honor. In his world, a hero wanted his name to be known."]},{"group":2,"year":-725,"approx":true,"kind":"quest","title":"The bag of winds","story":"Aeolus, keeper of the winds, gave Odysseus a leather bag holding every stormy wind, leaving only a gentle breeze to blow him home. They got so close they could see home. Then the crew opened the bag, thinking it held treasure, and the storm blew them all the way back.","whoa":"They had sailed for nine days and nights to get that close.","question":"What did the crew think was in the bag?","answer":"Treasure","wrong":["Food","Wine","Weapons"],"source":"Homer’s Odyssey","more":"The crew opened the bag because they were jealous, thinking Odysseus was hiding gold from them. When they returned, Aeolus refused to help again, believing the gods were against them. The story shows how mistrust can wreck a team.","think":"Should Odysseus have told his crew what was in the bag?","sides":["Yes. Trusting them would have stopped the jealousy.","Maybe not. They might have opened it anyway out of curiosity."]},{"group":2,"year":-725,"approx":true,"kind":"god","title":"Circe the enchantress","story":"On the island of Aeaea, the enchantress Circe served Odysseus’s men a magic meal and turned them into pigs. The god Hermes gave Odysseus a herb called moly to protect him from her spells. Circe could not enchant him, so she turned his crew back into men.","whoa":"Odysseus and his crew ended up staying with Circe for a whole year.","question":"What did Circe turn the men into?","answer":"Pigs","wrong":["Frogs","Stone","Birds"],"source":"Homer’s Odyssey","more":"Circe was a daughter of the sun god Helios. After Odysseus won her respect, she helped him, telling him how to visit the underworld and survive the Sirens. Modern novels, like Madeline Miller’s Circe, retell her as a complex heroine.","think":"Is Circe a villain, or someone defending herself?","sides":["A villain. She enchanted visitors for no reason.","Defending herself. She lived alone, and strangers could be dangerous."]},{"group":2,"year":-725,"approx":true,"kind":"monster","title":"The Sirens","story":"The Sirens sang so sweetly that sailors steered toward them and wrecked on the rocks. Odysseus wanted to hear them safely. His crew plugged their ears with beeswax, and he had himself tied to the mast and ordered them not to untie him, no matter what he said.","whoa":"The emergency sirens on fire trucks are named after them.","question":"What did the crew put in their ears?","answer":"Beeswax","wrong":["Cotton","Sand","Seaweed"],"source":"Homer’s Odyssey","more":"Homer says the Sirens promised to tell Odysseus everything that happened at Troy and all knowledge on Earth. Their power was offering what he most wanted. Later art showed them as bird-women; much later, as mermaids.","think":"What are the “Sirens” in modern life?","sides":["Phones and games, which pull our attention away from what we planned to do.","Easy shortcuts that seem great but lead to trouble."]},{"group":2,"year":-725,"approx":true,"kind":"monster","title":"Scylla and Charybdis","story":"Odysseus had to sail through a narrow strait. On one side lived Scylla, a monster with six heads. On the other was Charybdis, a giant whirlpool that swallowed whole ships. He steered closer to Scylla and lost six men, rather than risk losing the whole ship.","whoa":"“Between Scylla and Charybdis” means stuck between two bad choices, like “between a rock and a hard place.”","question":"What was Charybdis?","answer":"A giant whirlpool","wrong":["A dragon","A storm cloud","A sea serpent"],"source":"Homer’s Odyssey","more":"Circe told Odysseus to choose Scylla, because losing six men was better than losing everyone. Some think the story describes a real strait, between Italy and Sicily, with dangerous rocks and currents.","think":"Was Odysseus right to sacrifice six men to save the rest?","sides":["Yes. It was the choice that saved the most lives.","It is terrible to choose who dies, and he did not even warn them."]},{"group":2,"year":-725,"approx":true,"kind":"lesson","title":"Penelope’s weaving","story":"Back home in Ithaca, Odysseus’s wife Penelope waited 20 years. Rude suitors moved into the palace, demanding she marry one of them. She said she would choose once she finished weaving a burial cloth. Every night she secretly unwove the day’s work, and kept them waiting for three years.","whoa":"Her son Telemachus went searching for news of his father while she held off the suitors.","question":"What did Penelope do each night?","answer":"Unwove her weaving","wrong":["Sailed to find Odysseus","Hid the palace gold","Wrote letters"],"source":"Homer’s Odyssey","more":"Penelope is as clever as Odysseus. She tests him when he returns, asking a servant to move their bed, which he built around a living olive tree and cannot be moved. Only the real Odysseus would know. Some see her as the true hero of the Odyssey.","think":"Was Penelope’s trick honest?","sides":["It was fair. The suitors were bullies invading her home.","It was a lie, even if it was for a good reason."]},{"group":2,"year":-725,"approx":true,"kind":"hero","title":"Odysseus comes home","story":"Odysseus finally reached Ithaca, disguised as an old beggar. His old dog Argos recognized him at once and wagged his tail. Penelope set a challenge: whoever could string Odysseus’s great bow and shoot through twelve axe heads could marry her. Only the beggar could do it.","whoa":"Argos had waited 20 years to see his master again.","question":"Who recognized the disguised Odysseus first?","answer":"His dog Argos","wrong":["Penelope","The suitors","Zeus"],"source":"Homer’s Odyssey","more":"After winning the contest, Odysseus and Telemachus fought and killed all the suitors. Many readers find the violence troubling. The goddess Athena finally steps in to make peace between Odysseus and the suitors’ families.","think":"Was Odysseus’s revenge on the suitors fair?","sides":["Yes. They had invaded his home for years and plotted to kill his son.","No. Killing them all went far beyond what was needed."]},{"group":3,"year":-200,"approx":true,"kind":"lesson","title":"Ganesha writes it down","story":"The sage Vyasa wanted someone to write down the Mahabharata as he spoke it. The elephant-headed god Ganesha agreed, but only if Vyasa never paused. Vyasa added his own rule: Ganesha must understand every verse before writing it. Whenever Vyasa needed a rest, he recited a very tricky verse.","whoa":"When Ganesha’s pen broke, he snapped off one of his own tusks and kept writing with it.","question":"What did Ganesha use as a pen when his broke?","answer":"His own tusk","wrong":["A feather","A stick","His trunk"],"source":"The Mahabharata","more":"Vyasa is said to be not only the author but also a character in the Mahabharata, a grandfather of both families. Ganesha is the god of beginnings and remover of obstacles, so many Hindus pray to him before starting something new.","think":"Why might a story include its own author as a character?","sides":["It shows the author witnessed the events, so the story feels true.","It reminds readers that every story has a teller with a point of view."]},{"group":3,"year":-200,"approx":true,"kind":"hero","title":"Two families of cousins","story":"The Mahabharata tells of two royal families who were cousins. The five Pandava brothers, Yudhishthira, Bhima, Arjuna, Nakula and Sahadeva, were good and brave. Their hundred cousins, the Kauravas, were led by jealous Duryodhana, who wanted the whole kingdom.","whoa":"The Mahabharata is about ten times as long as the Iliad and Odyssey put together.","question":"How many Pandava brothers were there?","answer":"Five","wrong":["Two","Twelve","A hundred"],"source":"The Mahabharata","more":"The Pandavas were raised in the palace after their father, King Pandu, died. Duryodhana grew jealous of their talents and tried to kill them, once by building a house of wax and setting it on fire. They escaped through a tunnel.","think":"Why does jealousy between family members cause such big trouble in so many stories?","sides":["Family is close, so small differences in fairness hurt more.","Families share power and property, so there is more to fight over."]},{"group":3,"year":-200,"approx":true,"kind":"hero","title":"Arjuna wins Draupadi","story":"Princess Draupadi’s father held a contest. A wooden fish spun high on a pole, and archers had to hit its eye while looking only at its reflection in a pool of water below. Prince after prince failed. Arjuna, disguised as a poor priest, hit it on his first try.","whoa":"Arjuna was the greatest archer of his age. His bow was called Gandiva.","question":"Where did Arjuna look to aim?","answer":"At the reflection in the water","wrong":["Straight up at the fish","At the sun","With his eyes closed"],"source":"The Mahabharata","more":"Arjuna’s mother, not seeing what he had won, told him to share it with his brothers, so Draupadi married all five Pandavas. She became one of the strongest characters in the epic. In some versions, she refused to let the warrior Karna compete because of his low status.","think":"What makes Draupadi one of the strongest characters in the story?","sides":["She speaks up bravely when she is wronged, even before kings.","She holds the family together through exile and war."]},{"group":3,"year":-200,"approx":true,"kind":"lesson","title":"The game of dice","story":"Duryodhana invited the eldest Pandava, Yudhishthira, to a game of dice. The dice were thrown by tricky uncle Shakuni, who always seemed to win. Yudhishthira kept betting and lost his kingdom, his brothers and even himself. The Pandavas were sent into exile for 13 years.","whoa":"They spent 12 years in the forest and the last year in disguise, as servants in a king’s palace.","question":"How long were the Pandavas exiled?","answer":"13 years","wrong":["1 year","3 months","50 years"],"source":"The Mahabharata","more":"After losing everything, Yudhishthira even bet Draupadi. Duryodhana’s brother tried to drag her and pull off her sari, but Krishna made the cloth endless. She asked the court whether a man who had lost himself could still bet her, a question no one c
