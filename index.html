<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Time Tunnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Built by build.py from stories.json. Edit the stories there, not here.
   Layout: one-screen app. Header, History / Myths line switch, a single active view (time machine subway line / vertical story feed / quiz + passport), tab bar. Night-museum palette, one color per volume or book. */
:root{
  color-scheme: dark;
  --night:#10142e; --deep:#181e44; --raise:#242b5c; --rim:rgba(196,202,255,.12);
  --text:#f2efe7; --soft:#b2b5d8; --faint:#7c80aa;
  --v1:#f2b544; --v2:#ef5d71; --v3:#36c4a9; --v4:#71b4ff; --v5:#b892ff;
  --m1:#8fb8ff; --m2:#ff936e; --m3:#ffc94d; --m4:#ff7096; --m5:#4fd6b4;
  --tint:#71b4ff; --good:#5fd88e; --bad:#ff8a6e; --gold:#ffd86b;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 4px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.28);
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--night);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity .6s;
  background:
   radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.5),transparent 60%),
   radial-gradient(1px 1px at 72% 9%,rgba(255,255,255,.45),transparent 60%),
   radial-gradient(1.5px 1.5px at 88% 42%,rgba(255,255,255,.35),transparent 60%),
   radial-gradient(1px 1px at 30% 64%,rgba(255,255,255,.3),transparent 60%),
   radial-gradient(1px 1px at 56% 85%,rgba(255,255,255,.3),transparent 60%),
   radial-gradient(90% 60% at 50% -10%,color-mix(in srgb,var(--tint) 12%,transparent),transparent 70%);}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,.track:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty;margin:0}
.press{transition-property:transform,background-color,box-shadow,color;transition-duration:.18s;transition-timing-function:var(--ease)}
.press:active{transform:scale(.96)}

.app{position:relative;z-index:1;height:100%;max-width:880px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.app>*{min-width:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.logo{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.mark{width:8px;height:8px;border-radius:50%;background:var(--v1);margin:0 6px;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--v2),0 0 0 7px var(--night),0 0 0 9px var(--v3),0 0 0 11px var(--night),0 0 0 13px var(--v4)}
.pass{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--deep);box-shadow:0 0 0 1px var(--rim) inset;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap}
.pass b{color:var(--text);font-weight:500}
.pass svg{color:var(--gold)}
.pass.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.12)}}
@media (max-width:380px){.pass .w{display:none}}

/* line switch */
.lines{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:0 16px 6px;padding:4px;border-radius:16px;background:var(--deep);box-shadow:0 0 0 1px var(--rim) inset}
.lines button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border-radius:12px;font-weight:700;font-size:14px;color:var(--soft)}
.lines button svg{width:18px;height:18px;flex:0 0 auto}
.lines button small{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--faint)}
.lines button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:var(--shadow)}
.lines button[aria-pressed="true"] svg{color:var(--gold)}
@media (max-width:360px){.lines button small{display:none}}

main{position:relative;min-height:0}
.view{height:100%;overflow-y:auto;padding-inline:16px;padding-block:4px 28px;overscroll-behavior:contain}
.view:focus,.feed:focus{outline:none}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 10px;background:linear-gradient(to top,var(--night) 70%,transparent)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border-radius:16px;color:var(--faint);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--raise);color:var(--text);box-shadow:var(--shadow)}

/* ---------- time machine ---------- */
#machine{--c:var(--v1)}
.dash{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.kicker{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--soft)}
.kicker i{font-style:normal;color:var(--c);transition:color .5s}
.odo{display:flex;align-items:flex-end;gap:12px;min-height:1em}
.about{font-family:var(--f-mono);font-size:13px;color:var(--soft);margin-bottom:.9em;width:3.2em}
.digits{display:flex;font-family:var(--f-display);font-weight:800;font-size:clamp(56px,16vw,112px);line-height:1;height:1em;overflow:hidden;color:var(--c);letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .5s}
.dg{width:.6em;height:1em;overflow:hidden;transition:width .45s var(--ease)}
.dg.off{width:0}
.strip{display:flex;flex-direction:column;transition:transform .8s var(--ease)}
.strip span{display:block;height:1em;text-align:center}
.era{font-family:var(--f-mono);font-size:15px;padding:6px 10px;border-radius:10px;background:var(--c);color:var(--night);margin-bottom:.55em;transition:background-color .5s}
.odo-sub{font-size:15px;color:var(--soft)}
.odo-sub small{font-family:var(--f-mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}

.chips{display:flex;gap:8px;margin:12px -16px 0;padding:2px 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px 6px 10px;border-radius:999px;background:var(--deep);box-shadow:0 0 0 1px var(--rim) inset;font-size:14px;font-weight:700}
.chip .d{width:12px;height:12px;border-radius:50%;background:var(--cc)}
.chip small{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--faint)}
.chip.on{box-shadow:0 0 0 2px var(--cc) inset;background:var(--raise)}
.chip.warp{background:var(--text);color:var(--night);box-shadow:none}

/* hand-painted diorama: scroll drives the scene, a 12 fps "boil" keeps the linework alive */
.dio{position:relative;height:172px;margin:10px -16px 0;pointer-events:none}
.dio canvas{display:block;width:100%;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);
          mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.track-wrap{position:relative;margin:0 -16px 0}
.track-wrap::before,.track-wrap::after{content:"";position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
.track-wrap::before{left:0;background:linear-gradient(90deg,var(--night),transparent)}
.track-wrap::after{right:0;background:linear-gradient(-90deg,var(--night),transparent)}
.car{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;color:var(--text)}
.car span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--text);color:var(--night);padding:2px 8px;border-radius:6px}
.car::after{content:"";width:0;height:0;border:6px solid transparent;border-top-color:var(--text)}
.track{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:30px 8px;scrollbar-width:none;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.dragging{scroll-snap-type:none;cursor:grabbing}
.spacer{flex:0 0 calc(50% - 48px)}
.st{flex:0 0 96px;scroll-snap-align:center;display:grid;grid-template-rows:26px 42px 40px;justify-items:center;align-items:start;position:relative}
.st::before,.gap::before{content:"";position:absolute;left:0;right:0;top:44px;height:6px;background:var(--c)}
.st .yr{font-family:var(--f-mono);font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .3s}
.st .dot{position:relative;z-index:1;align-self:center;width:22px;height:22px;border-radius:50%;background:var(--night);box-shadow:0 0 0 4px var(--c) inset;transition-property:transform,background-color,box-shadow;transition-duration:.3s;transition-timing-function:var(--ease)}
.st.seen .dot{background:color-mix(in srgb,var(--c) 40%,var(--night))}
.st .nm{width:92px;font-size:12px;line-height:1.25;text-align:center;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:color .3s}
.st.on .dot{transform:scale(1.3);background:var(--c);box-shadow:0 0 0 4px var(--c) inset,0 0 0 3px var(--night),0 0 0 6px color-mix(in srgb,var(--c) 45%,transparent)}
.st.on .nm,.st.on .yr{color:var(--text)}
.gap{flex:0 0 58px;position:relative}
.gap.book{flex-basis:84px}
.gap::before{background:linear-gradient(90deg,var(--a),var(--b))}
.gap span{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;color:var(--faint);white-space:nowrap}

.scale-box{margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--deep);box-shadow:0 0 0 1px var(--rim) inset}
.scale-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--soft)}
.scale-head b{font-family:var(--f-mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text)}
.scale{position:relative;display:flex;height:14px;margin:12px 0 6px;border-radius:7px;overflow:visible}
.scale i{display:block;height:100%}
.scale i:first-child{border-radius:7px 0 0 7px}.scale i:last-of-type{border-radius:0 7px 7px 0}.scale i:only-of-type{border-radius:7px}
.tick{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;border-radius:1px;opacity:.9}
.pin{position:absolute;top:-6px;width:4px;height:26px;margin-left:-2px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--night);transition:left .7s var(--ease)}
.scale-ends{position:relative;height:16px;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.scale-ends span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.scale-ends span:first-child{transform:none}
.scale-ends span:last-child{transform:translateX(-100%)}

.panel{margin-top:16px;padding:20px;border-radius:24px;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%),var(--deep);box-shadow:var(--shadow),0 0 0 1px var(--rim) inset;display:flex;flex-direction:column;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:8px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tag.k{background:rgba(255,255,255,.06);color:var(--soft)}
.tag svg{width:14px;height:14px;flex:0 0 auto}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,34px);line-height:1.05;letter-spacing:-.015em}
.story{font-size:17px;line-height:1.6;max-width:62ch}
.whoa{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 13%,transparent);font-size:15px;max-width:62ch}
.whoa b{font-family:var(--f-display);color:var(--c);margin-right:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--raise);box-shadow:0 0 0 1px var(--rim) inset}
.btn.go{background:var(--c,var(--text));color:var(--night);box-shadow:none}
.btn.round{width:44px;padding:0}
.btn svg{width:18px;height:18px}
.swap>*{animation:rise .45s var(--ease) both}
.swap>*:nth-child(2){animation-delay:.05s}.swap>*:nth-child(3){animation-delay:.1s}.swap>*:nth-child(4){animation-delay:.15s}.swap>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ---------- feed ---------- */
.feedview{padding:0;overflow:hidden;position:relative}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feedbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:10px;align-items:center;padding:4px 4px 4px 14px;border-radius:999px;background:rgba(16,20,46,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-family:var(--f-mono);font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 0 0 1px var(--rim) inset}
.feedbar b{color:var(--text);font-weight:500}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.07)}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;font-family:var(--f-mono);font-size:12px;color:var(--soft);transition-property:background-color,color,transform;transition-duration:.2s;transition-timing-function:var(--ease)}
.seg button svg{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--night)}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;padding:64px 20px 22px;
  background:radial-gradient(110% 65% at 100% 0%,color-mix(in srgb,var(--c) 34%,transparent),transparent 62%),linear-gradient(180deg,var(--night),color-mix(in srgb,var(--c) 9%,var(--night)))}
.wm{position:absolute;top:7%;right:-.06em;font-family:var(--f-display);font-weight:800;font-size:clamp(120px,32vh,300px);line-height:.8;letter-spacing:-.05em;color:color-mix(in srgb,var(--c) 22%,transparent);transform:rotate(-7deg);pointer-events:none;user-select:none;white-space:nowrap}
.wm.word{font-size:clamp(84px,20vh,190px);letter-spacing:-.02em;top:9%}
.wm small{display:block;font-size:.3em;letter-spacing:0;text-align:right;margin-right:.3em}
.card-in>.tag{align-self:flex-start}
.card-in{position:relative;width:100%;max-width:620px;margin:auto auto 0;display:flex;flex-direction:column;gap:12px}
.cyear{font-family:var(--f-mono);font-size:15px;color:var(--c)}
.card h2{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1;letter-spacing:-.02em}
.card .story{font-size:clamp(16px,2.3vh,18px)}
.live .card-in>*{animation:rise .5s var(--ease) both}
.live .card-in>*:nth-child(2){animation-delay:.06s}.live .card-in>*:nth-child(3){animation-delay:.12s}.live .card-in>*:nth-child(4){animation-delay:.18s}.live .card-in>*:nth-child(5){animation-delay:.24s}.live .card-in>*:nth-child(6){animation-delay:.3s}
.card.first{padding-bottom:64px}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);transition:opacity .3s}
.hint svg{display:block;margin:0 auto;animation:nudge 1.4s var(--ease) infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
.card.alt .card-in{margin:auto}
.card.alt{--c:var(--gold);background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.025) 22px 44px),radial-gradient(90% 60% at 50% 30%,rgba(255,216,107,.14),transparent 70%),var(--night);align-items:center}
.alt .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6.5vw,38px);line-height:1.1;letter-spacing:-.015em}
.pick{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 14px;border-radius:16px;background:var(--deep);box-shadow:0 0 0 1px var(--rim) inset;text-align:left;font-size:16px;font-weight:700}
.opt .lt{flex:0 0 30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:rgba(255,255,255,.07);color:var(--soft)}
.opt .yy{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--soft);white-space:nowrap}
.opt.right{box-shadow:0 0 0 2px var(--good) inset;background:color-mix(in srgb,var(--good) 14%,var(--deep))}
.opt.right .lt{background:var(--good);color:var(--night)}
.opt.wrong{box-shadow:0 0 0 2px var(--bad) inset;background:color-mix(in srgb,var(--bad) 12%,var(--deep))}
.opt.wrong .lt{background:var(--bad);color:var(--night)}
.opt:disabled{cursor:default}
.result{font-size:15px;color:var(--soft);min-height:1.5em}
.result b{color:var(--text)}

/* ---------- quiz ---------- */
.qhome{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.passport{padding:18px;border-radius:24px;background:linear-gradient(160deg,#1c2350,#141938);box-shadow:var(--shadow),0 0 0 1px var(--rim) inset}
.passport h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.015em}
.passport p{color:var(--soft);font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04)}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:6px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.stamp.seen{background:var(--c)}
.stamp.mast{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--v3)}
.legend i.e{background:color-mix(in srgb,var(--v3) 16%,transparent)}
.legend i.m{box-shadow:0 0 0 2px var(--night),0 0 0 3.5px var(--gold)}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;background:var(--deep);box-shadow:0 0 0 1px var(--rim) inset;text-align:left}
.mode .ic{flex:0 0 46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--mc);color:var(--night)}
.mode .ic svg{width:24px;height:24px}
.mode h3{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.mode p{font-size:14px;color:var(--soft)}
.mode .arr{margin-left:auto;color:var(--faint)}
.vols{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.vbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--cc) 14%,var(--deep));box-shadow:0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent) inset;text-align:left}
.vbtn:last-child:nth-child(odd){grid-column:1/-1}

.qscreen{display:flex;flex-direction:column;gap:16px;padding-top:6px;max-width:640px;margin:0 auto}

.bar{height:8px;border-radius:4px;background:var(--deep);overflow:hidden}

.qq{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6.5vw,36px);line-height:1.1;letter-spacing:-.015em}
.explain{padding:16px;border-radius:18px;background:var(--deep);box-shadow:0 0 0 1px var(--rim) inset;display:flex;flex-direction:column;gap:10px;animation:rise .35s var(--ease) both}
.explain h3{font-family:var(--f-display);font-weight:800;font-size:22px}
.explain h3.ok{color:var(--good)}.explain h3.no{color:var(--bad)}

.streak{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.endcard{text-align:left;padding:24px 20px;border-radius:24px;background:radial-gradient(100% 80% at 100% 0%,rgba(255,216,107,.16),transparent 60%),var(--deep);box-shadow:var(--shadow),0 0 0 1px var(--rim) inset;display:flex;flex-direction:column;gap:10px}
.endcard .score{font-family:var(--f-display);font-weight:800;font-size:88px;line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.endcard .score small{font-size:.4em;color:var(--soft)}

/* deeper content */
.deep{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.deep-h{font-family:var(--f-mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--soft)}
.deep>p{font-size:16px;line-height:1.6;color:var(--text)}
.think{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:0 0 0 1px var(--rim) inset}
.think-k{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.think-k svg{width:14px;height:14px}
.think-q{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.25}
.sides{display:grid;gap:8px}
.side{padding:10px 12px;border-radius:12px;background:var(--deep);box-shadow:0 0 0 1px var(--rim) inset;font-size:15px;line-height:1.5;text-align:left;width:100%}
.side b{display:block;font-family:var(--f-mono);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);margin-bottom:2px}
.side.pick-a b{color:var(--v1)}.side.pick-b b{color:var(--v4)}
button.side.chosen{box-shadow:0 0 0 2px var(--gold) inset;background:color-mix(in srgb,var(--gold) 10%,var(--deep))}
.your{font-size:14px;color:var(--soft)}
.card .sides .side{font-size:14px;padding:9px 11px}
@media (min-width:640px){.sides{grid-template-columns:1fr 1fr}}

.sheet{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(8,10,26,.6);opacity:0;transition:opacity .25s var(--ease)}
.sheet.open{opacity:1}
.sheet-in{position:relative;max-height:86%;overflow-y:auto;overscroll-behavior:contain;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:radial-gradient(120% 60% at 100% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%),var(--deep);box-shadow:var(--shadow),0 0 0 1px var(--rim) inset;display:flex;flex-direction:column;gap:12px;transform:translateY(24px);transition:transform .3s var(--ease)}
.sheet-in:focus{outline:none}
.sheet.open .sheet-in{transform:none}
.sheet-in h2{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.05;letter-spacing:-.015em;padding-right:48px}
.sheet-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--raise)}
.sheet-x svg{width:18px;height:18px}

.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,8px);z-index:9;padding:10px 16px;border-radius:14px;background:var(--text);color:var(--night);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition-property:opacity,transform;transition-duration:.25s;transition-timing-function:var(--ease);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  .pick.two{grid-template-columns:1fr 1fr}

}
@media (prefers-reduced-motion:reduce){

<script>
/* ---------- data (injected by build.py from stories.json) ---------- */
const DATA = {"lines":{"history":{"name":"History","word":"Volume","short":"Vol","icon":"build","order":"time","start":-8000,"tint":"#71b4ff","passport":"time passport","scaleTitle":"All 10,000 years, drawn to size","groups":[{"id":1,"name":"Ancient Times","short":"Ancient","color":"#f2b544","from":-8000,"to":476},{"id":2,"name":"The Middle Ages","short":"Middle Ages","color":"#ef5d71","from":476,"to":1550},{"id":3,"name":"Early Modern Times","short":"Early Modern","color":"#36c4a9","from":1550,"to":1837},{"id":4,"name":"The Modern Age","short":"Modern","color":"#71b4ff","from":1837,"to":2000},{"id":5,"name":"The 21st Century","short":"21st Century","color":"#b892ff","from":2000,"to":2026}],"facts":[{"headline":"Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid.","detail":"About 2,500 years separate the pyramid and Cleopatra. About 2,000 separate Cleopatra and Apollo 11."},{"headline":"Woolly mammoths were still alive on a remote Arctic island when the Great Pyramid was built.","detail":"The last ones lived on Wrangel Island until about 2000 BC."},{"headline":"When the Colosseum in Rome opened, the Great Pyramid was already about 2,600 years old.","detail":"Ancient Romans visited Egypt as tourists and scratched graffiti on old monuments."},{"headline":"Oxford University was already teaching students before the Aztecs built Tenochtitlan.","detail":"Teaching at Oxford began around 1096. Tenochtitlan was founded in 1325."},{"headline":"A kind of fax machine was invented before the telephone.","detail":"Alexander Bain patented a picture-sending machine in 1843. Bell's telephone came in 1876."},{"headline":"The eastern Roman Empire was still around when Gutenberg printed his first books.","detail":"It lasted until 1453, the same years Gutenberg was printing in Germany."},{"headline":"Insulin was first given to a patient in Toronto in 1922, the same year King Tut’s tomb was found.","detail":"Leonard Thompson got his first injection in January. Howard Carter found the tomb’s steps in November."},{"headline":"The Wright brothers’ first flight was shorter than the wings of a jumbo jet.","detail":"That flight went about 37 meters. A Boeing 747’s wings span about 64 meters."},{"headline":"The Ottoman Empire lasted long enough to fight in World War I.","detail":"It began around 1299, just after Marco Polo came home from China, and ended in 1922."},{"headline":"Volume 1 covers more years than the other four volumes put together. Many times more.","detail":"Ancient Times stretches about 8,500 years. Volumes 2 to 5 cover about 1,550."}],"stories":[{"group":1,"year":-8000,"approx":true,"kind":"life","title":"Farmers in the Fertile Crescent","story":"Long ago, people wandered from place to place, following animals and gathering wild plants. Then, near the Tigris and Euphrates rivers, some families planted seeds and stayed put. Those first farms grew into the first villages.","whoa":"The land between those two rivers was called Mesopotamia, which means \"between the rivers.\"","question":"What does \"Mesopotamia\" mean?","answer":"Between the rivers","wrong":["Land of kings","Hot desert","Big mountain"],"more":"Farming let people store extra food, so not everyone had to hunt or gather. Some people could become potters, builders, priests or soldiers instead. But early farmers often worked harder, ate a less varied diet and caught more diseases from living close to animals and each other.","think":"Was farming a good deal for the first farmers?","sides":["Yes. Farming fed far more people and made towns, writing and inventions possible.","Not at first. Hunter-gatherers often had more free time and healthier bodies than early farmers."]},{"group":1,"year":-3200,"approx":true,"kind":"invent","title":"Sumerians invent writing","story":"The Sumerians pressed wedge-shaped marks into wet clay with a reed. This writing is called cuneiform. At first they used it to count sheep and grain.","whoa":"Kids in Sumer practiced writing on clay tablets, and some of their homework still survives.","question":"What did the Sumerians write on?","answer":"Wet clay","wrong":["Paper","Silk","Leaves"],"more":"Cuneiform began as little pictures for things like grain and sheep. Over hundreds of years the pictures turned into wedge marks that could stand for sounds, so people could write names, laws, letters and stories. Scribes trained for years, and only a small number of people could read.","think":"Was writing the most important invention in history?","sides":["Yes. Without writing we could not keep laws, science or history beyond what people remember.","Maybe not. Farming, fire or the wheel changed daily life more, and for centuries most people never read at all."]},{"group":1,"year":-3100,"approx":true,"kind":"ruler","title":"Egypt becomes one kingdom","story":"Egypt used to be two kingdoms, Upper Egypt and Lower Egypt. A king named Narmer (some call him Menes) joined them together. Pharaohs wore a double crown to show they ruled both.","whoa":"Upper Egypt is in the south, because the Nile flows north.","question":"Which king united Upper and Lower Egypt?","answer":"Narmer","wrong":["Tutankhamun","Cyrus","Hammurabi"],"more":"The Nile flooded every year and left rich black mud behind, which made Egypt one of the best farming lands in the world. A single ruler could organize workers, store grain for bad years and defend the river. Egypt stayed one kingdom, on and off, for nearly 3,000 years.","think":"Why might a river help a country stay united?","sides":["A river joins people. Boats carry food, soldiers and news up and down it quickly.","A river can also divide people, if each region wants to control its own stretch of water."]},{"group":1,"year":-2560,"approx":true,"kind":"build","title":"The Great Pyramid","story":"Pharaoh Khufu had a giant pyramid built as his tomb at Giza. Workers moved more than two million stone blocks. It took about twenty years.","whoa":"For almost 4,000 years it was the tallest thing people had ever built.","question":"Who was the Great Pyramid built for?","answer":"Pharaoh Khufu","wrong":["Julius Caesar","Hammurabi","Cleopatra"],"more":"Old stories said slaves built the pyramids, but archaeologists found the workers’ village nearby. Many were paid laborers and farmers who worked during the flood season, ate bread, beer and meat, and were buried with honor near the pyramid. It still took enormous organization to feed and house them.","think":"Was building a giant tomb a good use of a whole country’s work?","sides":["Yes. It showed Egypt’s power, gave people work and created something that still amazes the world.","No. All that labor could have gone to canals, food stores or things that helped ordinary people."]},{"group":1,"year":-2500,"approx":true,"kind":"build","title":"Cities of the Indus Valley","story":"In what is now Pakistan and India, people built cities like Mohenjo-daro with straight streets. Many homes had drains and even bathrooms. Nobody has figured out how to read their writing yet.","whoa":"Their bricks were made in the same shape everywhere, like a giant building set.","question":"What did many Indus Valley homes have?","answer":"Drains and bathrooms","wrong":["Glass windows","Electric lights","Elevators"],"more":"Indus cities like Harappa and Mohenjo-daro had no obvious palaces or giant statues of kings. Some historians think power may have been shared more than in Egypt or Mesopotamia. Around 1900 BC the cities slowly emptied, possibly because rivers shifted and the climate dried.","think":"What can we learn about a people if we cannot read their writing?","sides":["A lot. Their streets, drains, tools and trade goods tell us how they lived.","Not enough. Without their words we can only guess what they believed or felt."]},{"group":1,"year":-2334,"approx":true,"kind":"ruler","title":"Sargon builds the first empire","story":"Sargon of Akkad conquered city after city in Mesopotamia and ruled them all together. That made him the first emperor we know of. A legend says he was found as a baby floating in a basket on a river.","whoa":"An empire is when one ruler controls many different lands and peoples.","question":"Who built the first empire in Mesopotamia?","answer":"Sargon of Akkad","wrong":["Alexander the Great","Narmer","Charlemagne"],"more":"Sargon put his own loyal officials in charge of conquered cities and made his daughter, Enheduanna, a high priestess. She wrote hymns and is the first author in history known by name. His empire lasted about 150 years before it fell apart.","think":"Is it ever fair to rule people who did not choose you?","sides":["Sometimes. An empire can end wars between small cities and protect trade.","No. People should decide who governs them, and conquest takes that away."]},{"group":1,"year":-1900,"approx":true,"kind":"build","title":"The Minoans of Crete","story":"On the island of Crete, the Minoans built a huge palace at Knossos with painted walls. Their paintings show young people leaping over bulls. Later Greeks told a myth about a monster called the Minotaur living in a maze there.","whoa":"The palace had so many rooms that it may have inspired the story of the labyrinth.","question":"In the Greek myth, what monster lived in the labyrinth?","answer":"The Minotaur","wrong":["A dragon","Medusa","A cyclops"],"more":"The Minoans traded across the sea with Egypt and other lands. Their palaces had no big defensive walls, which surprised archaeologists. Their civilization weakened after a huge volcanic eruption on nearby Thera, and later people from mainland Greece took over Knossos.","think":"Why would a kingdom not build walls around its palaces?","sides":["Because the sea protected them, and a strong navy kept enemies away.","Because they were peaceful and rarely fought. But we cannot be sure from ruins alone."]},{"group":1,"year":-1754,"approx":false,"kind":"idea","title":"Hammurabi's laws","story":"King Hammurabi of Babylon had 282 laws carved on a tall black stone so everyone could see the rules. Some punishments were harsh, like \"an eye for an eye.\" It is one of the oldest written sets of laws.","whoa":"That stone is now in the Louvre museum in Paris.","question":"How many laws were in Hammurabi's code?","answer":"282","wrong":["10","1,000","12"],"more":"Hammurabi’s laws covered everyday things like rent, wages, doctors’ fees and broken contracts. Punishments depended on who you were: hurting a noble cost more than hurting a commoner or an enslaved person. Still, writing laws down meant judges could not simply make them up.","think":"Is “an eye for an eye” a fair way to punish people?","sides":["Yes. The punishment matches the harm, and it stops people taking bigger revenge.","No. It can make two people suffer instead of one, and it ignores mistakes and mercy."]},{"group":1,"year":-1323,"approx":false,"kind":"ruler","title":"Tutankhamun, the boy king","story":"Tutankhamun became pharaoh when he was about nine years old. He died young, around nineteen. His tomb was hidden so well that robbers missed it.","whoa":"His golden mask weighs about 10 kilograms, as much as a big bag of potatoes.","question":"About how old was Tutankhamun when he became pharaoh?","answer":"About 9","wrong":["About 30","About 50","About 2"],"more":"Tutankhamun was not an important pharaoh while he lived. His father Akhenaten had tried to make Egyptians worship one sun god, and Tut’s advisers helped bring back the old gods. He is famous today only because his tomb survived almost untouched.","think":"Should archaeologists dig up royal tombs and put the treasures in museums?","sides":["Yes. We learn about the past, and millions of people get to see these treasures.","No. These are graves, and the dead and their descendants deserve respect."]},{"group":1,"year":-1250,"approx":true,"kind":"idea","title":"Oracle bones in China","story":"Kings of the Shang dynasty asked questions about the future by heating turtle shells and animal bones until they cracked. Priests read the cracks and carved the answers onto the bones. These carvings are the oldest Chinese writing we know.","whoa":"Some modern Chinese characters still look a lot like the ones on oracle bones.","question":"What did Shang kings use to ask about the future?","answer":"Cracked bones and shells","wrong":["Tea leaves","Crystal balls","Star charts"],"more":"Shang kings asked about the weather, harvests, battles, illness and even toothaches. Thousands of oracle bones were found around 1899, when Chinese scholars noticed odd writing on “dragon bones” being sold as medicine. They helped prove that the Shang dynasty was real.","think":"Why do people want to know the future, and does knowing help?","sides":["It helps. Even a guess about the future lets you prepare for trouble.","It can hurt. People may make bad choices because they trust a prediction too much."]},{"group":1,"year":-1200,"approx":true,"kind":"build","title":"The Olmec heads","story":"In Mexico, the Olmec people carved enormous stone heads. Some are taller than a grown-up and weigh as much as a truck. They probably show Olmec rulers wearing helmets.","whoa":"The Olmecs had no metal tools or wheels for moving the stones.","question":"What did the Olmecs carve out of stone?","answer":"Giant heads","wrong":["Tiny boats","Chariots","Pyramids of ice"],"more":"The Olmecs are sometimes called the “mother culture” of Mexico. They had a ball game, a calendar and early writing, which later peoples like the Maya built on. They moved stones weighing up to 20 tonnes from mountains about 80 kilometers away, probably on rafts and rollers.","think":"Why do you think rulers wanted giant statues of themselves?","sides":["To show power, so people and enemies would respect them.","To be remembered, so their names would last long after they died."]},{"group":1,"year":-1050,"approx":true,"kind":"invent","title":"The Phoenician alphabet","story":"Phoenician traders sailed all over the Mediterranean Sea. They used a simple alphabet with 22 letters, one for each sound. The Greeks borrowed it, then the Romans, and you are reading its great-grandchild right now.","whoa":"The Phoenicians also sold a famous purple dye made from sea snails.","question":"How many letters did the Phoenician alphabet have?","answer":"22","wrong":["26","100","5"],"more":"Older writing like cuneiform and hieroglyphs needed hundreds of signs. The Phoenician alphabet needed only 22, so many more people could learn it. It had no vowels, though. The Greeks added letters for vowel sounds, giving us the kind of alphabet we use now.","think":"Why would traders, not kings, invent a simpler way to write?","sides":["Traders needed quick, simple records, not fancy royal inscriptions.","Kings liked writing that only trained scribes could read, because it kept power in a few hands."]},{"group":1,"year":-1000,"approx":true,"kind":"ruler","title":"King David and Jerusalem","story":"The Israelites, who worshipped one God, made Jerusalem the capital of their kingdom under King David. His son Solomon built a great temple there. Their history is told in the Hebrew Bible.","whoa":"Jerusalem is still an important city to Jews, Christians and Muslims.","question":"What city did King David make his capital?","answer":"Jerusalem","wrong":["Babylon","Athens","Memphis"],"more":"Most of what we know about David comes from the Hebrew Bible. In 1993 archaeologists found a stone inscription mentioning the “House of David,” written about 150 years after his time. The Hebrew Bible became one of the most influential books ever, shaping Judaism, Christianity and Islam.","think":"How do historians decide what to trust in very old writings?"},{"group":1,"year":-776,"approx":false,"kind":"life","title":"The first Olympic Games","story":"The Greeks held games at Olympia to honor their god Zeus. At first there was just one race, a sprint the length of the stadium. Wars paused so athletes could travel safely.","whoa":"Winners got a crown of olive leaves, not a gold medal.","question":"What prize did early Olympic winners get?","answer":"A crown of olive leaves","wrong":["A gold medal","A horse","A trophy cup"],"more":"Only free Greek men could compete, and married women were not allowed to watch. Athletes competed naked, and events grew to include wrestling, chariot races and a race in armor. Unmarried women had their own games at Olympia in honor of the goddess Hera.","think":"Should sports ever be used to pause wars?","sides":["Yes. Bringing rivals together, even briefly, reminds people they share something.","It only works a little. Wars restart afterward, so it may just make things look better than they are."]},{"group":1,"year":-753,"approx":false,"kind":"ruler","title":"Romulus and Remus found Rome","story":"Roman legend says twin brothers were raised by a wolf. When they grew up they decided to build a city, then quarreled. Romulus won, and the city was named Rome after him.","whoa":"Historians think Rome really began as small villages on seven hills.","question":"In the legend, what animal raised Romulus and Remus?","answer":"A wolf","wrong":["A bear","An eagle","A lion"],"more":"In the legend, the twins argued about which hill to build on, and Romulus killed Remus. Romans told this story with pride and with unease. Archaeologists have found huts on the Palatine Hill from around the 700s BC, so the date in the legend is not far off.","think":"Why would a city tell a founding story where one brother kills the other?","sides":["To teach that Rome’s walls and laws must be defended at any cost.","To admit that power often begins in violence, as a warning."]},{"group":1,"year":-650,"approx":true,"kind":"idea","title":"Ashurbanipal's library","story":"Ashurbanipal, king of the fierce Assyrians, loved to read. He collected thousands of clay tablets into a great library at Nineveh. One of them tells the story of Gilgamesh, one of the oldest stories in the world.","whoa":"When Nineveh burned, the fire baked the clay tablets harder, which helped save them.","question":"Which old story was found in Ashurbanipal's library?","answer":"Gilgamesh","wrong":["The Odyssey","Robin Hood","Aesop's Fables"],"more":"Ashurbanipal sent people across his empire to copy tablets on medicine, magic, math and stars. The Assyrians were feared for brutal warfare, and his carvings show lion hunts and battles. The tablets are now mostly in the British Museum, and scholars are still translating them.","think":"Can someone be cruel and also care about learning?","sides":["Yes. People are complicated, and history is full of rulers with both sides.","Maybe his library was mostly about power too, owning all knowledge the way he owned land."]},{"group":1,"year":-600,"approx":true,"kind":"build","title":"Babylon's hanging gardens","story":"King Nebuchadnezzar made Babylon grand, with a bright blue Ishtar Gate. Old writers said he built gardens on high terraces for his homesick queen. They are one of the Seven Wonders of the Ancient World.","whoa":"Nobody has found proof the gardens existed, so they are still a mystery.","question":"Which king is linked to the Hanging Gardens of Babylon?","answer":"Nebuchadnezzar","wrong":["Hammurabi","Cyrus","Ashoka"],"more":"Babylonian records never mention the gardens, and no clear remains have been found in Babylon. One historian, Stephanie Dalley, argues they were really in Nineveh, built by an Assyrian king. Others think Greek writers made them up or exaggerated.","think":"If no one can find proof, should we still call the gardens a Wonder of the World?","sides":["Yes. Many ancient writers described them, and absence of proof is not proof they did not exist.","No. Without evidence, it is a legend, and we should say so."]},{"group":1,"year":-539,"approx":false,"kind":"ruler","title":"Cyrus the Great","story":"Cyrus of Persia captured Babylon and built the largest empire the world had seen. He let conquered people keep their own religions and customs. He even let Jewish exiles go home to Jerusalem.","whoa":"Persian kings built a Royal Road so messengers could cross the empire in about a week.","question":"Which empire did Cyrus the Great rule?","answer":"Persia","wrong":["Rome","Egypt","China"],"more":"A clay barrel called the Cyrus Cylinder describes how Cyrus let captured peoples return home and rebuild temples. Some people call it an early human rights document. Historians point out it was also propaganda, written to make Cyrus look like a fair liberator.","think":"Why might a conqueror be kind to the people he conquers?","sides":["Because it is right, and Cyrus truly believed in tolerance.","Because it is smart. Happy subjects rebel less and pay their taxes."]},{"group":1,"year":-528,"approx":true,"kind":"idea","title":"The Buddha","story":"Siddhartha Gautama was a prince in ancient India who left his palace to understand why people suffer. After years of searching, he sat under a tree and meditated. His followers called him the Buddha, \"the awakened one.\"","whoa":"That kind of tree is now called a Bodhi tree.","question":"What does \"Buddha\" mean?","answer":"The awakened one","wrong":["The strong king","The rich man","The traveler"],"more":"The Buddha taught that suffering comes from craving and clinging, and that a balanced life, called the Middle Way, can lead to peace. He taught for about 45 years. Buddhism spread from India to Sri Lanka, China, Japan and Southeast Asia, and today hundreds of millions of people follow it.","think":"Can wanting less make a person happier?"},{"group":1,"year":-520,"approx":true,"kind":"idea","title":"Confucius","story":"Confucius was a teacher in China. He taught that people should be kind, respect their parents, and that rulers should be fair and good. His students wrote down his sayings, and people still read them.","whoa":"His ideas shaped Chinese schools and government for more than 2,000 years.","question":"Confucius taught that rulers should be...","answer":"Fair and good","wrong":["Scary","Rich","Hidden"],"more":"Confucius lived when China was split among warring states. He believed order would return if people treated each other properly in five key relationships, like parent and child or ruler and subject. Later, Chinese officials had to pass exams on Confucian books, a system that lasted until 1905.","think":"Should people always obey their parents and leaders?","sides":["Mostly yes. Respect and order keep families and countries stable.","Not always. Even Confucius said a good person should speak up when a ruler does wrong."]},{"group":1,"year":-508,"approx":false,"kind":"idea","title":"Democracy in Athens","story":"In Athens, citizens began voting on their own laws. This was called democracy, \"rule by the people.\" But only free men could vote, not women or enslaved people.","whoa":"Athenians could vote to send someone away by scratching his name on a piece of broken pottery.","question":"What does \"democracy\" mean?","answer":"Rule by the people","wrong":["Rule by one king","Rule by soldiers","Rule by priests"],"more":"Athenian democracy was direct. Citizens voted on laws themselves instead of electing representatives, and many officials were chosen by lottery. Only about one in five adults could vote. The philosopher Plato thought democracy let ignorant crowds make bad choices.","think":"Was Athens really a democracy if most people could not vote?","sides":["Yes. It was a huge step, and citizens truly ruled themselves for the first time.","No. Rule by a minority of men is not rule by the people."]},{"group":1,"year":-480,"approx":false,"kind":"battle","title":"Spartans at Thermopylae","story":"A huge Persian army invaded Greece. King Leonidas and a small band of Spartans held a narrow mountain pass for three days. Spartan boys trained to be soldiers starting at age seven.","whoa":"Thermopylae means \"hot gates,\" because of hot springs nearby.","question":"Which Greek city trained boys to be soldiers from age seven?","answer":"Sparta","wrong":["Athens","Corinth","Troy"],"more":"There were about 300 Spartans, but several thousand other Greeks fought beside them at first. A local man showed the Persians a hidden path around the pass. The Greeks lost the battle but won the war the next year, partly because Thermopylae inspired them.","think":"Can losing a battle be a kind of victory?","sides":["Yes. Their courage bought time and united Greece against Persia.","No. Hundreds died, and the Persians went on to burn Athens."]},{"group":1,"year":-334,"approx":false,"kind":"explore","title":"Alexander the Great","story":"Alexander of Macedonia became king at twenty. He marched his army from Greece all the way to India and never lost a battle. He founded many cities and named lots of them Alexandria.","whoa":"As a boy he was taught by the famous thinker Aristotle.","question":"Who was Alexander the Great's teacher?","answer":"Aristotle","wrong":["Confucius","Homer","Julius Caesar"],"more":"Alexander’s empire stretched from Greece to Egypt to India, but he died at 32 and it split among his generals. His conquests spread Greek language, art and ideas across Asia, mixing them with Persian, Egyptian and Indian cultures. Many cities he conquered suffered terribly.","think":"Does “the Great” fit a man who conquered so many people?","sides":["Yes. He was a brilliant general who connected cultures across three continents.","No. “Great” hides the cities destroyed and people killed for his ambition."]},{"group":1,"year":-260,"approx":true,"kind":"ruler","title":"Ashoka gives up war","story":"Ashoka ruled a great empire in India. After a terrible battle, he felt so sad about the suffering that he gave up war. He carved messages about kindness on stone pillars across his land.","whoa":"A carving of lions from one of his pillars is on India's money today.","question":"Why did Ashoka give up war?","answer":"He was sad about the suffering","wrong":["He ran out of money","He got sick","He moved to Rome"],"more":"Ashoka’s army conquered Kalinga in a war where his own carvings say over 100,000 people were killed. Afterward he became a Buddhist, built hospitals for people and animals, planted trees along roads and sent teachers abroad. He still kept his army and warned neighbors not to test him.","think":"Can one bad decision lead someone to become a better person?","sides":["Yes. Regret can change people, and Ashoka really did rule differently.","It is complicated. He kept the land he won, and kept his army ready."]},{"group":1,"year":-221,"approx":false,"kind":"ruler","title":"China's first emperor","story":"Qin Shi Huang united China's warring states and called himself the first emperor. He joined old walls into an early Great Wall. He was buried with an army of thousands of clay soldiers.","whoa":"Every one of the terracotta soldiers has a different face.","question":"What was buried with China's first emperor?","answer":"An army of clay soldiers","wrong":["Real elephants","His whole library","A golden ship"],"more":"Qin Shi Huang made everyone use the same writing, coins, measurements and even cart-axle widths. That helped China stay one country for centuries. He also burned books he disliked and forced huge numbers of people to work on his projects. His dynasty collapsed only four years after he died.","think":"Is it worth being harsh to unite a country?","sides":["His reforms held China together for 2,000 years, so they mattered.","Cruelty made people hate the Qin so much that the dynasty fell almost at once."]},{"group":1,"year":-218,"approx":false,"kind":"battle","title":"Hannibal crosses the Alps","story":"Hannibal of Carthage wanted to beat Rome. He surprised the Romans by marching his army, with war elephants, over the snowy Alps. He won big battles but never captured Rome.","whoa":"He started with about 37 elephants, and very few survived the trip.","question":"What animals did Hannibal bring over the Alps?","answer":"Elephants","wrong":["Camels","Giraffes","Rhinos"],"more":"Hannibal crushed Roman armies at Lake Trasimene and Cannae, one of the worst defeats Rome ever suffered. But Rome refused to give up, and Hannibal fought in Italy for 15 years without capturing the city. Rome finally invaded Africa, beat him at Zama and later destroyed Carthage completely.","think":"Is it better to be brilliant or to never give up?","sides":["Brilliance wins battles. Hannibal beat much bigger armies again and again.","Never giving up wins wars. Rome kept going after terrible losses and won in the end."]},{"group":1,"year":-44,"approx":false,"kind":"ruler","title":"Julius Caesar","story":"Julius Caesar was a Roman general who conquered Gaul (now France) and made himself dictator of Rome. Some senators feared he would become king. On the Ides of March they attacked him in the Senate.","whoa":"The month of July is named after him.","question":"Which month is named after Julius Caesar?","answer":"July","wrong":["March","August","June"],"more":"Caesar was popular with ordinary Romans and his soldiers, and he gave land to veterans and fixed the calendar. But he ignored the Senate and was named dictator for life. The senators who killed him said they were saving the Republic. Instead, it led to civil war and to emperors.","think":"Were the senators right to stop Caesar?","sides":["Yes. He was destroying the Republic, and they had no other way to stop him.","No. Murder solved nothing, and Rome got emperors anyway."]},{"group":1,"year":-27,"approx":false,"kind":"ruler","title":"Augustus, first emperor of Rome","story":"Caesar's adopted son Octavian took the name Augustus and became Rome's first emperor. His rule began about 200 years of peace called the Pax Romana. He said he found Rome a city of brick and left it a city of marble.","whoa":"August is named after him.","question":"What was the long peace that began with Augustus called?","answer":"The Pax Romana","wrong":["The Dark Ages","The Renaissance","The Golden Horde"],"more":"Augustus kept the Senate and the old titles, so Rome still looked like a republic, but he held the real power. He built roads, temples and a fire brigade, and his reign brought peace after years of civil war. He ruled for 41 years.","think":"Would you trade freedom to vote for peace and safety?","sides":["Many Romans did. After years of civil war, peace felt worth it.","It is a dangerous trade. A good emperor can be followed by a terrible one."]},{"group":1,"year":79,"approx":false,"kind":"life","title":"Pompeii is buried","story":"Mount Vesuvius erupted and buried the Roman town of Pompeii in ash. Because it was covered so fast, the town was preserved. Today you can walk its streets and see bakery ovens and graffiti.","whoa":"Some of the graffiti in Pompeii is people complaining about their neighbors.","question":"What volcano buried Pompeii?","answer":"Vesuvius","wrong":["Etna","Fuji","Krakatoa"],"more":"The ash buried people where they fell. Archaeologists poured plaster into the hollows their bodies left, making casts that show their final poses. A Roman writer, Pliny the Younger, watched the eruption from across the bay and described it in letters. His uncle died trying to rescue people.","think":"Should the plaster casts of victims be shown to tourists?","sides":["Yes. They make history real and help people understand what happened.","Only carefully. These were real people, and their deaths should not be entertainment."]},{"group":1,"year":330,"approx":false,"kind":"ruler","title":"Constantine builds a new capital","story":"Constantine was the first Roman emperor to become a Christian. He moved his capital east to the city of Byzantium and renamed it Constantinople. Today that city is Istanbul, in Turkey.","whoa":"At first he called it \"New Rome.\"","question":"What is Constantinople called today?","answer":"Istanbul","wrong":["Rome","Athens","Cairo"],"more":"Constantine said he saw a sign in the sky before a battle and became a supporter of Christianity. He made it legal in 313, ending persecution of Christians. Constantinople’s location let it control trade between Europe and Asia and between the Black Sea and the Mediterranean.","think":"Why would an emperor want to move his capital?","sides":["To be closer to the richer, safer eastern part of the empire.","To make a fresh start, away from Rome’s old families and old gods."]},{"group":1,"year":476,"approx":false,"kind":"ruler","title":"The last western Roman emperor","story":"Germanic tribes had been pushing into the Roman Empire for years. In 476 a chieftain named Odoacer removed the last western emperor, a boy named Romulus Augustulus. The eastern half of the empire kept going for another thousand years.","whoa":"The last emperor had the same name as Rome's legendary founder, Romulus.","question":"Who removed the last western Roman emperor?","answer":"Odoacer","wrong":["Attila","Hannibal","Augustus"],"more":"Rome did not fall in a day. For centuries the empire faced civil wars, money trouble, plagues and invasions. Some historians say it fell; others say it slowly transformed, as Germanic kings kept Roman laws, Latin and Christianity. The eastern empire lasted until 1453.","think":"Did the Roman Empire fall, or did it change into something new?","sides":["It fell. Cities shrank, trade collapsed and life got harder for many people.","It changed. Roman language, law and religion lived on in the kingdoms that followed."]},{"group":2,"year":500,"approx":true,"kind":"life","title":"King Arthur's Britain","story":"After the Romans left Britain, Angles and Saxons sailed in from across the sea. Stories grew up about a brave British king named Arthur who fought them. Nobody knows if Arthur was real, but the legends of Camelot and the Round Table live on.","whoa":"The name England comes from \"Angle-land.\"","question":"What is the name of King Arthur's legendary castle?","answer":"Camelot","wrong":["Windsor","Knossos","Versailles"],"more":"The earliest mentions of Arthur come centuries after his supposed lifetime. Writers in the 1100s, like Geoffrey of Monmouth, added Camelot, Merlin and the sword Excalibur. Later French writers added Lancelot and the Holy Grail. The legend kept growing because each age used it to show its own ideals.","think":"Why do people keep telling stories about heroes who may never have existed?","sides":["Because legends teach values like courage, fairness and loyalty.","Because people want a glorious past, even if it is invented."]},{"group":2,"year":537,"approx":false,"kind":"build","title":"Justinian and the Hagia Sophia","story":"Emperor Justinian and Empress Theodora ruled the Byzantine Empire from Constantinople. Justinian built the Hagia Sophia, a church with a dome that seemed to float. He also gathered Rome's laws into one big book.","whoa":"Theodora had been an actress before she became empress.","question":"What was the Byzantine church with the famous dome?","answer":"Hagia Sophia","wrong":["Notre Dame","The Parthenon","St. Paul's"],"more":"When riots nearly drove Justinian from power in 532, Theodora is said to have convinced him to stay and fight. His soldiers crushed the riot, killing thousands. The Hagia Sophia was the world’s largest church for nearly 1,000 years. It later became a mosque, then a museum, and in 2020 a mosque again.","think":"Who should decide what a famous historic building is used for?","sides":["The country it stands in. It is part of their nation and their faith.","Buildings like this belong to world history, so everyone’s feelings should count."]},{"group":2,"year":622,"approx":false,"kind":"idea","title":"Muhammad and the beginning of Islam","story":"In Arabia, Muhammad taught that there is one God, called Allah in Arabic. In 622 he and his followers moved from Mecca to Medina, a journey called the Hijra. The Islamic calendar counts its years from that journey.","whoa":"Muslims believe the Quran is God's word, revealed to Muhammad.","question":"What is the journey from Mecca to Medina called?","answer":"The Hijra","wrong":["The Crusade","The Exodus","The Odyssey"],"more":"Muhammad was a merchant in Mecca who, Muslims believe, began receiving revelations from God around 610. In Medina he became a religious and political leader. Within a century after his death, Islam had spread from Spain to Central Asia. Today it is the world’s second-largest religion.","think":"Why do you think new religions often face resistance at first?"},{"group":2,"year":700,"approx":true,"kind":"build","title":"The Maya of Central America","story":"The Maya built stone cities with tall pyramids in the jungles of Mexico and Central America. They had writing, a calendar, and a symbol for zero. In their ball game, players could not use their hands.","whoa":"The Maya used zero long before people in Europe did.","question":"Which number did the Maya use long before Europe did?","answer":"Zero","wrong":["One million","Pi","Seven"],"more":"Maya astronomers tracked the movements of Venus and predicted eclipses. Their cities were ruled by kings who fought each other often. Around 900, many southern cities were abandoned, likely because of drought, war and overused land. Millions of Maya people still live in the region today.","think":"When a civilization “collapses,” what really happens to its people?","sides":["Collapse is real. Cities emptied and kings and writing systems disappeared.","“Collapse” is misleading. Maya people moved, adapted and still live there."]},{"group":2,"year":793,"approx":false,"kind":"battle","title":"Vikings raid Lindisfarne","story":"Viking longships landed at the monastery of Lindisfarne in England and raided it. For 200 years, Vikings from Scandinavia sailed out to trade, raid and settle. Their ships could cross oceans and also row up shallow rivers.","whoa":"Vikings probably did not wear horned helmets. That idea came from operas and paintings in the 1800s.","question":"Where did the Vikings come from?","answer":"Scandinavia","wrong":["Italy","Egypt","China"],"more":"Vikings raided monasteries because they held treasure and were poorly defended. But most Scandinavians were farmers, and many Vikings were traders who reached Baghdad and Constantinople. They settled in England, Ireland, France, Iceland and Greenland. Normandy in France is named after these “Northmen.”","think":"Should Vikings be remembered as raiders or as explorers and traders?","sides":["Raiders. Monks and villagers lived in terror of them.","Explorers and traders. Raiding was only one part of a far larger story."]},{"group":2,"year":800,"approx":false,"kind":"ruler","title":"Charlemagne is crowned","story":"Charlemagne, king of the Franks, conquered much of western Europe. On Christmas Day in 800, the Pope crowned him emperor. He started schools, even though he struggled to learn to write.","whoa":"He kept writing tablets under his pillow to practice his letters at night.","question":"On what day was Charlemagne crowned emperor?","answer":"Christmas Day","wrong":["New Year's Day","His birthday","Easter"],"more":"Charlemagne’s scholars copied old Roman books and invented a clear new handwriting with lowercase letters, which our printed letters come from. He also fought brutal wars, including against the Saxons, whom he forced to become Christian. His empire split among his grandsons and laid the roots of France and Germany.","think":"Can a ruler who forces his religion on others still be called great?","sides":["His schools and books saved learning in Europe.","Forcing religion with violence is a serious wrong that greatness cannot erase."]},{"group":2,"year":830,"approx":true,"kind":"idea","title":"The House of Wisdom","story":"In Baghdad, the Abbasid caliphs set up a great library called the House of Wisdom. Scholars translated old Greek and Persian books into Arabic and made new discoveries in math and science. The word \"algebra\" comes from a book written there.","whoa":"The scholar al-Khwarizmi also gave us the word \"algorithm.\"","question":"Which city had the House of Wisdom?","answer":"Baghdad","wrong":["Paris","Beijing","London"],"more":"Scholars of many faiths, Muslim, Christian and Jewish, worked in Baghdad translating and improving on Greek, Persian and Indian knowledge. Al-Khwarizmi spread the Indian number system with zero, which became our “Arabic numerals.” Baghdad was destroyed by the Mongols in 1258, and the story goes the Tigris ran black with ink.","think":"Why do places where different people mix often become centers of discovery?","sides":["Different backgrounds bring different ideas, and new ideas grow from combining them.","It is really about money. Rich rulers paid scholars, and wealth attracts talent."]},{"group":2,"year":868,"approx":false,"kind":"invent","title":"The Diamond Sutra is printed","story":"In Tang dynasty China, people carved a whole page into a wooden block, inked it, and pressed it onto paper. The Diamond Sutra, a Buddhist book, is the oldest printed book with a date in it. China also invented gunpowder around this time.","whoa":"That is almost 600 years before Gutenberg's press in Europe.","question":"What is the oldest dated printed book we have?","answer":"The Diamond Sutra","wrong":["The Gutenberg Bible","Hammurabi's code","The Odyssey"],"more":"This copy was found in 1900 sealed in a cave near Dunhuang, China, along with tens of thousands of other documents. It is now in the British Library. Around 1040, a Chinese printer named Bi Sheng invented movable type made of baked clay, 400 years before Gutenberg.","think":"If China had printing first, why did printing change Europe so suddenly?","sides":["Chinese writing has thousands of characters, so movable type was harder to use.","Europe’s alphabet had only a few dozen letters, which suited movable type perfectly."]},{"group":2,"year":878,"approx":false,"kind":"ruler","title":"Alfred the Great","story":"King Alfred of Wessex fought off the Vikings and saved part of England. A famous story says that while hiding, he was asked to watch some cakes baking and let them burn. He built forts called burhs and wanted his people to read in English.","whoa":"He is the only English king called \"the Great.\"","question":"Which invaders did Alfred the Great fight?","answer":"Vikings","wrong":["Romans","Mongols","Normans"],"more":"Alfred made peace with Viking leader Guthrum, splitting England into Alfred’s kingdom and the Danelaw. He started schools and had important Latin books translated into English. His grandson Æthelstan became the first king of all England.","think":"Is making peace with an enemy a sign of strength or weakness?","sides":["Strength. Alfred saved his kingdom and gave it time to grow strong.","It can look weak, and it left half of England under Viking rule."]},{"group":2,"year":1000,"approx":true,"kind":"explore","title":"Leif Erikson reaches America","story":"Leif Erikson, son of Erik the Red, sailed west from Greenland. He landed in a place he called Vinland, in what is now Canada. That was almost 500 years before Columbus.","whoa":"Remains of a Viking camp were found at L'Anse aux Meadows in Newfoundland.","question":"What did Leif Erikson call the land he found?","answer":"Vinland","wrong":["Greenland","Iceland","Atlantis"],"more":"Norse sagas told of Vinland for centuries, but many people thought it was a legend. In 1960, Helge and Anne Stine Ingstad found the site at L’Anse aux Meadows. Wood there was cut in the year 1021, according to tree-ring dating. The Norse left after a few years, partly after conflict with Indigenous people.","think":"Does it matter who “discovered” America first?","sides":["Yes. It is a real historical fact worth getting right.","Not really. Indigenous peoples had been there for thousands of years, so no one discovered it."]},{"group":2,"year":1066,"approx":false,"kind":"battle","title":"The Battle of Hastings","story":"William, Duke of Normandy, crossed the sea and fought King Harold of England at Hastings. Harold was killed and William became king. People call him William the Conqueror.","whoa":"The battle is shown on the Bayeux Tapestry, a stitched cloth about 70 meters long.","question":"Who won the Battle of Hastings?","answer":"William the Conqueror","wrong":["King Harold","Alfred the Great","Richard the Lionheart"],"more":"Harold had just beaten a Norwegian invasion in the north and marched his tired army south. The battle lasted all day. William’s victory changed England forever: French became the language of the rulers, and thousands of French words entered English, like “beef,” “castle” and “court.”","think":"How much can one battle change a whole country?","sides":["Hugely. Hastings changed England’s rulers, language and laws.","Less than it seems. Most ordinary people kept farming and speaking English."]},{"group":2,"year":1096,"approx":false,"kind":"battle","title":"The Crusades begin","story":"Pope Urban II called on European knights to capture Jerusalem. Crusaders marched thousands of miles and fought Muslim armies in the Holy Land. There were many Crusades over 200 years, with famous leaders like Saladin on the other side.","whoa":"Crusaders brought sugar, spices and new ideas back to Europe.","question":"Which city did the Crusaders want to capture?","answer":"Jerusalem","wrong":["Rome","Paris","Baghdad"],"more":"The First Crusade captured Jerusalem in 1099 and killed many of its Muslim and Jewish people. Saladin retook the city in 1187. Crusaders also attacked Jewish communities in Europe and, in 1204, sacked Christian Constantinople. The Crusades still shape how some people think about Christianity and Islam.","think":"Can a war be holy?","sides":["Crusaders believed they were defending Christians and holy places.","Killing in the name of religion contradicts the teachings of peace in both faiths."]},{"group":2,"year":1192,"approx":false,"kind":"ruler","title":"Samurai and the shogun","story":"In Japan, the emperor was honored, but a military ruler called the shogun held the real power. Minamoto no Yoritomo became shogun in 1192. Samurai warriors served their lords and followed a strict code.","whoa":"Samurai armor was made of small plates laced together with silk cords.","question":"Who held the real power in samurai Japan?","answer":"The shogun","wrong":["The pope","The pharaoh","The sultan"],"more":"Shoguns ruled Japan, on and off, for nearly 700 years, while emperors stayed as respected symbols. Samurai were expected to be loyal to their lord to the death. They also studied poetry, calligraphy and tea ceremony. The ideal of bushido, “the way of the warrior,” was written down mostly in later centuries.","think":"Is loyalty always a good thing?","sides":["Yes. Loyalty builds trust, and people who keep promises hold a society together.","Not always. Being loyal to a bad leader can mean doing terrible things."]},{"group":2,"year":1206,"approx":false,"kind":"ruler","title":"Genghis Khan","story":"A Mongol named Temujin united the tribes of the grasslands and took the title Genghis Khan. His horse archers conquered land from China to Persia. The Mongol Empire became the largest connected land empire ever.","whoa":"Mongol messengers could ride over 100 miles a day by switching to fresh horses.","question":"What title did Temujin take?","answer":"Genghis Khan","wrong":["Shogun","Caesar","Pharaoh"],"more":"Mongol conquests killed millions of people and destroyed cities like Baghdad. But the Mongol Empire also protected the Silk Road, so trade, ideas and travelers moved safely from China to Europe. Genghis promoted people for skill rather than family and allowed religious freedom.","think":"Can something good come from terrible conquests?","sides":["Yes. The “Mongol Peace” connected the world in ways that helped later generations.","Calling it good ignores the millions who died. Nothing makes that worth it."]},{"group":2,"year":1215,"approx":false,"kind":"idea","title":"Magna Carta","story":"English barons were tired of King John's unfair taxes. At Runnymede they made him agree to the Magna Carta, the \"Great Charter.\" It said that even the king had to follow the law.","whoa":"Ideas from Magna Carta show up in the U.S. Constitution.","question":"What did the Magna Carta say about the king?","answer":"He had to follow the law","wrong":["He could do anything","He must live in France","He must be a knight"],"more":"King John ignored Magna Carta almost immediately, and the Pope cancelled it. But it was reissued several times. Most of it protected the rights of rich barons, not ordinary people. Later generations turned it into a symbol of the idea that no one is above the law.","think":"Can a document matter even if almost no one follows it at first?","sides":["Yes. Ideas on paper can inspire people for centuries.","Not really. Rights matter only when they are enforced."]},{"group":2,"year":1271,"approx":false,"kind":"explore","title":"Marco Polo goes to China","story":"Marco Polo, a young man from Venice, traveled the Silk Road to the court of Kublai Khan. He stayed in China for about 17 years. His book about the trip amazed Europeans.","whoa":"Europeans could hardly believe his stories about paper money and black rocks that burned (coal).","question":"Whose court did Marco Polo visit?","answer":"Kublai Khan","wrong":["Charlemagne","Mansa Musa","Saladin"],"more":"Marco Polo told his story to a writer while in prison in Genoa, and the book added exciting details. Some historians wonder why he never mentioned the Great Wall, tea or chopsticks. Most think he did go to China, since he described things like salt production and paper money accurately.","think":"How can we tell if a traveler’s story is true?","sides":["Check details against other sources. Many of Marco Polo’s facts match Chinese records.","Be suspicious. Travelers have always exaggerated to sell a good story."]},{"group":2,"year":1300,"approx":true,"kind":"build","title":"Great Zimbabwe","story":"In southern Africa, the Shona people built Great Zimbabwe, a city with tall, curving stone walls. They fit the stones together without any mortar. The city grew rich trading gold and ivory.","whoa":"The country of Zimbabwe is named after this city.","question":"What was special about Great Zimbabwe's walls?","answer":"No mortar held them together","wrong":["They were made of gold","They were made of wood","They floated"],"more":"At its height, Great Zimbabwe may have had 10,000 to 18,000 people. Chinese pottery and Persian beads found there show it traded across the Indian Ocean. In colonial times, some Europeans claimed Africans could not have built it, which archaeologists proved wrong.","think":"Why would anyone claim Africans did not build Great Zimbabwe?","sides":["Prejudice. Colonizers wanted to believe Africans had no great history.","Lack of evidence at first. But the evidence proved it was Shona-built."]},{"group":2,"year":1324,"approx":false,"kind":"ruler","title":"Mansa Musa's journey","story":"Mansa Musa ruled the empire of Mali in West Africa, which was rich with gold. On his trip to Mecca he brought thousands of people and camels loaded with gold. He gave away so much in Cairo that gold there lost value.","whoa":"He may have been one of the richest people who ever lived.","question":"Which empire did Mansa Musa rule?","answer":"Mali","wrong":["Ghana","Egypt","Persia"],"more":"Mansa Musa built mosques and helped make Timbuktu a center of learning, with libraries holding thousands of manuscripts. A Spanish map from 1375 shows him holding a gold nugget. His trip made Europeans and Arabs realize how rich West Africa was.","think":"Is giving away huge amounts of money always generous?","sides":["Yes. He shared his wealth and helped many people.","Not always. It made gold lose value in Cairo and hurt the local economy for years."]},{"group":2,"year":1325,"approx":false,"kind":"build","title":"The Aztecs build Tenochtitlan","story":"Aztec legend said they should build where they saw an eagle on a cactus eating a snake. They saw it on an island in a lake and built Tenochtitlan. They grew food on floating gardens called chinampas.","whoa":"Mexico City stands on the same spot, and the eagle is on Mexico's flag.","question":"What sign told the Aztecs where to build?","answer":"An eagle on a cactus","wrong":["A rainbow","A falling star","A white horse"],"more":"Tenochtitlan had causeways, canals and a freshwater aqueduct, and may have had 200,000 people, bigger than any city in Spain then. The Aztecs demanded tribute from conquered peoples and practiced human sacrifice. Spanish soldiers were stunned when they first saw the city.","think":"How should we judge a civilization that was brilliant but also cruel?","sides":["Honestly, both ways. Its engineering was amazing and its sacrifices were terrible.","Carefully. We should understand their beliefs before judging by our own."]},{"group":2,"year":1347,"approx":false,"kind":"life","title":"The Black Death","story":"A terrible plague spread across Asia and Europe. It was carried by fleas that lived on rats. About one out of every three people in Europe died.","whoa":"Some doctors wore masks stuffed with herbs, thinking bad smells caused the disease.","question":"What carried the Black Death?","answer":"Fleas on rats","wrong":["Mosquitoes","Cats","Snow"],"more":"The plague came to Europe in 1347 on ships from the Black Sea. With so many people dead, workers became scarce, so survivors could demand higher wages. In some towns, frightened people blamed Jewish communities and attacked them. The plague returned again and again for centuries.","think":"Why do people look for someone to blame during a disaster?","sides":["Fear. Blaming someone makes a scary, invisible danger feel controllable.","Ignorance. Without science, people had no other explanation."]},{"group":2,"year":1405,"approx":false,"kind":"explore","title":"Zheng He's treasure fleet","story":"Admiral Zheng He led huge Ming Chinese fleets across the
