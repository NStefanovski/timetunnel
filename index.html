<script>
/* ---------- diorama ----------
   A hand-painted strip of world that scrolls with the timeline, built with the ideas from
   ClaudeAnimationBase, adapted to a plain 2D canvas so it runs smoothly on phones:
   - every frame is a pure function of the track's scroll position (the camera), so swiping
     back plays everything in reverse: walk cycle, gears, rockets, eggs cracking, all of it
   - linework "boils": jitter is reseeded 12 times a second, per element (boilSeed)
   - stable things (stars, hills, window lights) come from hash(), never Math.random()
   - flat washes + ink outlines, additive glow() for anything that shines, paper grain on top
   - no text inside the scene: everything is shown, not written */
(()=>{
const cv=document.getElementById('dio'); if(!cv) return;
const cx=cv.getContext('2d');
const H=172, GY=H-30, BOIL=12;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NIGHT='#10142e', DEEP='#181e44', TEXT='#f2efe7', INK='#070a1c', GOLD='#ffd86b', ROSE='#ef5d71';
const CLOAK='#e8e1cf';
let W=0, dpr=1, XC=0;

/* colour */
const hx=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const mix=(a,b,k)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')};
const rgba=(h,a)=>{const c=hx(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`};

/* randomness: hash for things that must stay put, jit for the boil */
const hash=(i,j=0)=>{const x=Math.sin(i*127.1+j*311.7)*43758.5453;return x-Math.floor(x)};
let boilF=0, sd=1;
function boilSeed(k){let h=2166136261;const s=k+'|'+boilF;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}sd=h>>>0}
const rnd=()=>{sd=(Math.imul(sd,1664525)+1013904223)>>>0;return sd/4294967296};
const jit=a=>(rnd()*2-1)*a;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const frac=v=>v-Math.floor(v);

/* shapes: point lists, subdivided so the boil can wobble the edges */
function poly(P,step=9){const o=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],n=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/step));for(let k=0;k<n;k++)o.push([lerp(a[0],b[0],k/n),lerp(a[1],b[1],k/n)])}return o}
const rect=(x,y,w,h)=>poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]]);
function ell(x,y,rx,ry,n=16,a0=0,a1=Math.PI*2){const o=[],full=Math.abs(a1-a0)>=Math.PI*2-1e-6;const m=full?n:n+1;for(let i=0;i<m;i++){const a=a0+(a1-a0)*i/n;o.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry])}return o}
function trace(P,j,closed){
  const Q=P.map(p=>[p[0]+jit(j),p[1]+jit(j)]);
  cx.beginPath();
  if(closed){
    const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const s=m(Q[Q.length-1],Q[0]);cx.moveTo(s[0],s[1]);
    for(let i=0;i<Q.length;i++){const a=Q[i],e=m(a,Q[(i+1)%Q.length]);cx.quadraticCurveTo(a[0],a[1],e[0],e[1])}
    cx.closePath();
  }else{
    cx.moveTo(Q[0][0],Q[0][1]);
    for(let i=1;i<Q.length-1;i++){const e=[(Q[i][0]+Q[i+1][0])/2,(Q[i][1]+Q[i+1][1])/2];cx.quadraticCurveTo(Q[i][0],Q[i][1],e[0],e[1])}
    const L=Q[Q.length-1];cx.lineTo(L[0],L[1]);
  }
}
/* paint = flat wash + boiling ink outline (wash and ink take separate jitter, like a real brush) */
function paint(P,o={}){
  const j=o.j??1;
  if(o.wash){trace(P,j*.5,true);cx.fillStyle=o.wash;cx.fill()}
  if(o.ink!==null){cx.strokeStyle=o.ink||INK;cx.lineWidth=o.sw||1.5;cx.lineJoin=cx.lineCap='round';trace(P,j,true);cx.stroke()}
}
function stroke(P,sw=1.5,col=INK,j=.9){
  const Q=[];for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],n=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/10));for(let k=0;k<n;k++)Q.push([lerp(a[0],b[0],k/n),lerp(a[1],b[1],k/n)])}
  Q.push(P[P.length-1]);
  cx.strokeStyle=col;cx.lineWidth=sw;cx.lineCap=cx.lineJoin='round';trace(Q,j,false);cx.stroke();
}
function glow(x,y,r,col,a=.5){
  if(r<=1||a<=0)return;
  cx.save();cx.globalCompositeOperation='lighter';
  const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));
  cx.fillStyle=g;cx.fillRect(x-r,y-r,r*2,r*2);cx.restore();
}
function dot(x,y,r,col){cx.fillStyle=col;cx.beginPath();cx.arc(x+jit(.3),y+jit(.3),r,0,Math.PI*2);cx.fill()}
function flag(px,py,w,h,col,T,ph){

const TITLE=[[/pyramid/i,'pyramid'],[/stonehenge/i,'stones'],[/parthenon|colosseum|democracy|socrates/i,'temple'],
  [/taj mahal|hagia|angkor|lalibela/i,'dome'],[/moon|mars|space|sputnik|webb|pluto|artemis|chandrayaan|black hole/i,'rocket'],
  [/wright|flight/i,'balloon'],[/printing|gutenberg|steam|railway/i,'gears'],[/insulin|penicillin|vaccine|dna|genome/i,'book']];
function pick(s){
  if(!LN.timed){
    if(s.k==='creation'&&s.v===6)return 'tree';
    if(s.k==='lesson')return hash(s.id,6)<.5?'lamp':'book';
    return {creation:'egg',god:'storm',hero:'sword',monster:'serpent',quest:s.v===5?'canoe':'ship',lesson:'book'}[s.k]||'book';
  }
  for(const [re,n] of TITLE)if(re.test(s.t))return n;
  const y=s.y,h=hash(s.id,5);
  switch(s.k){
    case 'build':return y<500?['pyramid','temple','stones'][Math.floor(h*3)]:y<1550?(h<.5?'castle':'dome'):y<1837?'dome':y<1950?'factory':'skyline';
    case 'ruler':return y<0?'obelisk':y<1800?'crown':'capitol';
    case 'battle':return 'banners';
    case 'explore':return y<1850?'ship':y<1950?'balloon':'rocket';
    case 'invent':return y<1400?'tablet':y<1870?'gears':y<1950?'bulb':'dish';
    case 'life':return y<500?'huts':'houses';
    default:return hash(s.id,6)<.5?'lamp':'book';
  }
}

  else if(t==='tophat'){R(x-r*.8,hy-r*2.6,r*1.6,r*1.8,INK,{ink:null});R(x-r*1.3,hy-r*.95,r*2.6,r*.4,INK,{ink:null})}
  else if(t==='bicorne'){P(ell(x,hy-r*.7,r*2,r*1,12,PI,TAU),INK,{ink:null})}
  else if(t==='halo'){glow(x,hy,r*3.4,GOLD,.5);cx.strokeStyle=rgba(GOLD,.9);cx.lineWidth=1.2;cx.beginPath();cx.arc(x,hy,r*1.7,0,TAU);cx.stroke()}

function quad(x,o={}){

  if(nk>3)thick([[nx,ny],[hx,hy+hr*.3]],o.nw||bh*.42,col);

  E(hx+f*hr*.5,hy,hr,hr*(o.hy||.75),col,{sw:1.3});
  if(o.ears)Tri(hx-f*hr*.1,hy-hr*.4,hr*.7,hr*1.2,col,{sw:1});
  if(o.horns){Ln([[hx,hy-hr*.5],[hx-f*hr*.6,hy-hr*1.6],[hx+f*hr*.4,hy-hr*1.9]],1.6,TEXT)}
  if(o.trunk){stroke([[hx+f*hr*1.2,hy],[hx+f*hr*1.7,hy+hr*1.2],[hx+f*hr*1.5,hy+hr*2.3]],hr*.45+2,INK);stroke([[hx+f*hr*1.2,hy],[hx+f*hr*1.7,hy+hr*1.2],[hx+f*hr*1.5,hy+hr*2.3]],hr*.45,col);E(hx-f*hr*.3,hy+hr*.1,hr*.7,hr*.95,dim(col,.15),{sw:1})}
  if(o.tusk)Ln([[hx+f*hr*.9,hy+hr*.6],[hx+f*hr*1.8,hy+hr*.9]],1.6,TEXT);

  stroke(ell(x-50,GY-20,6,16,10,PI*.5,PI*1.5),1.6,WOOD);E(x-46,GY-10,6,8,mix(SAND,NIGHT,.2),{sw:1});for(let k=0;k<4;k++)Ln([[x-48,GY-34+k*3],[x-48,GY-14]],.4,TEXT);

/* ---------- the traveler: a little lantern-bearer who walks the timeline ---------- */
function traveler(x,T,mid,lean,face,amp,glowK){
  boilSeed('traveler');
  const ph=mid/13;                                   // walk cycle comes from scroll position, so it reverses too
  const bob=amp*Math.abs(Math.sin(ph))*2.6+(1-amp)*Math.sin(T*2.2)*.8;
  const y=GY-bob;
  cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.ellipse(x,GY+1,14,3,0,0,Math.PI*2);cx.fill();
  glow(x+face*16,GY,34+16*glowK,GOLD,.12+.06*glowK);   // lantern light on the ground
  cx.save();cx.translate(x,GY);cx.rotate(lean*.16);cx.translate(-x,-GY);
  const sw=Math.sin(ph)*7*amp;
  stroke([[x-4,y-10],[x-4+sw,GY]],2.6,INK,.4);stroke([[x+4,y-10],[x+4-sw,GY]],2.6,INK,.4);
  // scarf: follow-through, it trails behind and flutters
  const sc=-face,wv=Math.sin(T*6)*2,dr=Math.abs(lean)*6;
  stroke([[x,y-30],[x+sc*(9+dr),y-29+wv],[x+sc*(15+dr*1.6),y-31-wv*.6],[x+sc*(21+dr*2),y-28+wv]],3.4,ROSE,.5);
  // cloak and hood
  paint(poly([[x-11,y-8],[x-8,y-28],[x+8,y-28],[x+11,y-8]],6),{wash:CLOAK,sw:1.5});
  paint(ell(x+face,y-31,8.5,9.5,14),{wash:CLOAK,sw:1.5});
  paint(ell(x+face*3,y-30,5,5.6,12),{wash:INK,ink:null,j:.4});
  const blink=hash(Math.floor(T*4),77)>.92;
  if(blink){stroke([[x+face*3-3.4,y-30.5],[x+face*3-1,y-30.5]],1,GOLD,.1);stroke([[x+face*3+1,y-30.5],[x+face*3+3.4,y-30.5]],1,GOLD,.1)}
  else{dot(x+face*3-2.2,y-30.6,1.15,GOLD);dot(x+face*3+2.2,y-30.6,1.15,GOLD)}
  // staff, and a lantern that swings against the motion
  const tx=x+face*17,ty=y-46;
  stroke([[x+face*6,y-17],[tx,ty]],1.8,INK,.4);
  const a=-lean*.9+amp*Math.sin(ph*2)*.14+Math.sin(T*1.7)*.05;
  const lx=tx+Math.sin(a)*8,ly=ty+Math.cos(a)*8;
  stroke([[tx,ty],[lx,ly]],1,INK,.2);
  const fl=reduce?0:jit(.08);
  glow(lx,ly+5,16+8*glowK+fl*30,GOLD,.42+.1*glowK);
  paint(rect(lx-3.5,ly,7,9),{wash:mix(GOLD,TEXT,.25),sw:1.2,j:.4});
  cx.restore();
}

/* ---------- world layers ---------- */
function sky(mid,T,tint){
  glow(XC,-20,Math.max(W*.6,260),tint,.13);
  // stars, far away: they barely move
  const par=.08,x0=mid*par-XC,x1=x0+W;
  for(let k=Math.floor(x0/26)-1;k<=Math.ceil(x1/26)+1;k++){
    if(hash(k,1)<.45)continue;
    const sx=k*26+hash(k,2)*26-mid*par+XC,sy=6+hash(k,3)*(GY-74);
    const tw=.25+.55*(.5+.5*Math.sin(T*(1+hash(k,4)*2)+k));
    cx.fillStyle=rgba(TEXT,tw*.8);const r=hash(k,5)<.85?1:1.6;cx.fillRect(sx,sy,r,r);
  }
  // the moon goes through its phases as you travel through time
  const mx=W-48,my=26,ph=frac(mid/2400);
  glow(mx,my,40,TEXT,.1);
  cx.fillStyle=mix(TEXT,NIGHT,.08);cx.beginPath();cx.arc(mx,my,11,0,Math.PI*2);cx.fill();
  cx.save();cx.beginPath();cx.arc(mx,my,11.6,0,Math.PI*2);cx.clip();cx.globalCompositeOperation='destination-out';
  cx.beginPath();cx.arc(mx+(ph-.5)*44,my-1,11.5,0,Math.PI*2);cx.fill();cx.restore();
}
function hills(mid,par,base,amp,col,seed){
  boilSeed('hills'+seed);
  const P=[];
  for(let sx=-20;sx<=W+20;sx+=18){
    const wx=sx-XC+mid*par;
    P.push([sx,base-amp*(.55*Math.sin(wx*.011+seed)+.3*Math.sin(wx*.027+seed*2.3)+.15*Math.sin(wx*.061+seed*4.1))]);
  }
  P.push([W+20,GY+4],[-20,GY+4]);
  paint(P,{wash:col,ink:rgba(mix(col,TEXT,.25),.5),sw:1,j:.6});
}
function ground(mid,T,vis){
  boilSeed('ground');
  const P=[];const k0=Math.floor((mid-XC)/24)-1,k1=Math.ceil((mid-XC+W)/24)+1;
  for(let k=k0;k<=k1;k++)P.push([k*24-mid+XC,GY+(hash(k,3)-.5)*3]);
  const g=cx.createLinearGradient(0,0,W,0);
  if(vis.length){vis.forEach(([sx,s])=>g.addColorStop(clamp(sx/W),mix(G[s.v].color,NIGHT,.8)))}else g.addColorStop(0,DEEP);
  paint([...P,[P[P.length-1][0],H],[P[0][0],H]],{wash:g,ink:rgba(TEXT,.18),sw:1.2,j:.5});
}
function tufts(mid,T){
  boilSeed('tufts');
  const k0=Math.floor((mid-XC)/31)-1,k1=Math.ceil((mid-XC+W)/31)+1;
  for(let k=k0;k<=k1;k++){
    if(hash(k,8)<.5)continue;
    const sx=k*31+hash(k,9)*20-mid+XC,sy=GY+6+hash(k,10)*14,sw=Math.sin(T*2+k)*1.4,c=rgba(TEXT,.16);
    stroke([[sx,sy],[sx-3+sw,sy-6]],1,c,.3);stroke([[sx,sy],[sx+sw,sy-8]],1,c,.3);stroke([[sx,sy],[sx+3+sw,sy-5]],1,c,.3);
  }
}
/* paper grain, boiling with the linework, laid only over painted pixels */
const grain=document.createElement('canvas');grain.width=grain.height=96;
(()=>{const g=grain.getContext('2d'),d=g.createImageData(96,96);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0)})();
let pat=null;

function draw(mid,T,lean,face,amp){
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
  const n=centers.length;if(!n||!S.length)return;
  let fi=0;
  if(mid>=centers[n-1])fi=n-1;else for(let i=0;i<n-1;i++){if(mid>=centers[i]&&mid<centers[i+1]){fi=i+(mid-centers[i])/(centers[i+1]-centers[i]);break}}
  const i0=Math.floor(fi),i1=Math.min(n-1,i0+1);
  const tint=mix(G[S[i0].v].color,G[S[i1].v].color,fi-i0);

  sky(mid,T,tint);
  hills(mid,.18,GY-44,26,mix(tint,NIGHT,.86),1.3);
  hills(mid,.38,GY-18,18,mix(tint,DEEP,.78),4.7);

  const vis=[];let near=0;
  for(let i=0;i<n;i++){const sx=centers[i]-mid+XC;if(sx>-90&&sx<W+90)vis.push([sx,S[i],i])}
  ground(mid,T,vis);
  // farthest first, so the station you're at sits in front
  vis.sort((a,b)=>Math.abs(b[0]-XC)-Math.abs(a[0]-XC));
  for(const [sx,s,i] of vis){
    const p=ease(clamp(1-Math.abs(sx-XC)/72));near=Math.max(near,p);
    const c=G[s.v].color;
    const base=mix(c,NIGHT,.62-.26*p);
    const C={c,base,shade:mix(base,NIGHT,.38),lit:mix(c,TEXT,.18+.1*p)};
    glow(sx,GY,30+30*p,c,.04+.12*p);
    boilSeed(line+':'+i);
    const sc=SC[s.t];
    cx.save();
    try{if(sc)sc(sx,C,p,EV(p),T,s,mid);else (L[pickOf(s)]||L.book)(sx,C,p,T,s,mid)}
    catch(err){if(!broken[s.t]){broken[s.t]=1;console.warn('diorama scene failed:',s.t,err)}}
    cx.restore();
  }
  traveler(XC-52,T,mid,lean,face,amp,near);   // stands just left of the station, looking at it
  tufts(mid,T);

  if(!pat)pat=cx.createPattern(grain,'repeat');
  if(pat){cx.save();cx.globalCompositeOperation='source-atop';cx.globalAlpha=.06;
    const o=(boilF*37)%96;cx.translate(-o,-(boilF*53)%96);cx.fillStyle=pat;cx.fillRect(0,0,W+96,H+96);cx.restore()}
}

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const tr=track.getBoundingClientRect(),cr=cv.getBoundingClientRect();
  XC=tr.left-cr.left+track.clientWidth/2;
}
let idle=0,lastMid=null,lean=0,face=1,lastKey='',lastLine='';
function frame(now){
  requestAnimationFrame(frame);
  if(document.getElementById('machine').hidden||!cv.clientWidth)return;
  if(cv.clientWidth!==W)resize();
  if(line!==lastLine){lastLine=line;lastMid=null;if(stations.length)layout()}
  if(stations.length&&centers.length!==stations.length)layout();
  boilF=reduce?0:Math.floor(now/1000*BOIL);
  const T=boilF/BOIL;
  const mid=track.scrollLeft+track.clientWidth/2;
  const v=lastMid===null?0:mid-lastMid;lastMid=mid;
  if(Math.abs(v)>.4){face=Math.sign(v);idle=0}else if(++idle>24)face=1;   // when you stop, turn to look at the scene
  lean+=(clamp(v/12,-1,1)-lean)*.16;if(Math.abs(lean)<.001)lean=0;
  const amp=clamp(Math.abs(lean)*3);
  const key=mid.toFixed(1)+'|'+boilF+'|'+lean.toFixed(3)+'|'+W+'|'+line;
  if(key===lastKey)return;lastKey=key;
  draw(mid,T,lean,face,amp);
}
window.addEventListener('resize',()=>{W=0});
requestAnimationFrame(frame);
})();
</script>
