 Indian Ocean to Arabia and East Africa. His treasure ships were much bigger than European ships of that time. He brought back gifts, including a giraffe for the emperor.","whoa":"He made seven voyages between 1405 and 1433.","question":"What animal did Zheng He bring back to China?","answer":"A giraffe","wrong":["A kangaroo","A penguin","A polar bear"],"more":"Zheng He’s largest ships may have been over 100 meters long, though historians debate the size. After the voyages, the Ming emperors stopped sending fleets and focused on threats from the north. Some historians wonder how history would have changed if China had kept exploring.","think":"Was China right to stop exploring the oceans?","sides":["Yes. The voyages were very expensive, and the empire’s real dangers were on land.","No. China gave up the oceans just as Europe started sailing everywhere."]},{"group":2,"year":1429,"approx":false,"kind":"battle","title":"Joan of Arc","story":"During the Hundred Years' War, a French farm girl named Joan said saints told her to save France. She led the army that broke the siege of Orléans. She was later captured and killed, but France honors her as a hero.","whoa":"She was only about 17 when she led the army.","question":"Which city's siege did Joan of Arc break?","answer":"Orléans","wrong":["Paris","London","Rome"],"more":"Joan was captured by allies of England and put on trial for heresy, including wearing men’s clothes. She was burned at 19. Twenty-five years later, a new trial declared her innocent. She was made a saint in 1920.","think":"How should we judge someone who says they hear voices from God?","sides":["Her faith gave France courage, and that matters whatever the source.","Historians can study her actions without deciding whether the voices were real."]},{"group":2,"year":1440,"approx":true,"kind":"invent","title":"Gutenberg's printing press","story":"Johannes Gutenberg in Germany made metal letters that could be moved around and used again. His press printed pages much faster than monks copying by hand. Books got cheaper, and more people learned to read.","whoa":"His most famous book is the Gutenberg Bible, printed around 1455.","question":"What did Gutenberg's press use?","answer":"Movable metal letters","wrong":["Carved stone","Typewriters","Computers"],"more":"Within 50 years, presses across Europe had printed millions of books. Ideas spread faster than any ruler could control, helping the Reformation and the Scientific Revolution. Gutenberg himself lost his business to an investor and died without becoming rich.","think":"Is it good that anyone can publish ideas, even wrong ones?","sides":["Yes. Free printing spread science and freedom of thought.","It also spread lies and hatred. The same is true of the internet today."]},{"group":2,"year":1450,"approx":true,"kind":"build","title":"Machu Picchu and the Inca","story":"The Inca built a huge empire along the Andes mountains in South America. Their roads stretched thousands of miles, with rope bridges over canyons. High in the mountains they built Machu Picchu.","whoa":"The Inca kept records with knotted strings called quipu.","question":"What did the Inca use to keep records?","answer":"Knotted strings","wrong":["Clay tablets","Paper books","Bamboo strips"],"more":"Machu Picchu was likely a royal estate for the emperor Pachacuti. The Inca had no written alphabet, wheels for transport or iron, yet ran an empire of millions. The Spanish never found Machu Picchu, which is why it survived. It became famous after Hiram Bingham publicized it in 1911.","think":"Can a huge empire run without writing?","sides":["The Inca proved it can, using quipu, roads, runners and careful organization.","Maybe quipu really were a kind of writing, and we just cannot read them yet."]},{"group":2,"year":1453,"approx":false,"kind":"battle","title":"Constantinople falls","story":"The Ottoman sultan Mehmed II attacked Constantinople with giant cannons. The walls that had guarded the city for a thousand years were broken. The Byzantine Empire ended and the city became the Ottoman capital.","whoa":"Mehmed's soldiers dragged ships over land on greased logs to get past a chain across the harbor.","question":"Who captured Constantinople in 1453?","answer":"The Ottomans","wrong":["The Vikings","The Mongols","The Romans"],"more":"Mehmed II was 21. His Hungarian engineer, Orban, built a cannon so big it took 60 oxen to pull. Mehmed made the city his capital and allowed Christians and Jews to live there. Some Greek scholars fled to Italy with ancient books, which helped fuel the Renaissance.","think":"Is 1453 an ending or a beginning?","sides":["An ending, of the 1,000-year-old Byzantine Empire.","A beginning, of the Ottoman Empire’s golden age and Istanbul’s new life."]},{"group":2,"year":1492,"approx":false,"kind":"explore","title":"Columbus sails west","story":"Christopher Columbus sailed for Spain hoping to reach Asia by going west. Instead he landed in the Caribbean. His voyages connected Europe and the Americas, which changed both, and brought great suffering to the people already living there.","whoa":"His three ships were the Niña, the Pinta and the Santa María.","question":"Which country paid for Columbus's voyage?","answer":"Spain","wrong":["England","Italy","China"],"more":"Columbus thought Earth was much smaller than it is and died believing he had reached Asia. As governor of Hispaniola, he enslaved and brutally punished the Taíno people. The exchange of plants, animals and diseases between the hemispheres is called the Columbian Exchange.","think":"Should Columbus Day still be celebrated?","sides":["Yes. His voyages were bold and changed history, and the day matters to many Italian Americans.","No. Many places now honor Indigenous Peoples’ Day instead, because of the harm he caused."]},{"group":2,"year":1503,"approx":true,"kind":"idea","title":"Leonardo and the Renaissance","story":"The Renaissance, which means \"rebirth,\" was a time of new art and learning that began in Italy. Leonardo da Vinci painted the Mona Lisa and filled notebooks with ideas for flying machines. Michelangelo spent four years painting the ceiling of the Sistine Chapel.","whoa":"Leonardo wrote many of his notes backwards, in mirror writing.","question":"What does \"Renaissance\" mean?","answer":"Rebirth","wrong":["Darkness","Battle","Journey"],"more":"The Renaissance began in rich Italian city-states like Florence, where families such as the Medici paid artists. Artists studied anatomy and perspective to make paintings look real. Leonardo designed helicopters, tanks and diving suits, but most were never built.","think":"Does genius need rich supporters to flourish?","sides":["Mostly yes. Without the Medici and popes, Leonardo and Michelangelo could not have worked.","No. Genius can come from anywhere, but money decides who gets noticed."]},{"group":2,"year":1517,"approx":false,"kind":"idea","title":"Martin Luther's 95 Theses","story":"Martin Luther, a German monk, thought church leaders were doing wrong things, like selling forgiveness. He wrote 95 arguments called the 95 Theses. This started the Protestant Reformation and split Christians in western Europe.","whoa":"Thanks to printing presses, copies spread across Germany in a few weeks.","question":"What did Martin Luther write?","answer":"The 95 Theses","wrong":["The Magna Carta","The Odyssey","The Declaration of Independence"],"more":"The story that Luther nailed his theses to a church door may not be true. His ideas spread mainly through printing. He translated the Bible into German so ordinary people could read it. The split led to more than a century of religious wars in Europe.","think":"Is it worth splitting a group apart to fix what you think is wrong?","sides":["Yes. Luther believed truth mattered more than unity.","Splits can cause terrible conflict. Reform from inside might have been better."]},{"group":2,"year":1521,"approx":false,"kind":"battle","title":"The fall of the Aztecs","story":"Spanish soldiers led by Hernán Cortés arrived in Mexico. With help from peoples who hated Aztec rule, and with smallpox killing many Aztecs, they captured Tenochtitlan. Spain built Mexico City on its ruins.","whoa":"The Aztecs had never met horses or smallpox before the Spanish came.","question":"Who led the Spanish conquest of the Aztecs?","answer":"Hernán Cortés","wrong":["Columbus","Magellan","Zheng He"],"more":"Cortés had only a few hundred Spanish soldiers, but tens of thousands of allies from peoples like the Tlaxcalans. Smallpox killed perhaps half of Tenochtitlan’s population. Within a century, the Indigenous population of Mexico dropped by as much as 90 percent from war and disease.","think":"Why did so few Spanish defeat such a mighty empire?","sides":["Disease did most of the work, killing millions with no immunity.","Native allies did. Many peoples hated Aztec rule and fought with the Spanish."]},{"group":2,"year":1522,"approx":false,"kind":"explore","title":"Magellan's ship circles the world","story":"Ferdinand Magellan left Spain with five ships to sail around the world. He was killed in the Philippines, but one ship, the Victoria, made it home three years later. Only 18 of about 270 sailors returned.","whoa":"The crew found they had \"lost\" a day by sailing west around the globe.","question":"Which ship made it all the way around the world?","answer":"Victoria","wrong":["Mayflower","Santa María","Titanic"],"more":"Magellan found a passage around South America, now called the Strait of Magellan, and named the Pacific Ocean for its calm waters. Crossing it took months, and sailors ate leather and sawdust. Juan Sebastián Elcano captained the Victoria home after Magellan died.","think":"Who deserves credit for the first trip around the world?","sides":["Magellan, who planned it and led the hardest parts.","Elcano and the 18 survivors, who actually finished it."]},{"group":3,"year":1556,"approx":false,"kind":"ruler","title":"Akbar the Great","story":"Akbar became emperor of Mughal India at age 13. He invited people of many religions to come and debate in his court. He never learned to read, so he had books from his huge library read aloud to him.","whoa":"His court was full of painters who made tiny, detailed pictures for his books.","question":"Which empire did Akbar rule?","answer":"The Mughal Empire","wrong":["The Ottoman Empire","The Persian Empire","The Mongol Empire"],"more":"Akbar ended a special tax on non-Muslims and married a Hindu Rajput princess. He built a hall where Muslims, Hindus, Christians, Jains and Zoroastrians debated. He even started his own blend of beliefs, which few people followed. He also fought many wars to expand his empire.","think":"Can listening to people who disagree make you wiser?","sides":["Yes. Akbar learned from every faith and ruled a diverse empire well.","It can also confuse people. His mixed religion died out quickly."]},{"group":3,"year":1588,"approx":false,"kind":"battle","title":"Elizabeth I and the Armada","story":"Queen Elizabeth I ruled England for 45 years. King Philip II of Spain sent a giant fleet, the Armada, to invade. English ships and stormy weather wrecked it.","whoa":"Elizabeth never married and was called the Virgin Queen. Virginia is named after her.","question":"What was the Spanish fleet called?","answer":"The Armada","wrong":["The Victoria","The Mayflower","The Endeavour"],"more":"Elizabeth gave a famous speech to her troops at Tilbury, saying she had the heart and stomach of a king. Her reign saw Shakespeare, explorers and growing English power. It also saw harsh treatment of Catholics and the beginning of English involvement in the slave trade.","think":"Why do we remember some rulers’ reigns as “golden ages”?","sides":["Because art, exploration and confidence really did flourish.","Because the winners write history and leave out who suffered."]},{"group":3,"year":1599,"approx":false,"kind":"life","title":"Shakespeare's Globe","story":"William Shakespeare wrote plays like Romeo and Juliet and Hamlet. His acting company built the Globe Theatre in London. Poor people paid a penny to stand in the yard and watch.","whoa":"Shakespeare is the first writer we know of to use hundreds of English words, like \"eyeball.\"","question":"What theater is Shakespeare famous for?","answer":"The Globe","wrong":["The Colosseum","The Parthenon","The Bastille"],"more":"In Shakespeare’s day, all the actors were men and boys, who played the women’s roles too. The original Globe burned down in 1613 when a cannon used in a play set the roof on fire. A modern copy opened near the site in 1997. His plays have been translated into over 100 languages.","think":"Why are Shakespeare’s plays still performed 400 years later?","sides":["Because they show feelings everyone has: love, jealousy, ambition and grief.","Because schools keep teaching them. Many great writers from his time are forgotten."]},{"group":3,"year":1603,"approx":false,"kind":"ruler","title":"The Tokugawa shoguns","story":"Tokugawa Ieyasu became shogun and brought peace to Japan after years of war. Later shoguns closed Japan to most foreigners. For more than 200 years Japan stayed mostly cut off from the world.","whoa":"Only a few Dutch and Chinese traders were allowed in, on a tiny island near Nagasaki.","question":"What did the later Tokugawa shoguns do?","answer":"Closed Japan to most foreigners","wrong":["Invaded China","Moved to Europe","Ended the samurai"],"more":"The Tokugawa made lords spend every other year in the capital, Edo (now Tokyo), which kept them busy and broke. Japan had about 250 years of peace. Cities grew, and arts like kabuki theater and woodblock prints flourished. Christianity was banned and Christians persecuted.","think":"Is it better for a country to stay closed and peaceful or open and changing?","sides":["Closed. Japan enjoyed long peace and developed its own culture.","Open. Japan fell behind in technology and was forced open by foreign warships."]},{"group":3,"year":1607,"approx":false,"kind":"explore","title":"Jamestown","story":"English settlers built Jamestown in Virginia, the first lasting English town in America. Many died of hunger and sickness in the first years. The Powhatan people, including the chief's daughter Pocahontas, traded food with them.","whoa":"Pocahontas later sailed to England and met the king.","question":"What was the first lasting English town in America?","answer":"Jamestown","wrong":["Plymouth","Boston","New Amsterdam"],"more":"Jamestown nearly failed. In the “starving time” of 1609–10, most settlers died. The colony survived by growing tobacco to sell in England. In 1619, the first recorded enslaved Africans arrived in Virginia, and Powhatan lands were taken in a series of wars.","think":"Was Jamestown a success?","sides":["Yes. It was the start of English America.","It depends who you ask. For the Powhatan and enslaved Africans, it brought disaster."]},{"group":3,"year":1609,"approx":false,"kind":"invent","title":"Galileo's telescope","story":"Galileo Galilei built a telescope and pointed it at the sky. He saw mountains on the Moon and four moons circling Jupiter. He argued that Earth goes around the Sun, which got him in big trouble with church leaders.","whoa":"Jupiter's four big moons are still called the Galilean moons.","question":"What did Galileo see circling Jupiter?","answer":"Four moons","wrong":["Rings of ice","A comet","A second sun"],"more":"Galileo did not invent the telescope; he improved a Dutch design. In 1633 the Church put him on trial and forced him to say Earth does not move. He spent his last years under house arrest. In 1992, the Pope officially admitted the Church had been wrong.","think":"What should someone do when their discovery goes against powerful beliefs?","sides":["Speak up. The truth matters, even at personal cost.","Be careful and patient. Galileo’s ideas won in the end even after he backed down."]},{"group":3,"year":1620,"approx":false,"kind":"explore","title":"The Mayflower","story":"A group called the Pilgrims sailed to America on the Mayflower so they could worship their own way. They landed at Plymouth in Massachusetts. A Wampanoag man named Squanto helped them learn to plant corn.","whoa":"The trip across the ocean took about 66 days.","question":"What was the Pilgrims' ship called?","answer":"The Mayflower","wrong":["The Victoria","The Golden Hind","The Beagle"],"more":"Before landing, the men on board signed the Mayflower Compact, agreeing to make fair laws together. About half the settlers died the first winter. In 1621 they shared a harvest feast with the Wampanoag, remembered as the first Thanksgiving. Relations later broke down into a terrible war.","think":"How should Thanksgiving remember the Wampanoag?","sides":["As friends who helped the settlers survive, which is worth celebrating.","Honestly, including the land and lives they later lost."]},{"group":3,"year":1632,"approx":false,"kind":"build","title":"The Taj Mahal","story":"Mughal emperor Shah Jahan was heartbroken when his wife Mumtaz Mahal died. He built the Taj Mahal as her tomb, out of white marble set with colored stones. About 20,000 workers built it over about 20 years.","whoa":"The marble seems to change color from pink to white to gold as the sun moves.","question":"Who was the Taj Mahal built for?","answer":"Mumtaz Mahal","wrong":["Queen Elizabeth","Cleopatra","Akbar"],"more":"Shah Jahan spent so much on buildings that his son Aurangzeb overthrew him and imprisoned him in a fort. Legend says Shah Jahan could see the Taj Mahal from his window. Today it is one of the most visited buildings on Earth, and air pollution has been yellowing its marble.","think":"Is a building of love worth the cost to a whole empire?","sides":["Yes. It is one of the most beautiful things people have ever made.","No. The money came from taxes on poor farmers."]},{"group":3,"year":1661,"approx":false,"kind":"ruler","title":"The Kangxi Emperor","story":"Kangxi became emperor of Qing China as a young boy and ruled for 61 years. He loved learning, studied math with European teachers, and ordered a giant dictionary. The Qing rulers were Manchus from the north of China.","whoa":"His dictionary has more than 47,000 characters.","question":"How long did the Kangxi Emperor rule China?","answer":"61 years","wrong":["6 years","16 years","100 years"],"more":"Kangxi was a Manchu, not Han Chinese, yet he won over Chinese scholars by honoring Confucian learning. He toured his empire, fought rebellions and wrote about running the country carefully. Jesuit priests from Europe taught him math, astronomy and music.","think":"What makes a ruler from a different group accepted by the people?","sides":["Respecting local culture, as Kangxi did by studying Confucian classics.","Peace and good harvests. People mostly want a ruler who keeps life stable."]},{"group":3,"year":1666,"approx":false,"kind":"life","title":"The Great Fire of London","story":"A fire started in a bakery on Pudding Lane and burned for four days. It destroyed most of the old city of London, including St. Paul's Cathedral. The city was rebuilt with brick and stone instead of wood.","whoa":"A man named Samuel Pepys buried his cheese in his garden to save it from the fire.","question":"Where did the Great Fire of London start?","answer":"A bakery","wrong":["A church","The palace","A ship"],"more":"Only a handful of deaths were recorded, though the true number may be higher. About 13,000 houses burned and 70,000 people lost their homes. Architect Christopher Wren rebuilt 51 churches, including the new St. Paul’s Cathedral. London also started its first fire insurance companies.","think":"Can a disaster make a city better?","sides":["Yes. London was rebuilt safer, with brick and wider streets.","That is easy to say later. Thousands lost everything they owned."]},{"group":3,"year":1682,"approx":false,"kind":"ruler","title":"Louis XIV at Versailles","story":"Louis XIV of France called himself the Sun King. He moved his court to the enormous Palace of Versailles. Nobles had to live there so he could keep an eye on them.","whoa":"He was king for 72 years, longer than any other European ruler.","question":"What did Louis XIV call himself?","answer":"The Sun King","wrong":["The Lion King","The Great","The Conqueror"],"more":"Versailles had over 2,000 rooms and gardens with 1,400 fountains. Nobles competed for tiny honors, like handing the king his shirt in the morning. Louis said he ruled by divine right, given by God. His wars and building left France deep in debt, one cause of the French Revolution.","think":"Should a ruler’s power come from God, from the people, or from the law?","sides":["Louis believed in divine right: kings answer only to God.","Later thinkers argued power must come from the people and be limited by law."]},{"group":3,"year":1687,"approx":false,"kind":"idea","title":"Newton's laws","story":"Isaac Newton explained gravity, the pull that makes apples fall and keeps the Moon going around Earth. He wrote three laws of motion that describe how things move. Scientists still use them to launch rockets.","whoa":"Newton also figured out that white light is made of all the colors of the rainbow.","question":"What force did Newton explain?","answer":"Gravity","wrong":["Magnetism","Electricity","Wind"],"more":"Newton did much of his best work at age 23, when Cambridge closed because of plague. His book, the Principia, showed that the same laws apply on Earth and in space. He also argued bitterly with other scientists over who discovered calculus first.","think":"Can one person really change how everyone sees the universe?","sides":["Yes. Newton’s laws gave the world a new way to understand everything.","He said himself he stood on the shoulders of giants. Science is teamwork over centuries."]},{"group":3,"year":1703,"approx":false,"kind":"build","title":"Peter the Great builds St. Petersburg","story":"Peter the Great wanted Russia to be modern like western Europe. He traveled in disguise to learn how to build ships. Then he built a new capital, St. Petersburg, on swampy land by the sea.","whoa":"He made nobles shave their beards or pay a beard tax.","question":"What city did Peter the Great build?","answer":"St. Petersburg","wrong":["Moscow","Kyiv","Berlin"],"more":"Peter worked in a Dutch shipyard under a fake name to learn shipbuilding. Tens of thousands of forced laborers built St. Petersburg in swampy, cold land, and many died. He made Russia a major European power and moved the capital there.","think":"Is it right to force a country to modernize quickly?","sides":["Peter made Russia stronger and more respected.","Forcing change by cruelty causes great suffering and resentment."]},{"group":3,"year":1769,"approx":false,"kind":"invent","title":"Steam engines and factories","story":"James Watt improved the steam engine so it could power machines. Soon factories with steam-powered machines were making cloth faster than ever. This big change is called the Industrial Revolution.","whoa":"The watt, the unit of power printed on light bulbs, is named after him.","question":"What did James Watt improve?","answer":"The steam engine","wrong":["The telescope","The printing press","The compass"],"more":"Factories made goods cheaper, but early workers, including young children, labored 12 to 16 hours a day in dangerous conditions. Cities grew crowded and polluted. Over time, laws limited child labor and workers formed unions. Burning coal also began adding carbon dioxide to the air.","think":"Was the Industrial Revolution good for ordinary people?","sides":["Yes, in the long run. It led to cheaper goods, better health and longer lives.","Not at first. Many workers, including children, lived in misery for generations."]},{"group":3,"year":1770,"approx":false,"kind":"explore","title":"Captain Cook reaches Australia","story":"James Cook explored the Pacific Ocean in his ship Endeavour. He mapped New Zealand and the east coast of Australia. Aboriginal people had already lived in Australia for tens of thousands of years.","whoa":"A goat on board had already sailed around the world once before.","question":"What was Captain Cook's ship called?","answer":"Endeavour","wrong":["Mayflower","Victoria","Beagle"],"more":"Cook made three voyages and mapped coasts from New Zealand to Alaska. He was a skilled navigator who kept his crews healthy with fresh food. His arrival led to British colonization, which took land from Aboriginal and Torres Strait Islander peoples. He was killed in Hawaiʻi in 1779.","think":"Should Cook be remembered as an explorer or as the start of colonization?","sides":["An explorer. His maps and science were remarkable.","As both. His voyages led directly to the loss of Indigenous lands."]},{"group":3,"year":1776,"approx":false,"kind":"idea","title":"The Declaration of Independence","story":"Thirteen American colonies decided to break away from Britain. Thomas Jefferson wrote the Declaration of Independence, which said all men are created equal. It was approved on July 4, 1776.","whoa":"George Washington led the American army in the war that followed.","question":"Who wrote the Declaration of Independence?","answer":"Thomas Jefferson","wrong":["George Washington","Benjamin Franklin","King George III"],"more":"The Declaration said all men are created equal, but Jefferson and many signers enslaved people. Women could not vote, and Indigenous peoples were described harshly. Later movements, from abolitionists to civil rights leaders, used the Declaration’s own words to demand those rights for everyone.","think":"Can a document be great if the people who wrote it did not live up to it?","sides":["Yes. Its ideals were so powerful that later people used them to fight for equality.","Its words rang hollow for those who were enslaved at the time."]},{"group":3,"year":1789,"approx":false,"kind":"battle","title":"The French Revolution","story":"French people were hungry and angry about unfair taxes. A crowd stormed the Bastille prison in Paris. King Louis XVI and Queen Marie Antoinette lost their thrones and later their lives.","whoa":"France celebrates Bastille Day every July 14.","question":"What prison did the crowd storm?","answer":"The Bastille","wrong":["The Tower of London","Alcatraz","Versailles"],"more":"The revolution produced the Declaration of the Rights of Man and ended noble privileges. Then came the Reign of Terror, when about 17,000 people were officially executed, many by guillotine. It ended with Napoleon taking power. Its slogan, “Liberty, Equality, Fraternity,” is still France’s motto.","think":"Can a fight for freedom go too far?","sides":["Yes. The Terror killed thousands in the name of liberty.","The old system was so unfair that change could not have come peacefully."]},{"group":3,"year":1804,"approx":false,"kind":"ruler","title":"Napoleon crowns himself","story":"Napoleon Bonaparte was a French general who won battle after battle. In 1804 he became Emperor of France and put the crown on his own head. He was finally beaten at Waterloo in 1815.","whoa":"Napoleon was not short. He was about average height for his time.","question":"Where was Napoleon finally defeated?","answer":"Waterloo","wrong":["Hastings","Orléans","Gettysburg"],"more":"Napoleon created the Napoleonic Code, laws that treated men equally before the law and still influence many countries. But his wars killed millions, and he brought back slavery in French colonies in 1802. After Waterloo he was exiled to a tiny island in the Atlantic, where he died.","think":"Was Napoleon a hero or a tyrant?","sides":["A hero to many. He spread fair laws and ended old privileges across Europe.","A tyrant. He crowned himself, waged endless war and restored slavery."]},{"group":3,"year":1804,"approx":false,"kind":"battle","title":"Haiti wins its freedom","story":"On the island of Saint-Domingue, enslaved people rose up against French rule. Led by Toussaint Louverture and then Jean-Jacques Dessalines, they won. Haiti became the first nation founded by people who freed themselves from slavery.","whoa":"Haiti was the second independent country in the Americas, after the United States.","question":"Who led the revolution in Haiti?","answer":"Toussaint Louverture","wrong":["Napoleon","Simón Bolívar","George Washington"],"more":"Haiti’s revolution was the only successful uprising of enslaved people to create a nation. France demanded Haiti pay a huge sum for its lost “property” in 1825, a debt Haiti paid for over a century. Many historians link that debt to Haiti’s poverty today.","think":"Should a country ever pay for wrongs done long ago?","sides":["Yes. The harm still affects people today, so repair is fair.","It is complicated. The people who did the wrong are long gone."]},{"group":3,"year":1805,"approx":false,"kind":"explore","title":"Lewis and Clark","story":"Meriwether Lewis and William Clark led a team across North America to the Pacific Ocean. A Shoshone woman named Sacagawea helped guide them and translate. They reached the Pacific in November 1805.","whoa":"They described around 300 plants and animals that scientists had never recorded.","question":"Who helped guide Lewis and Clark?","answer":"Sacagawea","wrong":["Pocahontas","Squanto","Harriet Tubman"],"more":"The trip was ordered by President Jefferson after the U.S. bought the Louisiana Territory from France. Sacagawea traveled with her baby, which showed Indigenous nations the group came in peace. The expedition opened the way for American settlement, which pushed many nations off their lands.","think":"Why was Sacagawea so important to the expedition?","sides":["Her language skills and knowledge helped them survive and trade.","Her presence signaled peace, which may have mattered even more."]},{"group":3,"year":1819,"approx":false,"kind":"battle","title":"Simón Bolívar","story":"Simón Bolívar led armies to free much of South America from Spanish rule. He marched his troops over the freezing Andes mountains to surprise the Spanish. People call him El Libertador, the Liberator.","whoa":"The country of Bolivia is named after him.","question":"Which country is named after Simón Bolívar?","answer":"Bolivia","wrong":["Brazil","Chile","Peru"],"more":"Bolívar helped free what are now Venezuela, Colombia, Ecuador, Peru, Panama and Bolivia. He dreamed of one united South American country, Gran Colombia, but it broke apart. He freed people he had enslaved, though slavery lasted for decades in some countries he freed.","think":"Why do new countries often split apart after winning independence?","sides":["Different regions want different things once a common enemy is gone.","Leaders compete for power, and there is no strong system to settle it."]},{"group":4,"year":1848,"approx":false,"kind":"explore","title":"The California Gold Rush","story":"Gold was found at Sutter's Mill in California. Thousands of people rushed west hoping to get rich. They were called forty-niners because so many arrived in 1849.","whoa":"Most miners never got rich, but plenty of people selling them shovels and pants did.","question":"What were the gold rush miners called?","answer":"Forty-niners","wrong":["Pilgrims","Vikings","Rough Riders"],"more":"About 300,000 people rushed to California, from as far as China, Chile and Australia. San Francisco grew from about 1,000 people to 25,000 in two years. For California’s Native peoples it was a catastrophe: violence, disease and loss of land killed most of them within a few decades.","think":"Who really got rich from the gold rush?","sides":["People who sold supplies, like shovels, food and jeans, made the steadiest money.","Land and railway owners. The biggest winners built businesses that lasted."]},{"group":4,"year":1837,"approx":false,"kind":"ruler","title":"Queen Victoria","story":"Victoria became queen of Britain at 18 and ruled for 63 years. Her empire grew so big people said the sun never set on it. This time is called the Victorian era.","whoa":"She had nine children, and her grandchildren became kings and queens all over Europe.","question":"How long did Queen Victoria rule?","answer":"63 years","wrong":["10 years","100 years","5 years"],"more":"Railways, telegraphs, photography and public schools spread during her reign. Britain ruled about a quarter of the world’s people, often through force. After her husband Albert died, Victoria wore black for the rest of her life, 40 years.","think":"Can an empire bring progress and harm at the same time?","sides":["Yes. Britain built railways and schools in its colonies.","The harm was too great: famines, violence and lost freedom outweigh the railways."]},{"group":4,"year":1839,"approx":false,"kind":"battle","title":"The Opium War","story":"British merchants sold a harmful drug called opium in China. When China tried to stop it, Britain went to war and won. China had to hand over Hong Kong.","whoa":"Britain gave Hong Kong back to China in 1997.","question":"What did China give Britain after the Opium War?","answer":"Hong Kong","wrong":["Beijing","Taiwan","Shanghai"],"more":"Britain wanted Chinese tea, silk and porcelain but had little China wanted to buy, so merchants smuggled opium from India. Millions of Chinese became addicted. China calls the period that followed the “century of humiliation.”","think":"Is it ever right to force another country to trade?","sides":["No. Each country should decide what it buys, especially something harmful.","British leaders claimed free trade was a right. Most historians today see that as an excuse."]},{"group":4,"year":1845,"approx":false,"kind":"life","title":"The Irish Potato Famine","story":"A disease called blight rotted Ireland's potatoes, the main food for poor families. About a million people died of hunger. More than a million more left for America and other places.","whoa":"Today there are far more people of Irish background in America than in Ireland.","question":"What crop failed in the Irish famine?","answer":"Potatoes","wrong":["Rice","Wheat","Corn"],"more":"Ireland kept exporting grain and meat to Britain even as people starved. The British government’s help was slow and limited, partly because officials believed the market should fix things. Ireland’s population fell by about a quarter, and many Irish today still remember the famine with anger.","think":"Was the famine only a natural disaster?","sides":["The blight was natural, and no one could have stopped the disease itself.","The deaths were made worse by government choices, so it was also a human disaster."]},{"group":4,"year":1850,"approx":true,"kind":"idea","title":"Harriet Tubman","story":"Harriet Tubman escaped slavery, then went back again and again to lead others north to freedom. The secret network of safe houses and helpers was called the Underground Railroad. She said she never lost a passenger.","whoa":"During the Civil War she worked as a scout and spy for the Union army.","question":"What was the Underground Railroad?","answer":"A secret escape network","wrong":["A real subway","A train company","A gold mine"],"more":"Tubman made about 13 trips back into Maryland and guided around 70 people to freedom, including her family. Slave owners offered rewards for her capture. During the Civil War she helped lead a raid that freed over 700 people. Many freedom seekers made it to Canada, including St. Catharines, Ontario, where Tubman lived for a time.","think":"What gives someone the courage to go back into danger for others?","sides":["Love for family and people still enslaved.","Faith. Tubman said God guided her journeys."]},{"group":4,"year":1861,"approx":false,"kind":"battle","title":"The American Civil War","story":"Southern states left the United States, mainly to keep slavery. President Abraham Lincoln led the North to hold the country together. After four years of war, the North won and slavery ended.","whoa":"Lincoln's Gettysburg Address is only about 270 words long.","question":"Who was president during the Civil War?","answer":"Abraham Lincoln","wrong":["George Washington","Thomas Jefferson","Theodore Roosevelt"],"more":"About 620,000 to 750,000 soldiers died, more than in any other American war. Lincoln’s Emancipation Proclamation in 1863 freed enslaved people in Confederate states, and almost 200,000 Black soldiers fought for the Union. Lincoln was assassinated days after the war ended.","think":"Why do people still argue about how to remember the Civil War?"},{"group":4,"year":1868,"approx":false,"kind":"idea","title":"Japan's Meiji era","story":"After American warships forced Japan to open its ports, Japan decided to change fast. The young Emperor Meiji took power back from the shogun. Japan built railways, factories and schools in just a few decades.","whoa":"The samurai class was ended, and samurai were no longer allowed to wear swords in public.","question":"Who took power back from the shogun in 1868?","answer":"Emperor Meiji","wrong":["Tokugawa Ieyasu","Kublai Khan","Genghis Khan"],"more":"Japan sent officials around the world to study the best schools, armies and factories, then copied what worked. In about 40 years it went from closed and feudal to an industrial power that beat Russia in a war in 1905. It also built its own empire, taking Korea and Taiwan.","think":"Is copying other countries a smart way to change?","sides":["Yes. Japan learned quickly and avoided being colonized.","It cost Japan parts of its traditions, and some people felt it lost its identity."]},{"group":4,"year":1869,"approx":false,"kind":"build","title":"The Suez Canal opens","story":"Workers dug a canal across Egypt to connect the Mediterranean Sea and the Red Sea. Ships no longer had to sail all the way around Africa to reach Asia. The trip from London to India got thousands of miles shorter.","whoa":"The canal has no locks, because the two seas are almost the same height.","question":"Which two seas does the Suez Canal connect?","answer":"Mediterranean and Red","wrong":["Black and Caspian","Red and Dead","Baltic and North"],"more":"The canal took 10 years to dig, much of it by forced Egyptian labor, and many workers died. Britain later took control of it. In 1956, Egypt nationalized the canal, causing an international crisis. About 12 percent of world trade still passes through it.","think":"Who should control important routes like canals?","sides":["The country they run through. It is their land.","An international group, because the whole world depends on them."]},{"group":4,"year":1876,"approx":false,"kind":"invent","title":"The telephone","story":"Alexander Graham Bell, a teacher of deaf students, invented the telephone. His first words on it called his assistant, Mr. Watson, to come to him. Soon telephone wires stretched across cities.","whoa":"Bell thought people might answer the phone by saying \"ahoy.\"","question":"Who invented the telephone?","answer":"Alexander Graham Bell","wrong":["Thomas Edison","The Wright brothers","Henry Ford"],"more":"Elisha Gray filed a design for a telephone on the same day as Bell, and Italian inventor Antonio Meucci had worked on one years earlier. Bell won the legal fights. In 1915, Bell made the first call across the U.S. Bell also lived and experimented in Brantford, Ontario.","think":"Who deserves credit when several people invent something at the same time?","sides":["Whoever gets it working and patented first, like Bell.","All of them. Inventions usually come from many minds."]},{"group":4,"year":1884,"approx":false,"kind":"idea","title":"The scramble for Africa","story":"At a meeting in Berlin, European countries divided Africa among themselves without asking any Africans. By 1914, almost all of Africa was ruled by Europeans. Only Ethiopia and Liberia stayed independent.","whoa":"Ethiopia defeated an Italian army at the Battle of Adwa in 1896.","question":"Which African country beat an Italian army and stayed free?","answer":"Ethiopia","wrong":["Egypt","Kenya","Congo"],"more":"European borders cut across African nations and languages, putting rivals together and splitting peoples apart. In the Congo, King Leopold II of Belgium ran a colony where millions died from forced labor. Most African countries won independence between the 1950s and 1970s.","think":"How do borders drawn long ago still affect people today?","sides":["They cause conflict, splitting peoples who belong together.","Countries have built identities within these borders, so changing them now could cause more trouble."]},{"group":4,"year":1903,"approx":false,"kind":"invent","title":"The Wright brothers fly","story":"Orville and Wilbur Wright ran a bicycle shop in Ohio. At Kitty Hawk, North Carolina, they flew the first powered airplane. The first flight lasted 12 seconds.","whoa":"Just 66 years later, people walked on the Moon.","question":"How long did the first airplane flight last?","answer":"12 seconds","wrong":["12 minutes","12 hours","2 seconds"],"more":"The Wrights tested more than 200 wing shapes in a homemade wind tunnel. Their key idea was steering by twisting the wings, called wing warping. They flew four times that first day; the longest flight lasted 59 seconds. Many people did not believe them for years.","think":"Why did two bicycle makers succeed where famous scientists failed?","sides":["They tested carefully and learned from every crash.","Their bike work taught them about balance and control, which flying needs."]},{"group":4,"year":1912,"approx":false,"kind":"life","title":"The Titanic sinks","story":"The Titanic was the biggest ship of its time, and people said it could not sink. On its first trip it hit an iceberg in the North Atlantic and sank. More than 1,500 people died, partly because there were not enough lifeboats.","whoa":"After this, ships had to carry enough lifeboats for everyone on board.","question":"What did the Titanic hit?","answer":"An iceberg","wrong":["A whale","Another ship","A reef"],"more":"Lifeboats could hold only about half the people aboard. Third-class passengers were least likely to survive, partly because they were deep in the ship. Another ship nearby, the Californian, did not respond in time. The wreck was found in 1985, about 3,800 meters down.","think":"Why were some passengers more likely to survive than others?","sides":["Class. First-class passengers were closer to the lifeboats and got help first.","The “women and children first” rule meant most men died, whatever their class."]},{"group":4,"year":1914,"approx":false,"kind":"battle","title":"World War I","story":"Many European countries went to war after an Austrian archduke was assassinated. Soldiers dug long trenches and fought for years without moving far. New weapons like tanks, airplanes and poison gas made it terrible.","whoa":"On Christmas 1914, some soldiers stopped fighting and played soccer between the trenches.","question":"What did soldiers dig in World War I?","answer":"Trenches","wrong":["Canals","Pyramids","Tunnels to China"],"more":"About 20 million people died, soldiers and civilians. Canada’s victory at Vimy Ridge in 1917 became a national symbol. Many hoped it would be “the war to end all wars,” but the harsh peace treaty with Germany helped lead to World War II.","think":"How did a single assassination lead to a world war?","sides":["Alliances. Countries had promised to defend each other, so one fight dragged in many.","The countries were already ready for war; the assassination was just the spark."]},{"group":4,"year":1917,"approx":false,"kind":"idea","title":"The Russian Revolution","story":"Russians were starving during World War I. They overthrew their ruler, Tsar Nicholas II. Vladimir Lenin and the communists took over, and Russia became part of the Soviet Union.","whoa":"The Soviet Union is often called the USSR.","question":"Who led the communists in the Russian Revolution?","answer":"Lenin","wrong":["Napoleon","Peter the Great","Gandhi"],"more":"Lenin promised “peace, land and bread.” The communists killed the Tsar and his family and won a brutal civil war. Communism promised equality, but the Soviet Union became a one-party state where opponents were jailed or killed, especially under Stalin.","think":"Why do revolutions that promise freedom sometimes end in less freedom?"},{"group":4,"year":1920,"approx":false,"kind":"idea","title":"Women win the vote","story":"Women in many countries marched and protested for the right to vote. They were called suffragists or suffragettes. In 1920, the 19th Amendment gave American women the vote.","whoa":"New Zealand was the first country to let women vote, in 1893.","question":"Which country let women vote first?","answer":"New Zealand","wrong":["The United States","France","Egypt"],"more":"Women in Canada won the federal vote in 1918, though many Asian Canadian and Indigenous women waited decades longer. Suffragettes in Britain broke windows and went on hunger strikes. Saudi Arabia let women vote for the first time in 2015.","think":"Why did it take so long for women to win the vote?","sides":["Men in power did not want to share it.","Many people, including some women, believed politics was not women’s role."]},{"group":4,"year":1922,"approx":false,"kind":"explore","title":"King Tut's tomb is found","story":"Archaeologist Howard Carter searched Egypt's Valley of the Kings for years. Then he found steps leading to the tomb of Tutankhamun, still full of treasure. Remember the boy king from Volume 1? This is him, found more than 3,000 years later.","whoa":"Carter said he could see \"wonderful things\" when he first peeked in.","question":"Who found King Tut's tomb?","answer":"Howard Carter","wrong":["Napoleon","Marco Polo","Captain Cook"],"more":"Carter found over 5,000 objects, including chariots, beds, games and the golden mask. Lord Carnarvon, who paid for the dig, died months later, starting stories of a “curse.” Scientists think he died from an infected mosquito bite. Most of the team lived long lives.","think":"Why do people love stories about curses?","sides":["They make history thrilling and mysterious.","People look for patterns, even in coincidences."]},{"group":4,"year":1929,"approx":false,"kind":"life","title":"The Great Depression","story":"The stock market in New York crashed, and banks and businesses failed. Millions of people around the world lost their jobs. On the American plains, drought and wind turned farms into the Dust Bowl.","whoa":"Dust storms blew dirt from Oklahoma all the way to the East Coast.","question":"What started the Great Depression?","answer":"A stock market crash","wrong":["A war","A volcano","A plague"],"more":"At its worst, about a quarter of American and Canadian workers had no job. People waited in breadlines and lived in shantytowns. U.S. President Franklin Roosevelt started the New Deal, creating jobs building roads and dams. The Depression only fully ended with World War II.","think":"Should governments step in when the economy crashes?","sides":["Yes. Government jobs and aid helped millions survive.","Some economists argue too much government action slowed recovery."]},{"group":4,"year":1930,"approx":false,"kind":"idea","title":"Gandhi's Salt March","story":"Britain made it illegal for Indians to make their own salt. Mohandas Gandhi walked about 240 miles to the sea and picked up natural salt to break the law peacefully. His nonviolent protests helped India win independence.","whoa":"The march took 24 days, and thousands of people joined him on the way.","question":"How did Gandhi protest?","answer":"Without violence","wrong":["With armies","With bombs","In secret only"],"more":"Over 60,000 people were arrested, including Gandhi. Gandhi’s nonviolence inspired Martin Luther King Jr. and Nelson Mandela. India won independence in 1947, but Gandhi was assassinated the next year by a Hindu extremist who opposed his tolerance of Muslims.","think":"Is nonviolent protest the best way to fight injustice?","sides":["Yes. It wins public support and avoids hatred.","Not always. Some, like Mandela, decided violence was necessary when peaceful protest was crushed."]},{"group":4,"year":1939,"approx":false,"kind":"battle","title":"World War II","story":"Germany, led by Adolf Hitler and the Nazis, invaded Poland. Soon most of the world was at war. The Allies, including Britain, the Soviet Union and the United States, defeated Germany and Japan in 1945.","whoa":"The Nazis murdered millions of people, including six million Jews. This is called the Holocaust.","question":"Which country did Germany invade to start World War II?","answer":"Poland","wrong":["France","Russia","England"],"more":"About 70 to 85 million people died, most of them civilians. Over a million Canadians served. The war ended in Europe in May 1945 and in Asia in August, after the U.S. dropped atomic bombs on Hiroshima and Nagasaki. The world created new organizations to try to prevent another such war.","think":"Why is it important to remember the Holocaust?"},{"group":4,"year":1945,"approx":false,"kind":"idea","title":"The United Nations","story":"After World War II, countries wanted to stop wars before they started. They formed the United Nations, where countries meet to talk through problems. Its headquarters is in New York City.","whoa":"It started with 51 countries. Today it has 193.","question":"Where is the headquarters of the United Nations?","answer":"New York City","wrong":["London","Paris","Geneva"],"more":"The UN Security Council has five permanent members, the U.S., Russia, China, Britain and France, and any one can block decisions. UN agencies fight hunger, help refugees and vaccinate children. Canadian Lester Pearson helped invent UN peacekeeping and won the Nobel Peace Prize in 1957.","think":"Should five countries have the power to block what the rest of the world wants?","sides":["Yes. Major powers must agree or the UN could not enforce anything.","No. It is unfair, and it often stops the UN from acting."]},{"group":4,"year":1947,"approx":false,"kind":"ruler","title":"India and Pakistan are born","story":"Britain finally gave India its independence. The land was split into two countries, India and Pakistan. Millions of people moved across the new borders, and there was terrible violence.","whoa":"India is now the country with the most people in the world.","question":"Which two countries were formed when British India became free?","answer":"India and Pakistan","wrong":["India and China","Pakistan and Iran","India and Nepal"],"more":"Partition was drawn up in about five weeks by a British lawyer who had never been to India. Up to 15 million people moved and between several hundred thousand and two million were killed. India and Pakistan have fought several wars since, mostly over Kashmir.","think":"Was splitting India the right solution?","sides":["Many Muslim leaders feared being a small minority, and wanted their own country.","Gandhi opposed it, and the rushed split caused terrible violence."]},{"group":4,"year":1949,"approx":false,"kind":"ruler","title":"Mao and Communist China","story":"After a long civil war, Mao Zedong and the Communists won control of China. He declared the People's Republic of China. The losing side moved to the island of Taiwan.","whoa":"Mao's face is still on all Chinese paper money.","question":"Who declared the People's Republic of China?","answer":"Mao Zedong","wrong":["The Kangxi Emperor","Confucius","Sun Yat-sen"],"more":"Mao’s Great Leap Forward tried to industrialize China fast and caused a famine in which tens of millions died. His Cultural Revolution attacked teachers, artists and old traditions. Later leaders kept the Communist Party in power but opened China’s economy, making it the world’s second-largest.","think":"How should a country remember a leader with such a mixed record?"},{"group":4,"year":1955,"approx":false,"kind":"idea","title":"Rosa Parks","story":"In Montgomery, Alabama, buses had separate seats for Black and white riders. Rosa Parks refused to give up her seat to a white passenger and was arrested. Black citizens stopped riding the buses for over a year, and Martin Luther King Jr. became a leader of the civil rights movement.","whoa":"The bus boycott lasted 381 days.","question":"What city was Rosa Parks's bus in?","answer":"Montgomery","wrong":["New York","Chicago","Boston"],"more":"Rosa Parks was a trained civil rights activist, not just a tired seamstress. Others, like 15-year-old Claudette Colvin, had refused to give up seats months earlier. The Supreme Court ruled bus segregation illegal in 1956. In Canada, Viola Desmond refused to leave a whites-only section of a theater in 1946; she is on the $10 bill.","think":"Why is Rosa Parks remembered more than Claudette Colvin?","sides":["Leaders chose Parks as a respected adult who could rally support.","History often simplifies, and Colvin deserves much more credit than she got."]},{"group":4,"year":1957,"approx":false,"kind":"invent","title":"Sputnik","story":"The Soviet Union launched Sputnik, the first satellite, into space. It was about the size of a beach ball and beeped as it circled Earth. The Space Race between the USSR and the USA had begun.","whoa":"In 1961, Yuri Gagarin became the first person in space.","question":"What was the first satellite called?","answer":"Sputnik","wrong":["Apollo","Hubble","Voyager"],"more":"Sputnik shocked Americans, who feared the Soviets could also launch missiles. The U.S. created NASA in 1958 and spent heavily on science education. A month after Sputnik, the Soviets sent a dog named Laika into orbit; she did not survive.","think":"Is competition good for science?","sides":["Yes. The Space Race got humans to the Moon in just 12 years.","Competition wasted money and risked lives. Cooperation, like the space station, can work better."]},{"group":4,"year":1969,"approx":false,"kind":"explore","title":"People walk on the Moon","story":"Apollo 11 carried three astronauts to the Moon. Neil Armstrong and Buzz Aldrin walked on its surface while Michael Collins circled above. About 600 million people watched on TV.","whoa":"Their footprints are probably still there, because the Moon has no wind.","question":"Who was the first person to walk on the Moon?","answer":"Neil Armstrong","wrong":["Buzz Aldrin","Yuri Gagarin","Michael Collins"],"more":"Twelve astronauts walked on the Moon between 1969 and 1972, all American men. They brought back 382 kilograms of Moon rock. Hundreds of thousands of people worked on Apollo, including mathematicians like Katherine Johnson. The program cost about $25 billion then, hundreds of billions today.","think":"Was going to the Moon worth the cost?","sides":["Yes. It inspired the world and led to new technology.","Some argued at the time that the money should have fought poverty on Earth."]},{"group":4,"year":1989,"approx":false,"kind":"idea","title":"The Berlin Wall falls","story":"After World War II, Germany was split in two, and in 1961 a wall was built right through Berlin. In 1989, huge crowds gathered and the guards opened the gates. People climbed the wall and chipped off pieces.","whoa":"Germany became one country again in 1990.","question":"What city was split by a wall?","answer":"Berlin","wrong":["Paris","London","Moscow"],"more":"The wall was built to stop East Germans fleeing to the West. At least 140 people were killed trying to cross. It opened partly by accident, when an official mistakenly announced at a press conference that travel rules were changing immediately.","think":"Why do walls built to keep people in usually fail?","sides":["People want freedom, and that desire is hard to stop forever.","Governments that need walls are often weak in other ways too."]},{"group":4,"year":1991,"approx":false,"kind":"ruler","title":"The Soviet Union ends","story":"The Soviet Union had been a huge communist country for almost 70 years. In 1991 it broke apart into 15 separate countries, including Russia and Ukraine. The Cold War between the USSR and the USA was over.","whoa":"The Soviet Union covered about one sixth of all the land on Earth.","question":"How many countries did the Soviet Union break into?","answer":"15","wrong":["2","50","4"],"more":"Leader Mikhail Gorbachev tried reforms called glasnost (openness) and perestroika (restructuring). Republics declared independence one after another. Many people gained freedom, but the 1990s brought hard times for millions of Russians, with jobs and savings lost.","think":"Why did the Soviet Union end mostly without a big war?","sides":["Gorbachev chose not to use the army to keep the republics.","The system was too broke and weak to fight back."]},{"group":4,"year":1994,"approx":false,"kind":"ruler","title":"Nelson Mandela","story":"South Africa had unfair laws called apartheid that kept people apart by race. Nelson Mandela fought apartheid and spent 27 years in prison. In 1994 he was elected South Africa's first Black president.","whoa":"He won the Nobel Peace Prize in 1993.","question":"How long was Nelson Mandela in prison?","answer":"27 years","wrong":["2 years","50 years","10 years"],"more":"After apartheid, South Africa set up the Truth and Reconciliation Commission. People who confessed political crimes could get amnesty, so victims learned what happened but many abusers were not punished. Mandela served one term as president and then stepped down.","think":"After great injustice, what matters more: forgiveness or punishment?","sides":["Forgiveness. Mandela’s approach helped avoid civil war.","Justice. Some victims felt the guilty got off too easily."]},{"group":1,"year":-2500,"approx":true,"kind":"build","title":"Stonehenge","story":"On a plain in southern England, people raised a giant ring of standing stones. The biggest weigh as much as several elephants. The stones line up with the sunrise on the longest day of the year.","whoa":"Some of the smaller “bluestones” were dragged all the way from Wales, more than 200 kilometers away.","question":"Where did Stonehenge’s bluestones come from?","answer":"Wales","wrong":["France","Egypt","Iceland"],"more":"Stonehenge was built in stages over about 1,500 years. People without metal tools or wheels moved and raised the stones, likely with sledges, ropes and lots of helpers. Nearby, archaeologists found evidence of huge feasts held at midwinter.","think":"Why would people spend centuries building something like Stonehenge?","sides":["For religion, to honor ancestors or the sun at key times of year.","For community. Building it together may have mattered as much as the finished monument."]},{"group":1,"year":-1177,"approx":true,"kind":"life","title":"Bronze Age kingdoms fall","story":"Around this time, many great kingdoms around the Mediterranean collapsed within a few decades. Droughts, earthquakes and raiders that the Egyptians called the Sea Peoples all played a part. Some kingdoms, like the Hittites, vanished completely.","whoa":"Pharaoh Ramesses III carved pictures of his sea battle against the Sea Peoples on his temple walls.","question":"What did the Egyptians call the mysterious raiders?","answer":"The Sea Peoples","wrong":["The Vikings","The Huns","The Mongols"],"more":"Bronze is made from copper and tin, which came from far apart. When trade routes broke, kingdoms could not make weapons or tools. Writing disappeared in Greece for about 400 years. Afterward, iron, which is easier to find, spread widely.","think":"Could something like the Bronze Age collapse happen to us?","sides":["Yes. Our world also depends on long trade chains that can break.","Less likely. We share knowledge widely now, so it would be hard to lose it all."]},{"group":1,"year":-750,"approx":true,"kind":"idea","title":"Homer’s great poems","story":"A poet named Homer is said to have composed two long poems, the Iliad and the Odyssey. They tell of the Trojan War and the hero Odysseus’s long trip home. For generations, singers recited them from memory.","whoa":"You can read Homer’s tales on the Myths & Legends line of this app.","question":"Which poem tells of Odysseus’s journey home?","answer":"The Odyssey","wrong":["The Iliad","Gilgamesh","The Aeneid"],"more":"Poets probably sang these stories for generations before they were written down, changing details as they went. Some scholars doubt Homer was one person. The poems became the core of Greek education, and Greeks quoted them the way people quote famous books and movies today.","think":"Does it matter if Homer was a real person?","sides":["Yes. Knowing the author helps us understand the work and when it was made.","No. The stories matter, whoever told them, and many voices may have shaped them."]},{"group":1,"year":-432,"approx":false,"kind":"build","title":"The Parthenon","story":"The people of Athens finished a great marble temple on a hill called the Acropolis. It honored Athena, the goddess their city was named after. Inside stood a giant statue of her covered in gold and ivory.","whoa":"The Parthenon has almost no perfectly straight lines. Its columns bulge slightly so they look straight from far away.","question":"Which goddess was the Parthenon built for?","answer":"Athena","wrong":["Hera","Aphrodite","Artemis"],"more":"The Parthenon was paid for partly with money from Athens’ allies, collected to defend against Persia. Many sculptures from it are now in the British Museum, taken in the early 1800s by Lord Elgin. Greece has asked for decades to have them returned.","think":"Should the Parthenon sculptures go back to Greece?","sides":["Yes. They were taken from a famous building and belong with it in Athens.","Britain argues they were acquired legally and that its museum lets the whole world see them."]},{"group":1,"year":-399,"approx":false,"kind":"idea","title":"Socrates asks questions","story":"Socrates walked around Athens asking people hard questions, like “What is justice?” He wanted them to think for themselves. Some leaders thought he was a troublemaker, and he was sentenced to death.","whoa":"Socrates never wrote a book. We know his ideas because his student Plato wrote them down.","question":"How did Socrates teach?","answer":"By asking questions","wrong":["By writing books","By painting","By leading armies"],"more":"Socrates was charged with not respecting the city’s gods and corrupting the young. A jury of 501 citizens found him guilty. He could have fled but chose to drink poison, saying he should obey the laws of Athens. His method of teaching by questions is still used in classrooms.","think":"Is it a good thing to question everything?","sides":["Yes. Asking questions finds mistakes and helps people think for themselves.","Not always. Constant questioning can upset people and make it hard to agree on anything."]},{"group":1,"year":-196,"approx":false,"kind":"idea","title":"The Rosetta Stone","story":"Priests in Egypt carved the same message in three kinds of writing: hieroglyphs, an everyday Egyptian script, and Greek. The stone was lost for almost 2,000 years. When it was found in 1799, scholars used the Greek to crack the hieroglyphs.","whoa":"Jean-François Champollion finally read the hieroglyphs in 1822. The story goes that he fainted from excitement.","question":"Why was the Rosetta Stone so useful?","answer":"It had the same text in Greek and hieroglyphs","wrong":["It was made of gold","It was a treasure map","It showed the stars"],"more":"French soldiers found the stone in Egypt in 1799, and the British took it after defeating the French. It has been in the British Museum since 1802. Champollion worked out that hieroglyphs mix sound signs with picture signs. Egypt has asked for the stone to be returned.","think":"Who should own objects from the past: the country they came from, or museums that can share them?","sides":["The country of origin. They are part of that nation’s history.","Major museums. They protect objects and let visitors from everywhere learn from them."]},{"group":1,"year":-130,"approx":true,"kind":"explore","title":"The Silk Road opens","story":"The Han emperor of China sent an explorer named Zhang Qian west to find allies. His journeys opened trade routes that later stretched all the way to the Mediterranean. Silk, spices, paper and ideas all traveled along the Silk Road.","whoa":"Romans loved Chinese silk so much that some leaders complained it was draining Rome’s gold.","question":"Which country first made silk?","answer":"China","wrong":["Rome","Egypt","India"],"more":"The Silk Road was not one road but a web of routes across deserts and mountains. Few traders traveled the whole way; goods passed from merchant to merchant. Religions like Buddhism traveled along it too, and so did diseases.","think":"Is it good for distant places to be connected?","sides":["Yes. Trade spread inventions, foods and ideas that made life better.","It has costs. The same routes spread wars and plagues."]},{"group":1,"year":30,"approx":true,"kind":"idea","title":"Jesus of Nazareth","story":"Jesus was a Jewish teacher in Judea, a land ruled by Rome. He taught about loving God and your neighbor, and he was crucified by the Romans. His followers believed he rose from the dead, and Christianity grew from their message.","whoa":"The AD years in our calendar count from a monk’s estimate of when Jesus was born. Historians think the monk was off by a few years.","question":"Which empire ruled Judea in Jesus’s time?","answer":"Rome","wrong":["Persia","Egypt","Greece"],"more":"Our main sources for Jesus are the four Gospels, written a few decades after his death. Roman and Jewish writers such as Tacitus and Josephus also mention him. Within about 300 years, his followers grew from a small group to the official religion of the Roman Empire. Today Christianity is the world’s largest religion.","think":"How can a teacher with no army or office change the world?"},{"group":1,"year":80,"approx":false,"kind":"build","title":"The Colosseum opens","story":"Rome built a giant stone arena that could hold about 50,000 people. Crowds came to watch gladiators fight and wild animal shows. The opening celebrations lasted 100 days.","whoa":"Sailors pulled a huge canvas roof across the top to shade the crowd from the sun.","question":"About how many people could the Colosseum hold?","answer":"50,000","wrong":["500","5 million","5,000"],"more":"The Colosseum’s floor hid tunnels and elevators that lifted animals and fighters up through trapdoors. Many gladiators were enslaved people or prisoners, but some volunteered for fame and money. Emperors paid for free shows to keep the crowds happy.","think":"Why did Romans enjoy watching such violent shows?","sides":["The games showed Rome’s power and gave people excitement in hard lives.","Every society has violent entertainment. We still enjoy it in movies and some sports."]},{"group":1,"year":105,"approx":false,"kind":"invent","title":"Cai Lun improves paper","story":"In Han China, an official named Cai Lun found a better way to make paper from tree bark, old rags and fishing nets. It was lighter than bamboo strips and cheaper than silk. Paper slowly spread across Asia and, centuries later, to Europe.","whoa":"Paper money, playing cards and toilet paper were all first used in China.","question":"What did Cai Lun improve?","answer":"Paper","wrong":["Gunpowder","The compass","Silk"],"more":"Before paper, people wrote on bamboo strips, silk, clay, papyrus and animal skins. China kept paper-making secret for centuries. It reached the Islamic world in the 700s, where Baghdad had paper mills, and Europe after that. Cheap paper helped printing take off.","think":"What invention today is like paper was back then?","sides":["The internet. It makes sharing information cheap and fast, just like paper did.","The smartphone. It puts writing, pictures and books in everyone’s pocket."]},{"group":1,"year":122,"approx":false,"kind":"build","title":"Hadrian’s Wall","story":"Emperor Hadrian ordered a stone wall built right across northern Britain. It marked the edge of the Roman Empire. Soldiers from as far away as Syria and North Africa guarded its forts.","whoa":"Letters found at a fort nearby survive, including an invitation to a birthday party.","question":"What did Hadrian’s Wall mark?","answer":"The edge of the Roman Empire","wrong":["A race track","A royal garden","The border of China"],"more":"Hadrian’s Wall ran about 117 kilometers from coast to coast. It had gates every Roman mile, so it controlled trade and travel as much as it kept enemies out. Rome later built the Antonine Wall farther north but pulled back to Hadrian’s Wall.","think":"Do walls between countries work?","sides":["They can. Hadrian’s Wall helped Rome control its border for nearly 300 years.","Not forever. People find ways around, and walls can divide neighbors who once traded."]},{"group":2,"year":1008,"approx":true,"kind":"idea","title":"The Tale of Genji","story":"A Japanese noblewoman known as Murasaki Shikibu wrote a long story about a prince named Genji and life at the emperor’s court. Many people call it the world’s first novel. It has 54 chapters.","whoa":"Women at the Japanese court often wrote in the simpler kana script, while men were expected to write in Chinese.","question":"Who wrote The Tale of Genji?","answer":"Murasaki Shikibu","wrong":["Confucius","Marco Polo","Zheng He"],"more":"Murasaki Shikibu was a lady-in-waiting to the empress. Her book focuses on feelings, relationships and the sadness of things passing, a feeling the Japanese call mono no aware. It has been read for 1,000 years and inspired paintings, plays and even manga.","think":"What makes a story still worth reading after 1,000 years?","sides":["Its feelings. Love, jealousy and loss are the same in every age.","Its window into the past. It shows a world we can never visit."]},{"group":2,"year":1088,"approx":false,"kind":"idea","title":"The first university","story":"Students in Bologna, Italy, banded together and hired teachers to teach them law. This became the University of Bologna, the oldest university still running. Soon there were universities in Paris and Oxford too.","whoa":"At Bologna the students were in charge at first. They could fine teachers who started late.","question":"Where is the oldest university still running?","answer":"Bologna, Italy","wrong":["London","Beijing","Boston"],"more":"Medieval university students studied grammar, logic, rhetoric, math, music and astronomy before law, medicine or theology. Classes were in Latin, so students from different countries could study together. Universities like Al-Qarawiyyin in Morocco, founded in 859, are even older schools of learning.","think":"Should students be in charge of their school?","sides":["Partly. Students know what helps them learn and should have a say.","No. Teachers know the subject and need authority to teach well."]},{"group":2,"year":1150,"approx":true,"kind":"build","title":"Angkor Wat","story":"King Suryavarman II of the Khmer Empire built Angkor Wat, a vast stone temple in what is now Cambodia. Its towers stand for the home of the Hindu gods. Later it became a Buddhist temple.","whoa":"Angkor Wat appears on Cambodia’s flag.","question":"Which country is Angkor Wat in?","answer":"Cambodia","wrong":["India","Japan","Egypt"],"more":"Angkor was the center of a city that may have held up to a million people, supported by huge reservoirs and canals. Its walls show carvings of Hindu myths, including the gods churning an ocean of milk. The city declined after the 1400s, possibly due to drought and floods.","think":"Why would rulers build temples bigger than their palaces?","sides":["To honor the gods, because faith mattered more than comfort.","To show power. A giant temple says the king is close to the gods."]},{"group":2,"year":1299,"approx":true,"kind":"ruler","title":"The Ottoman Empire begins","story":"A leader named Osman ruled a small state in what is now Turkey. His family, the Ottomans, kept adding lands. Their empire lasted more than 600 years.","whoa":"The ottoman, a padded footstool, is named after them.","question":"Who founded the Ottoman Empire?","answer":"Osman","wrong":["Mehmed II","Saladin","Genghis Khan"],"more":"The Ottomans grew from a small state into an empire covering parts of Europe, Asia and Africa. They allowed many religious communities to govern their own affairs. At its height under Suleiman the Magnificent in the 1500s, it was one of the most powerful states in the world.","think":"What helps an empire last for 600 years?","sides":["Flexibility, letting different peoples keep their customs.","A strong army and government that could crush rebellions."]},{"group":2,"year":1325,"approx":false,"kind":"explore","title":"Ibn Battuta sets out","story":"Ibn Battuta left Morocco at 21 to make the pilgrimage to Mecca. Then he kept going for almost 30 years. He traveled to India, China, East Africa and Mali.","whoa":"He covered about 120,000 kilometers, far more than Marco Polo.","question":"Where was Ibn Battuta from?","answer":"Morocco","wrong":["Italy","China","Persia"],"more":"Ibn Battuta worked as a judge in India and the Maldives. He survived shipwrecks, bandits and the Black Death. When he returned home, the sultan of Morocco had a writer record his travels in a book called the Rihla, meaning “journey.”","think":"Is it better to travel far or to know your own home deeply?","sides":["Travel far. Seeing other ways of life opens your mind.","Know home deeply. There is a lifetime of discovery close by."]},{"group":3,"year":1608,"approx":false,"kind":"explore","title":"Champlain founds Quebec","story":"French explorer Samuel de Champlain built a trading post on the St. Lawrence River. It grew into Quebec City. The French traded with First Nations such as the Wendat and Innu for beaver furs.","whoa":"The name Canada comes from kanata, an Iroquoian word for village.","question":"What was the most valuable trade good in New France?","answer":"Beaver furs","wrong":["Gold","Tea","Silk"],"more":"Champlain made alliances with the Wendat, Algonquin and Innu, and joined them in battles against the Haudenosaunee. He crossed the Atlantic more than 20 times. Quebec City is one of the oldest European cities in North America, and its old stone walls still stand.","think":"Were the early French–First Nations alliances fair to both sides?","sides":["They helped both sides with trade and protection.","Over time, settlement and disease hurt First Nations far more than the French."]},{"group":3,"year":1752,"approx":false,"kind":"invent","title":"Franklin’s kite","story":"Benjamin Franklin flew a kite in a thunderstorm to show that lightning is electricity. A metal key on the string gave off sparks. He then invented the lightning rod to protect buildings.","whoa":"This is extremely dangerous. A scientist in Russia was killed trying a similar experiment the next year.","question":"What did Franklin show about lightning?","answer":"It is electricity","wrong":["It is made of fire","It is ice","It comes from the ground"],"more":"Franklin was also a printer, writer, inventor of bifocal glasses and a founder of the United States. Some historians question whether the kite experiment happened exactly as told, since Franklin described it only briefly. Lightning rods saved many buildings from fire.","think":"Is it ever okay to take big risks for science?","sides":["Sometimes. Many discoveries came from brave, risky experiments.","No. There is always a safer way, and a dead scientist discovers nothing."]},{"group":3,"year":1762,"approx":false,"kind":"life","title":"Mozart, child star","story":"Wolfgang Amadeus Mozart was writing little pieces of music by age 5. At 6, he toured the royal courts of Europe with his older sister Nannerl. He grew up to write more than 600 works.","whoa":"He could play the keyboard with a cloth covering the keys.","question":"About how old was Mozart when he began writing music?","answer":"5","wrong":["15","25","40"],"more":"Mozart’s father, Leopold, toured him around Europe for years. As an adult Mozart wrote operas, symphonies and concertos, yet often struggled with money. He died at 35. Some people wonder whether his childhood touring was good for him.","think":"Is it good for children to become famous?","sides":["It can be. Talent gets noticed, and it can open great opportunities.","It is risky. Child stars can miss a normal childhood and feel huge pressure."]},{"group":3,"year":1796,"approx":false,"kind":"invent","title":"The first vaccine","story":"Smallpox was a deadly disease. Doctor Edward Jenner noticed that milkmaids who caught mild cowpox did not get smallpox. He tested the idea and made the first vaccine.","whoa":"The word vaccine comes from vacca, Latin for cow. Smallpox was wiped out completely in 1980.","question":"Which animal’s disease led to the first vaccine?","answer":"Cow","wrong":["Pig","Chicken","Horse"],"more":"Jenner tested his idea on an eight-year-old boy, James Phipps. Many people mocked vaccination at first, and cartoons showed people growing cow heads. Today such an experiment on a child would not be allowed. Vaccines have since prevented diseases like polio and measles for millions.","think":"Was Jenner right to test his idea on a child?","sides":["It worked and has saved hundreds of millions of lives.","It was risky for the boy, and he could not truly agree to it."]},{"group":3,"year":1813,"approx":false,"kind":"battle","title":"Laura Secord’s walk","story":"During the War of 1812, American armies invaded Upper Canada. Laura Secord heard about a planned surprise attack. She walked about 30 kilometers through woods and swamps to warn the British, who won the Battle of Beaver Dams with Mohawk warriors.","whoa":"A Canadian chocolate company was named after her in 1913.","question":"What did Laura Secord do?","answer":"Walked through the woods to warn the British","wrong":["Sailed to England","Built a fort","Led the American army"],"more":"Laura Secord’s husband had been wounded at the Battle of Queenston Heights. She walked for about 18 hours. For years her story was barely known, until she became a Canadian heroine in the late 1800s. Historians note the Mohawk and other Haudenosaunee warriors did most of the fighting at Beaver Dams.","think":"Why do some heroes become famous while others are forgotten?","sides":["A good story spreads. Laura’s walk was easy to tell and remember.","Whose stories get told depends on who writes history. The warriors deserve credit too."]},{"group":3,"year":1825,"approx":false,"kind":"invent","title":"The first public railway","story":"In England, the Stockton and Darlington Railway opened, with a steam locomotive pulling coal wagons and passengers. Engineer George Stephenson drove the first train. Within 30 years, railways crossed much of Europe and North America.","whoa":"The first train went about as fast as a kid on a bicycle.","question":"What powered the first railway trains?","answer":"Steam","wrong":["Electricity","Batteries","Gasoline"],"more":"Railways let people travel in a day what used to take a week. Time zones were created partly because trains needed shared schedules. Railways also helped countries like Canada and the U.S. expand across continents, often through Indigenous lands.","think":"How did trains change ideas about time and distance?","sides":["They made the world smaller, connecting towns and families.","They also brought rushing, strict clocks and the loss of slower ways of life."]},{"group":4,"year":1859,"approx":false,"kind":"idea","title":"Darwin and evolution","story":"Charles Darwin sailed around the world on HMS Beagle and studied plants and animals, including finches and giant tortoises on the Galápagos Islands. He came to believe living things slowly change over many generations. He explained this idea, evolution by natural selection, in a book in 1859.","whoa":"He waited about 20 years before publishing his idea.","question":"Which islands he
